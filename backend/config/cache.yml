# Solid Cache (ADR 0008): em produção, guarda os contadores do limite de tentativas no
# próprio Postgres, sem banco separado. 16 MB sobram: cada contador tem poucos bytes e vale
# por no máximo 1 hora.
default: &default
  store_options:
    max_age: <%= 1.day.to_i %>
    max_size: <%= 16.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
