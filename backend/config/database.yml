# Banco: Postgres. Quando existe a variável DATABASE_URL (produção na Vercel,
# apontando para o Supabase, e a CI), o Rails usa ela no lugar destes valores.
# No seu computador, sem DATABASE_URL, vale o socket local do Postgres.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: gx_development

test:
  <<: *default
  database: gx_test

production:
  <<: *default
  # Supabase pelo pooler compartilhado (ADR 0004). Host, porta, usuário e banco ficam nas
  # variáveis de ambiente da Vercel; a senha, em DATABASE_PASSWORD, só nos painéis. Em modo
  # transação (porta 6543) o pooler não aceita prepared statements.
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV.fetch("DATABASE_PORT", 6543) %>
  username: <%= ENV["DATABASE_USER"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  database: <%= ENV.fetch("DATABASE_NAME", "postgres") %>
  prepared_statements: false
  sslmode: require
