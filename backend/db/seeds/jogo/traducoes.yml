# Nossa tradução para o português dos textos que não têm tradução oficial: carta que nunca
# saiu em português, texto da época das cartas pré-errata e os poucos textos oficiais que
# vieram quebrados da fonte (substitui: true).
# texto: o inglês que foi traduzido. Se ele mudar no cartas.yml, a tradução deixa de valer
# até alguém traduzir de novo (o teste dos dados avisa).
# Nome entre aspas segue o que o jogador vê: o nome em português, quando a carta tem.
# Escrito à mão. Deriva dos textos da Yugipedia (CC BY-SA), como o resto da pasta.
- nome: "Asura Priest"
  texto: "Cannot be Special Summoned. During the End Phase of the turn this card is Normal Summoned or flipped face-up: Return it to the hand. Can attack all monsters your opponent controls once each."
  texto_pt: "Não pode ser Invocado por Invocação-Especial. Durante a Fase Final do turno em que este card for Invocado por Invocação-Normal ou virado com a face para cima: devolva-o para a mão. Pode atacar todos os monstros que seu oponente controla, uma vez cada."
- nome: "Night Assailant"
  texto: "FLIP: Select 1 monster on your opponent's side of the field and destroy it. When this card is sent directly from your hand to the Graveyard, return 1 Flip Effect Monster from your Graveyard to your hand."
  texto_pt: "VIRE: escolha 1 monstro no campo do seu oponente e destrua-o. Quando este card for enviado diretamente da sua mão para o Cemitério, devolva 1 monstro com efeito VIRE do seu Cemitério para a sua mão."
- nome: "Sangan"
  texto: "When this card is sent from the field to the Graveyard, add 1 monster with 1500 or less ATK from your Deck to your hand. Your Deck is then shuffled."
  texto_pt: "Quando este card for enviado do campo para o Cemitério, adicione 1 monstro com 1500 ou menos de ATK do seu Deck à sua mão. Depois, embaralhe o seu Deck."
- nome: "Masked Chopper"
  texto: "If this card destroys an opponent's monster by battle, inflict 2000 damage to your opponent."
  texto_pt: "Se este card destruir um monstro do oponente em batalha, cause 2000 de dano ao seu oponente."
- nome: "Rampaging Rhynos"
  texto: "Once per turn, this card can move to an adjacent unoccupied Monster Card Zone. If this card attacks the monster in its same column, this card gains 500 ATK during the Damage Step."
  texto_pt: "Uma vez por turno, este card pode se mover para uma Zona de Monstros vizinha que esteja vazia. Se este card atacar o monstro da mesma coluna, ele ganha 500 de ATK durante a Etapa de Dano."
- nome: "Seismic Crasher"
  texto: "Twice per turn, you can send 1 face-up Continuous Spell or Continuous Trap Card you control to the Graveyard to inflict 500 damage to your opponent."
  texto_pt: "Duas vezes por turno, você pode enviar 1 Magia Contínua ou Armadilha Contínua com a face para cima que você controla para o Cemitério para causar 500 de dano ao seu oponente."
- nome: "Silent Insect"
  texto: "This card is changed to Defense Position when it is Normal Summoned or Flip Summoned. Negate the effects of all Continuous Spell Cards and Continuous Trap Cards."
  texto_pt: "Este card muda para Posição de Defesa quando for Invocado por Invocação-Normal ou por Invocação-Virar. Negue os efeitos de todas as Magias Contínuas e Armadilhas Contínuas."
- nome: "Batteryman Charger"
  texto: "When this card is Normal Summoned, you can Special Summon 1 \"Batteryman\" monster, except \"Batteryman Charger\", from your hand or Deck. This card gains 300 ATK and DEF for each Thunder-Type monster you control."
  texto_pt: "Quando este card for Invocado por Invocação-Normal, você pode Invocar por Invocação-Especial 1 monstro \"Homem-Bateria\" da sua mão ou do seu Deck, exceto \"Batteryman Charger\". Este card ganha 300 de ATK e DEF para cada monstro do Tipo Trovão que você controla."
- nome: "Batteryman Industrial Strength"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except by removing from play 2 \"Batteryman\" monsters from your Graveyard. Once per turn, you can remove from play 1 Thunder-Type monster from your Graveyard to destroy 1 monster and 1 Spell or Trap Card on the field."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto banindo 2 monstros \"Homem-Bateria\" do seu Cemitério. Uma vez por turno, você pode banir 1 monstro do Tipo Trovão do seu Cemitério para destruir 1 monstro e 1 Magia ou Armadilha no campo."
- nome: "Batteryman Micro-Cell"
  texto: "FLIP: Special Summon 1 Level 4 or lower \"Batteryman\" monster from your Deck, except \"Batteryman Micro-Cell\". After this card has been flipped face-up, when it is destroyed by battle and sent to the Graveyard, draw 1 card."
  texto_pt: "VIRE: Invoque por Invocação-Especial 1 monstro \"Homem-Bateria\" de Nível 4 ou menos do seu Deck, exceto \"Batteryman Micro-Cell\". Depois que este card for virado com a face para cima, quando ele for destruído em batalha e enviado para o Cemitério, compre 1 card."
- nome: "Card Blocker"
  texto: "When this card is Summoned: Change it to Defense Position. When a face-up monster you control is targeted for an attack: You can change the target to this card. When this card is targeted for an attack: You can choose a number from 1 to 3, then send that many cards from the top of your Deck to the Graveyard; this card gains 500 DEF for each card sent, until the End Phase."
  texto_pt: "Quando este card for Invocado: mude-o para Posição de Defesa. Quando um monstro com a face para cima que você controla for escolhido como alvo de um ataque: você pode mudar o alvo para este card. Quando este card for escolhido como alvo de um ataque: você pode escolher um número de 1 a 3 e, depois, enviar essa quantidade de cards do topo do seu Deck para o Cemitério; este card ganha 500 de DEF para cada card enviado, até a Fase Final."
- nome: "Fengsheng Mirror"
  texto: "Look at your opponent's hand. Select and discard 1 Spirit monster to the Graveyard if Spirit monsters exist in his/her hand."
  texto_pt: "Olhe a mão do seu oponente. Se houver monstros Espírito na mão dele, escolha 1 e descarte-o para o Cemitério."
- nome: "Fushi No Tori"
  texto: "This card cannot be Special Summoned. This card returns to the owner's hand during the End Phase of the turn that this card is Normal Summoned or flipped face-up. When this card inflicts Battle Damage to your opponent's Life Points, increase your Life Points by an amount equal to the Battle Damage."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card volta para a mão do dono durante a Fase Final do turno em que for Invocado por Invocação-Normal ou virado com a face para cima. Quando este card causar dano de batalha ao seu oponente, você ganha PV iguais a esse dano."
- nome: "Great Long Nose"
  texto: "This card cannot be Special Summoned. This card returns to the owner's hand during the End Phase of the turn that this card is Normal Summoned or flipped face-up. If this card inflicts Battle Damage to your opponent's Life Points, your opponent skips their next Battle Phase."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card volta para a mão do dono durante a Fase Final do turno em que for Invocado por Invocação-Normal ou virado com a face para cima. Se este card causar dano de batalha ao seu oponente, o oponente pula a próxima Fase de Batalha dele."
- nome: "Inaba White Rabbit"
  texto: "This card cannot be Special Summoned. This card returns to the owner's hand during the End Phase of the turn that this card is Normal Summoned or flipped face-up. This monster attacks your opponent's Life Points directly."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card volta para a mão do dono durante a Fase Final do turno em que for Invocado por Invocação-Normal ou virado com a face para cima. Este monstro ataca o seu oponente diretamente."
- nome: "Maharaghi"
  texto: "This card cannot be Special Summoned. This card returns to the owner's hand during the End Phase of the turn that this card is Normal Summoned or flipped face-up. If this card is Normal Summoned or flipped face-up, look at 1 card on the top of your Deck during your next Draw Phase (before you draw), and return the card to the top or the bottom of your Deck."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card volta para a mão do dono durante a Fase Final do turno em que for Invocado por Invocação-Normal ou virado com a face para cima. Se este card for Invocado por Invocação-Normal ou virado com a face para cima, olhe o card do topo do seu Deck durante a sua próxima Fase de Compra (antes de comprar) e devolva-o para o topo ou para o fundo do Deck."
- nome: "Patrol Robo"
  texto: "During your Standby Phase, you can look at 1 face-down card that's been Set by your opponent as long as this card remains face-up on the field."
  texto_pt: "Enquanto este card estiver com a face para cima no campo, durante a sua Fase de Apoio você pode olhar 1 card com a face para baixo Baixado pelo seu oponente."
- nome: "Spirit's Invitation"
  texto: "Each time your Spirit monster returns to your hand, select 1 monster on your opponent's side of the field and return it to its owner's hand. Pay 500 Life Points during each of your Standby Phases. If you do not, destroy this card."
  texto_pt: "Sempre que um monstro Espírito seu voltar para a sua mão, escolha 1 monstro no campo do seu oponente e devolva-o para a mão do dono. Pague 500 PV durante cada uma das suas Fases de Apoio. Se não pagar, destrua este card."
- nome: "Spiritual Energy Settle Machine"
  texto: "As long as this card remains face-up on the field, all Spirit monsters remain face-up on the field and do not return to their owners' hands during the End Phase even if they are Normal Summoned or flipped face-up. Discard 1 card from your hand during each of your End Phases. If you do not, destroy this card. When this card is removed from the field, all face-up Spirit monsters return to the owners' hands."
  texto_pt: "Enquanto este card estiver com a face para cima no campo, todos os monstros Espírito ficam com a face para cima no campo e não voltam para a mão do dono durante a Fase Final, mesmo que tenham sido Invocados por Invocação-Normal ou virados com a face para cima. Descarte 1 card da sua mão durante cada uma das suas Fases Finais. Se não descartar, destrua este card. Quando este card sair do campo, todos os monstros Espírito com a face para cima voltam para a mão do dono."
- nome: "Susa Soldier"
  texto: "This card cannot be Special Summoned. This card returns to the owner's hand during the End Phase of the turn that this card is Normal Summoned or flipped face-up. The Battle Damage this card inflicts to your opponent's Life Points is halved."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card volta para a mão do dono durante a Fase Final do turno em que for Invocado por Invocação-Normal ou virado com a face para cima. O dano de batalha que este card causa ao seu oponente cai pela metade."
  substitui: true
- nome: "The Unfriendly Amazon"
  texto: "Tribute 1 of your monsters on the field (excluding this monster) during each of your Standby Phases. If you do not, this card is destroyed."
  texto_pt: "Ofereça como Tributo 1 dos seus monstros no campo (exceto este) durante cada uma das suas Fases de Apoio. Se não oferecer, este card é destruído."
- nome: "Brain Control"
  texto: "Pay 800 Life Points. Select 1 face-up monster your opponent controls. Take control of it until the End Phase."
  texto_pt: "Pague 800 PV. Escolha 1 monstro com a face para cima que seu oponente controla. Assuma o controle dele até a Fase Final."
- nome: "Spiritualism"
  texto: "Target 1 Spell/Trap your opponent controls; return that target to the hand. This card's activation and effect cannot be negated."
  texto_pt: "Escolha 1 Magia/Armadilha que seu oponente controla; devolva o alvo para a mão. A ativação e o efeito deste card não podem ser negados."
- nome: "Card Rotator"
  texto: "Send 1 card from your hand to the Graveyard. Change the battle positions of all monsters your opponent controls. (Face-down Defense Position monsters are flipped to face-up Attack Position.)"
  texto_pt: "Envie 1 card da sua mão para o Cemitério. Mude a posição de batalha de todos os monstros que seu oponente controla. (Monstros com a face para baixo em Posição de Defesa são virados para Posição de Ataque com a face para cima.)"
- nome: "Chosen One"
  texto: "Select 1 Monster Card and 2 non-Monster Cards from your hand. Your opponent randomly selects 1 card among them. If it is a Monster Card, it is Special Summoned and send the remaining 2 cards to the Graveyard. If not, send all the cards to the Graveyard."
  texto_pt: "Escolha 1 Card de Monstro e 2 cards que não sejam Monstros da sua mão. Seu oponente escolhe 1 deles ao acaso. Se for um Card de Monstro, Invoque-o por Invocação-Especial e envie os outros 2 cards para o Cemitério. Se não for, envie todos para o Cemitério."
- nome: "Darkness Approaches"
  texto: "Discard 2 cards from your hand. Select 1 face-up monster and flip it face-down, but do not change its battle position."
  texto_pt: "Descarte 2 cards da sua mão. Escolha 1 monstro com a face para cima e vire-o com a face para baixo, sem mudar a posição de batalha dele."
- nome: "Dark-Piercing Light"
  texto: "Flip all face-down monsters on your opponent's side of the field face-up."
  texto_pt: "Vire com a face para cima todos os monstros com a face para baixo no campo do seu oponente."
- nome: "Eternal Drought"
  texto: "Destroy all face-up Fish-Type monsters on the field."
  texto_pt: "Destrua todos os monstros do Tipo Peixe com a face para cima no campo."
- nome: "Level Tuning"
  texto: "Reduce the Level of all face-up monsters you control by 1, until the End Phase."
  texto_pt: "Reduza em 1 o Nível de todos os monstros com a face para cima que você controla, até a Fase Final."
- nome: "Magic Reflector"
  texto: "Target 1 face-up Spell Card you control; place 1 counter on it. If it would ever be destroyed, remove the counter instead."
  texto_pt: "Escolha 1 Card de Magia com a face para cima que você controla; coloque 1 marcador nele. Se ele fosse ser destruído, em vez disso, remova o marcador."
- nome: "Mesmeric Control"
  texto: "Your opponent cannot change the battle positions of monsters during their next turn."
  texto_pt: "Seu oponente não pode mudar a posição de batalha dos monstros durante o próximo turno dele."
- nome: "Misfortune"
  texto: "Select 1 face-up monster your opponent controls. Inflict damage to your opponent equal to half that monster's original ATK. Your monsters cannot attack this turn."
  texto_pt: "Escolha 1 monstro com a face para cima que seu oponente controla. Cause dano ao seu oponente igual à metade do ATK original desse monstro. Seus monstros não podem atacar neste turno."
- nome: "Return of the Doomed"
  texto: "Discard 1 Monster Card from your hand to the Graveyard. Return 1 of your monsters destroyed and sent to your Graveyard as a result of battle during this turn to your hand at the end of this turn."
  texto_pt: "Descarte 1 Card de Monstro da sua mão para o Cemitério. No fim deste turno, devolva para a sua mão 1 dos seus monstros destruídos em batalha e enviados para o seu Cemitério durante este turno."
- nome: "Seal of the Ancients"
  texto: "Pay 1000 Life Points. Pick up and see all face-down cards on your opponent's side of the field, then return them to their original positions. (The effects of the face-down cards are not activated.)"
  texto_pt: "Pague 1000 PV. Pegue e veja todos os cards com a face para baixo no campo do seu oponente e, depois, devolva-os para as posições originais. (Os efeitos desses cards não são ativados.)"
- nome: "Spell Calling"
  texto: "When this face-down card is destroyed and sent to the Graveyard by the effect of a Spell or Trap Card controlled by your opponent, select 1 Quick-Play Spell Card from your Deck and Set it after showing it to your opponent."
  texto_pt: "Quando este card com a face para baixo for destruído e enviado para o Cemitério pelo efeito de um Card de Magia ou de Armadilha controlado pelo seu oponente, escolha 1 Card de Magia Rápida do seu Deck, mostre-o ao seu oponente e Baixe-o."
- nome: "Broken Blocker"
  texto: "Activate only when a Defense Position monster you control, whose DEF is higher than its ATK, is destroyed by battle. Special Summon up to 2 monsters with the same name as that monster from your Deck in face-up Defense Position."
  texto_pt: "Ative somente quando um monstro em Posição de Defesa que você controla, com DEF maior que o ATK, for destruído em batalha. Invoque por Invocação-Especial até 2 monstros com o mesmo nome desse monstro do seu Deck, com a face para cima em Posição de Defesa."
- nome: "Lineage of Destruction"
  texto: "Activate only during a turn in which you destroyed a Defense Position monster your opponent controlled. Select 1 Level 8 monster you control. During this turn, the selected monster can attack twice."
  texto_pt: "Ative somente durante um turno em que você destruiu um monstro em Posição de Defesa que seu oponente controlava. Escolha 1 monstro de Nível 8 que você controla. Neste turno, ele pode atacar duas vezes."
- nome: "An Unfortunate Report"
  texto: "Your opponent conducts their next Battle Phase twice."
  texto_pt: "Seu oponente realiza a próxima Fase de Batalha dele duas vezes."
- nome: "Bubble Crash"
  texto: "This card can only be activated when any player has 6 or more cards on the field and/or in their hand. The player(s) then select and send cards to their respective Graveyards until the amount remaining on the field and in their hand is 5."
  texto_pt: "Este card só pode ser ativado quando algum duelista tiver 6 ou mais cards no campo e/ou na mão. Esse duelista (ou esses duelistas) escolhe e envia cards para o próprio Cemitério até ficar com 5 cards, somando o campo e a mão."
- nome: "Deal of Phantom"
  texto: "Select 1 face-up monster on the field. Increase the selected monster's ATK by 100 points for each monster in your Graveyard during the turn this card is activated. The number of monsters is applied when this card is activated."
  texto_pt: "Escolha 1 monstro com a face para cima no campo. Ele ganha 100 de ATK para cada monstro no seu Cemitério durante o turno em que este card for ativado. O número de monstros é contado na ativação deste card."
- nome: "Destruction Punch"
  texto: "If the ATK of an attacking monster your opponent controls is lower than the DEF of the attacked Defense Position monster you control, destroy the attacking monster at the end of the Damage Step. (Damage calculation is applied normally.)"
  texto_pt: "Se o ATK de um monstro atacante que seu oponente controla for menor que a DEF do monstro atacado em Posição de Defesa que você controla, destrua o monstro atacante no fim da Etapa de Dano. (O cálculo de dano é aplicado normalmente.)"
- nome: "Energy-Absorbing Monolith"
  texto: "Chain this card to an opponent's card effect that would inflict damage to you. That damage is negated, and you gain Life Points equal to the amount you would have taken."
  texto_pt: "Encadeie este card a um efeito de card do oponente que causaria dano a você. Esse dano é negado e você ganha PV iguais ao dano que teria sofrido."
- nome: "Fine"
  texto: "Discard 2 cards."
  texto_pt: "Descarte 2 cards."
- nome: "Foolish Revival"
  texto: "Select 1 monster from your opponent's Graveyard, and Special Summon it in face-up Defense Position on your opponent's side of the field."
  texto_pt: "Escolha 1 monstro no Cemitério do seu oponente e Invoque-o por Invocação-Especial com a face para cima em Posição de Defesa no campo do seu oponente."
- nome: "Remote Revenge"
  texto: "Activate only when a monster you control is targeted by a Spell, Trap, or Effect Monster's effect that destroys 1 monster on the field. Switch the target to an appropriate monster your opponent controls."
  texto_pt: "Ative somente quando um monstro que você controla for escolhido como alvo de um efeito de Magia, Armadilha ou Monstro de Efeito que destrói 1 monstro no campo. Mude o alvo para um monstro adequado que seu oponente controla."
- nome: "Metalmorph"
  texto: "After activation, equip this card to a face-up monster. The equipped monster gains 300 ATK and DEF. When the equipped monster attacks, it gains additional ATK, during damage calculation only, equal to half the ATK of the attack target."
  texto_pt: "Depois da ativação, equipe este card a um monstro com a face para cima. O monstro equipado ganha 300 de ATK e DEF. Quando o monstro equipado atacar, ele ganha ATK adicional, apenas durante o cálculo de dano, igual à metade do ATK do alvo do ataque."
- nome: "Armed Changer"
  texto: "Send 1 Equip Spell Card from your hand to the Graveyard to activate this card. If the equipped monster destroys a monster by battle, the controller of this Equip Card can add 1 monster with ATK equal to or less than the equipped monster from their Graveyard to their hand."
  texto_pt: "Envie 1 Card de Magia de Equipamento da sua mão para o Cemitério para ativar este card. Se o monstro equipado destruir um monstro em batalha, o controlador deste Card de Equipamento pode adicionar à mão 1 monstro do Cemitério dele com ATK igual ou menor que o do monstro equipado."
- nome: "Attribute Bomb"
  texto: "Declare an Attribute. When the equipped monster is destroyed in battle by a monster of that Attribute, inflict 1000 damage to your opponent."
  texto_pt: "Declare um Atributo. Quando o monstro equipado for destruído em batalha por um monstro desse Atributo, cause 1000 de dano ao seu oponente."
- nome: "Attribute Mastery"
  texto: "Declare an Attribute. When the equipped monster fights a monster of that Attribute, that monster is destroyed without applying damage calculation."
  texto_pt: "Declare um Atributo. Quando o monstro equipado batalhar com um monstro desse Atributo, esse monstro é destruído sem aplicar o cálculo de dano."
- nome: "Heart of Clear Water"
  texto: "If the equipped monster's ATK is 1300 or higher, this card is destroyed. The monster equipped with this card is not destroyed as a result of battle or by the effect of a card that targets the monster. (Damage calculation is applied normally.)"
  texto_pt: "Se o ATK do monstro equipado for 1300 ou mais, este card é destruído. O monstro equipado com este card não é destruído em batalha nem pelo efeito de um card que o escolha como alvo. (O cálculo de dano é aplicado normalmente.)"
- nome: "Mist Body"
  texto: "The equipped monster cannot be destroyed by battle."
  texto_pt: "O monstro equipado não pode ser destruído em batalha."
- nome: "Assault Armor"
  texto: "Equip only to a Warrior-Type monster that is the only monster you control. It gains 300 ATK. During your Main Phase 1, you can send this equipped card to the Graveyard to allow the equipped monster to attack twice during each Battle Phase this turn."
  texto_pt: "Equipe somente a um monstro do Tipo Guerreiro que seja o único monstro que você controla. Ele ganha 300 de ATK. Durante a sua Fase Principal 1, você pode enviar este card equipado para o Cemitério para que o monstro equipado possa atacar duas vezes em cada Fase de Batalha neste turno."
- nome: "Chthonian Alliance"
  texto: "The equipped monster gains 800 ATK for each other face-up monster on the field that has the same name it does."
  texto_pt: "O monstro equipado ganha 800 de ATK para cada outro monstro com a face para cima no campo que tenha o mesmo nome que ele."
- nome: "Ekibyo Drakmord"
  texto: "The equipped monster cannot attack. Destroy the equipped monster at the end of its controller's 2nd turn after this card is activated. At that time, this card is returned to the owner's hand."
  texto_pt: "O monstro equipado não pode atacar. Destrua o monstro equipado no fim do 2º turno do controlador dele depois da ativação deste card. Nesse momento, este card volta para a mão do dono."
- nome: "Mirror of Yata"
  texto: "Equip only to a Spirit monster. The equipped monster does not have to have its effect that returns it to the hand activated. If it would be destroyed by battle, destroy this card instead."
  texto_pt: "Equipe somente a um monstro Espírito. O monstro equipado não precisa ativar o efeito que o devolve para a mão. Se ele fosse ser destruído em batalha, em vez disso, destrua este card."
- nome: "Morphtronic Cord"
  texto: "Equip only to a \"Morphtronic\" monster. Each time the equipped monster's battle position is changed, destroy 1 Spell or Trap Card on the field."
  texto_pt: "Equipe somente a um monstro \"Morfotrônico(a)\". Sempre que a posição de batalha do monstro equipado mudar, destrua 1 Magia ou Armadilha no campo."
- nome: "Morphtronic Engine"
  texto: "Equip only to a Level 3 \"Morphtronic\" monster. Its ATK becomes double its original ATK. During your second Standby Phase after this card's activation, destroy this card, and take damage equal to the original ATK of the equipped monster."
  texto_pt: "Equipe somente a um monstro \"Morfotrônico(a)\" de Nível 3. O ATK dele passa a ser o dobro do ATK original. Durante a sua segunda Fase de Apoio depois da ativação deste card, destrua este card e sofra dano igual ao ATK original do monstro equipado."
- nome: "Omega Goggles"
  texto: "Equip only to a monster you control. Once per turn, you can look at 1 random card in your opponent's hand. The equipped monster cannot attack the turn you activate this effect."
  texto_pt: "Equipe somente a um monstro que você controla. Uma vez por turno, você pode olhar 1 card aleatório da mão do seu oponente. O monstro equipado não pode atacar no turno em que você ativar este efeito."
- nome: "Orb of Yasaka"
  texto: "Equip only to a Spirit monster. When it destroys an opponent's monster by battle and sends it to the Graveyard, gain Life Points equal to that monster's original ATK. When the equipped monster you control is returned to the hand and this card is sent to the Graveyard, return this card to your hand."
  texto_pt: "Equipe somente a um monstro Espírito. Quando ele destruir um monstro do oponente em batalha e enviá-lo para o Cemitério, ganhe PV iguais ao ATK original desse monstro. Quando o monstro equipado que você controla voltar para a mão e este card for enviado para o Cemitério, devolva este card para a sua mão."
- nome: "Phalanx Pike"
  texto: "The equipped monster gains 900 ATK for each card in either Graveyard that has the same name it does."
  texto_pt: "O monstro equipado ganha 900 de ATK para cada card em qualquer Cemitério que tenha o mesmo nome que ele."
- nome: "Sword of Kusanagi"
  texto: "Equip only to a Spirit monster. If the equipped monster attacks a Defense Position monster, inflict piercing battle damage to your opponent. When the equipped monster you control is returned to the hand and this card is sent to the GY: Return this card to your hand."
  texto_pt: "Equipe somente a um monstro Espírito. Se o monstro equipado atacar um monstro em Posição de Defesa, cause dano de batalha perfurante ao seu oponente. Quando o monstro equipado que você controla voltar para a mão e este card for enviado para o Cemitério: devolva este card para a sua mão."
- nome: "Symbol of Heritage"
  texto: "Activate only while there are 3 Monster Cards with the same name in your Graveyard. Select 1 of those monsters, Special Summon it, and equip it with this card. When this card is destroyed, destroy the equipped monster."
  texto_pt: "Ative somente enquanto houver 3 Cards de Monstro com o mesmo nome no seu Cemitério. Escolha 1 desses monstros, Invoque-o por Invocação-Especial e equipe-o com este card. Quando este card for destruído, destrua o monstro equipado."
- nome: "Synchro Boost"
  texto: "The equipped monster gains 500 ATK, and its Level is increased by 1."
  texto_pt: "O monstro equipado ganha 500 de ATK e o Nível dele aumenta em 1."
- nome: "The Emperor's Holiday"
  texto: "Negate all Equip Card effects on the field."
  texto_pt: "Negue os efeitos de todos os Cards de Equipamento no campo."
- nome: "Vicious Claw"
  texto: "The equipped monster gains 300 ATK. If the equipped monster would be destroyed by battle, return this card to its owner's hand instead. Then, destroy 1 monster, except the one that battled the equipped monster, and inflict 600 damage to your opponent. After that, Special Summon 1 \"Evil Token\" (Fiend-Type/DARK/Level 7/ATK 2500/DEF 2500) on your opponent's side of the field. During the turn this card is returned to your hand, you cannot use \"Vicious Claw\" from your hand."
  texto_pt: "O monstro equipado ganha 300 de ATK. Se o monstro equipado fosse ser destruído em batalha, em vez disso, devolva este card para a mão do dono. Depois, destrua 1 monstro, exceto o que batalhou com o monstro equipado, e cause 600 de dano ao seu oponente. Em seguida, Invoque por Invocação-Especial 1 \"Ficha do Mal\" (Demônio/TREVAS/Nível 7/ATK 2500/DEF 2500) no campo do seu oponente. No turno em que este card voltar para a sua mão, você não pode usar \"Vicious Claw\" da sua mão."
- nome: "Woodland Sprite"
  texto: "Send 1 Equip Card equipped to this card to the Graveyard. Inflict 500 points of damage to your opponent's Life Points."
  texto_pt: "Envie 1 Card de Equipamento equipado a este card para o Cemitério. Cause 500 de dano ao seu oponente."
- nome: "Degenerate Circuit"
  texto: "The controller of this card pays 500 Life Points during each of their Standby Phases (this is not optional). Monster Cards that would be returned from the field to the hand are removed from play instead."
  texto_pt: "O controlador deste card paga 500 PV durante cada uma das Fases de Apoio dele (não é opcional). Cards de Monstro que voltariam do campo para a mão são banidos em vez disso."
- nome: "Clear Wall"
  texto: "This card is destroyed if there are no \"Clear World\" on the field. Any \"Clear\" monsters you control cannot be destroyed by battle. Any Battle Damage of 1000 or less you would receive becomes 0. When you take damage, this card is destroyed."
  texto_pt: "Este card é destruído se não houver \"Mundo Translúcido\" no campo. Os monstros \"Clear\" que você controla não podem ser destruídos em batalha. Qualquer dano de batalha de 1000 ou menos que você fosse sofrer passa a ser 0. Quando você sofrer dano, este card é destruído."
- nome: "Clear World"
  texto: "The Attributes of the monsters determine the effect on the monster's controller.\n● LIGHT: You must play with your hand revealed.\n● DARK: You cannot declare an attack.\n● EARTH: Destroy 1 monster you control during your End Phase.\n● WATER: Discard 1 card from your hand during your End Phase.\n● FIRE: Receive 1000 damage during your End Phase.\n● WIND: You cannot activate Spell Cards."
  texto_pt: "Os Atributos dos monstros definem o efeito sobre o controlador deles.\n● LUZ: você precisa jogar com a mão revelada.\n● TREVAS: você não pode declarar ataques.\n● TERRA: destrua 1 monstro que você controla durante a sua Fase Final.\n● ÁGUA: descarte 1 card da sua mão durante a sua Fase Final.\n● FOGO: sofra 1000 de dano durante a sua Fase Final.\n● VENTO: você não pode ativar Cards de Magia."
- nome: "Convulsion of Nature"
  texto: "As long as this card remains face-up on the field, both players must turn their respective Decks upside down and proceed with the current Duel."
  texto_pt: "Enquanto este card estiver com a face para cima no campo, os dois duelistas devem virar o Deck de cabeça para baixo e continuar o Duelo assim."
- nome: "Gem Flash Energy"
  texto: "During each of your Standby Phases, inflict damage to your opponent equal to the number of face-up Continuous Spell Cards on the field x 300."
  texto_pt: "Durante cada uma das suas Fases de Apoio, cause ao seu oponente dano igual ao número de Magias Contínuas com a face para cima no campo x 300."
- nome: "The Dark Door"
  texto: "Only 1 monster can attack during each Battle Phase."
  texto_pt: "Somente 1 monstro pode atacar durante cada Fase de Batalha."
- nome: "\"A\" Cell Incubator"
  texto: "Each time an A-Counter(s) is removed from play by a card effect, place 1 A-Counter on this card. When this card is destroyed, distribute the A-Counters on this card among face-up monsters."
  texto_pt: "Sempre que um ou mais Marcadores A forem removidos pelo efeito de um card, coloque 1 Marcador A neste card. Quando este card for destruído, distribua os Marcadores A deste card entre os monstros com a face para cima."
- nome: "Acidic Downpour"
  texto: "All EARTH monsters lose 500 ATK and gain 400 DEF."
  texto_pt: "Todos os monstros de TERRA perdem 500 de ATK e ganham 400 de DEF."
- nome: "Domino Effect"
  texto: "When a monster your opponent controls is destroyed by battle and sent to the Graveyard, you can send 1 monster you control to the Graveyard to destroy 1 monster your opponent controls."
  texto_pt: "Quando um monstro que seu oponente controla for destruído em batalha e enviado para o Cemitério, você pode enviar 1 monstro que você controla para o Cemitério para destruir 1 monstro que seu oponente controla."
- nome: "Gravi-Crush Dragon"
  texto: "You can send 1 face-up Continuous Spell Card you control to the Graveyard, then target 1 monster your opponent controls; destroy that target."
  texto_pt: "Você pode enviar 1 Magia Contínua com a face para cima que você controla para o Cemitério e, depois, escolher 1 monstro que seu oponente controla; destrua o alvo."
- nome: "Gravity Behemoth"
  texto: "If it is not the first turn of the Duel and there are no cards on the field, you can Normal Summon this card without Tributing. You can destroy all Field Spell Cards on the field. This card cannot attack the turn you activate this effect."
  texto_pt: "Se não for o primeiro turno do Duelo e não houver cards no campo, você pode Invocar este card por Invocação-Normal sem oferecer Tributos. Você pode destruir todas as Magias de Campo no campo. Este card não pode atacar no turno em que você ativar este efeito."
- nome: "Inspection"
  texto: "During your opponent's Standby Phase, you can pay 500 Life Points to randomly select 1 card in your opponent's hand and look at it."
  texto_pt: "Durante a Fase de Apoio do seu oponente, você pode pagar 500 PV para escolher ao acaso 1 card da mão do seu oponente e olhá-lo."
- nome: "Magna-Slash Dragon"
  texto: "You can send 1 face-up Continuous Spell Card you control to the Graveyard to destroy 1 Spell or Trap Card your opponent controls."
  texto_pt: "Você pode enviar 1 Magia Contínua com a face para cima que você controla para o Cemitério para destruir 1 Magia ou Armadilha que seu oponente controla."
- nome: "Mask of Dispel"
  texto: "Select 1 face-up Spell Card on the field. The controller of the Spell Card takes 500 points of damage during each of your Standby Phases. When the selected card is removed from the field, destroy this card."
  texto_pt: "Escolha 1 Card de Magia com a face para cima no campo. O controlador dele sofre 500 de dano durante cada uma das suas Fases de Apoio. Quando o card escolhido sair do campo, destrua este card."
- nome: "Paralyzing Chain"
  texto: "When a card(s) is sent from your opponent's Deck to the Graveyard by a card effect, inflict 300 damage to your opponent."
  texto_pt: "Quando um ou mais cards forem enviados do Deck do seu oponente para o Cemitério pelo efeito de um card, cause 300 de dano ao seu oponente."
- nome: "Poison Chain"
  texto: "During the End Phase of your turn, if you did not attack, you can make your opponent send cards equal to the number of face-up \"Iron Chain\" monsters you control from the top of their Deck to the Graveyard."
  texto_pt: "Durante a Fase Final do seu turno, se você não atacou, você pode fazer seu oponente enviar do topo do Deck dele para o Cemitério uma quantidade de cards igual ao número de monstros \"Corrente de Ferro\" com a face para cima que você controla."
- nome: "Power Zone"
  texto: "When a monster is destroyed by battle, the monster's controller takes damage equal to the destroyed monster's original ATK."
  texto_pt: "Quando um monstro for destruído em batalha, o controlador dele sofre dano igual ao ATK original do monstro destruído."
- nome: "Senet Switch"
  texto: "Once per turn, during your Main Phase, you can move 1 monster on your side of the field to an adjacent unoccupied Monster Card Zone."
  texto_pt: "Uma vez por turno, durante a sua Fase Principal, você pode mover 1 monstro do seu campo para uma Zona de Monstros vizinha que esteja vazia."
- nome: "Teleport"
  texto: "Once per turn, if your opponent controls a monster and you control no monsters, you can pay 800 Life Points to Special Summon 1 Psychic-Type monster from your hand."
  texto_pt: "Uma vez por turno, se seu oponente controlar um monstro e você não controlar nenhum, você pode pagar 800 PV para Invocar por Invocação-Especial 1 monstro do Tipo Psíquico da sua mão."
- nome: "Wetlands"
  texto: "All Aqua-Type/WATER/Level 2 or lower monsters gain 1200 ATK."
  texto_pt: "Todos os monstros do Tipo Aqua de ÁGUA de Nível 2 ou menos ganham 1200 de ATK."
- nome: "Ultimate Offering"
  texto: "During your Main Phase or your opponent's Battle Phase: You can pay 500 Life Points; immediately after this effect resolves, Normal Summon/Set 1 monster."
  texto_pt: "Durante a sua Fase Principal ou a Fase de Batalha do seu oponente: você pode pagar 500 PV; logo depois que este efeito for resolvido, Invoque por Invocação-Normal ou Baixe 1 monstro."
- nome: "Attribute Chameleon"
  texto: "Select 1 face-up monster on your opponent's field, and assign it a new Attribute, which lasts until the End Phase. You can use this effect one time a turn, and only during your opponent's turn."
  texto_pt: "Escolha 1 monstro com a face para cima no campo do seu oponente e dê a ele um novo Atributo, que vale até a Fase Final. Você pode usar este efeito uma vez por turno, e somente durante o turno do seu oponente."
- nome: "Attribute Gravity"
  texto: "If there are face-up monsters of the same Attribute on both player's fields, any monsters able to attack must attack monsters of the same Attribute."
  texto_pt: "Se houver monstros com a face para cima do mesmo Atributo nos campos dos dois duelistas, os monstros que podem atacar devem atacar monstros desse mesmo Atributo."
- nome: "Skull Lair"
  texto: "Remove from play any number of Monster Cards in your Graveyard to destroy 1 face-up monster on the field whose Level is equal to the number of the cards you removed from play."
  texto_pt: "Bana qualquer número de Cards de Monstro do seu Cemitério para destruir 1 monstro com a face para cima no campo cujo Nível seja igual ao número de cards banidos."
- nome: "Bottomless Shifting Sand"
  texto: "At the end of your opponent's turn, destroy the face-up monster(s) with the highest ATK on the field. During your own Standby Phase, if you have 4 or less cards in your hand, this card is destroyed."
  texto_pt: "No fim do turno do seu oponente, destrua o monstro (ou os monstros) com a face para cima de maior ATK no campo. Durante a sua Fase de Apoio, se você tiver 4 cards ou menos na mão, este card é destruído."
- nome: "Cloak and Dagger"
  texto: "Declare 1 Monster Card name. If your opponent Normal Summons, Special Summons, or flips that monster(s) face-up, remove that monster(s) and this card from play."
  texto_pt: "Declare o nome de 1 Card de Monstro. Se seu oponente Invocar por Invocação-Normal, Invocação-Especial ou virar com a face para cima um ou mais desses monstros, bana esses monstros e este card."
- nome: "Cry Havoc!"
  texto: "You can remove from play 1 monster from your Graveyard to Normal Summon or Set 1 Normal Monster from your hand. You can only activate this effect during your Main Phase."
  texto_pt: "Você pode banir 1 monstro do seu Cemitério para Invocar por Invocação-Normal ou Baixar 1 Monstro Normal da sua mão. Você só pode ativar este efeito durante a sua Fase Principal."
- nome: "Dark Cure"
  texto: "When your opponent Summons a monster(s), they gain Life Points equal to half the ATK of 1 of the Summoned monsters of your choice."
  texto_pt: "Quando seu oponente Invocar um ou mais monstros, ele ganha PV iguais à metade do ATK de 1 dos monstros Invocados, à sua escolha."
- nome: "Doppelganger"
  texto: "When you take damage from the effect of a monster your opponent controls, inflict the same amount of damage to your opponent."
  texto_pt: "Quando você sofrer dano pelo efeito de um monstro que seu oponente controla, cause a mesma quantidade de dano ao seu oponente."
- nome: "Elemental Absorber"
  texto: "Remove from play 1 Monster Card in your hand to activate this card. Your opponent's monsters that have the same Attribute as the monster removed by this effect cannot declare an attack."
  texto_pt: "Bana 1 Card de Monstro da sua mão para ativar este card. Os monstros do seu oponente com o mesmo Atributo do monstro banido por este efeito não podem declarar ataques."
- nome: "Goblin Fan"
  texto: "When a Level 2 or lower monster is Flip Summoned, destroy it. Its effects do not activate at that time."
  texto_pt: "Quando um monstro de Nível 2 ou menos for Invocado por Invocação-Virar, destrua-o. Os efeitos dele não são ativados nesse momento."
- nome: "Hard-sellin' Goblin"
  texto: "Each time a monster you control inflicts Battle Damage to your opponent, return 1 card in your opponent's Spell & Trap Card Zone to its owner's hand."
  texto_pt: "Sempre que um monstro que você controla causar dano de batalha ao seu oponente, devolva 1 card da Zona de Magias & Armadilhas do seu oponente para a mão do dono."
- nome: "Hard-sellin' Zombie"
  texto: "Each time a monster you control inflicts Battle Damage to your opponent, select 1 card from your opponent's Graveyard and return it to the bottom of their Deck."
  texto_pt: "Sempre que um monstro que você controla causar dano de batalha ao seu oponente, escolha 1 card do Cemitério do seu oponente e devolva-o para o fundo do Deck dele."
- nome: "Limit Reverse"
  texto: "Target 1 monster with 1000 or less ATK in your GY; Special Summon it in Attack Position. If the target is changed to Defense Position, destroy it and this card. When this card leaves the field, destroy the target. When the target is destroyed, destroy this card."
  texto_pt: "Escolha 1 monstro com 1000 ou menos de ATK no seu Cemitério; Invoque-o por Invocação-Especial em Posição de Ataque. Se o alvo mudar para Posição de Defesa, destrua-o e este card. Quando este card sair do campo, destrua o alvo. Quando o alvo for destruído, destrua este card."
- nome: "Morphtronic Monitron"
  texto: "When a \"Morphtronic\" monster is Summoned, you can change it to face-up Defense Position."
  texto_pt: "Quando um monstro \"Morfotrônico(a)\" for Invocado, você pode mudá-lo para Posição de Defesa com a face para cima."
- nome: "Portable Battery Pack"
  texto: "Select 2 \"Batteryman\" monsters from your Graveyard and Special Summon them in Attack Position. When this card is removed from the field, destroy those monsters. When both of those monsters have been removed from the field, destroy this card."
  texto_pt: "Escolha 2 monstros \"Homem-Bateria\" do seu Cemitério e Invoque-os por Invocação-Especial em Posição de Ataque. Quando este card sair do campo, destrua esses monstros. Quando os dois monstros tiverem saído do campo, destrua este card."
- nome: "Sanguine Swamp"
  texto: "If you control any other Spell or Trap Cards, destroy this card. Face-down Spell and Trap Cards cannot be activated. Destroy this card during your 2nd Standby Phase after activation."
  texto_pt: "Se você controlar qualquer outro Card de Magia ou de Armadilha, destrua este card. Magias e Armadilhas com a face para baixo não podem ser ativadas. Destrua este card durante a sua 2ª Fase de Apoio depois da ativação."
- nome: "Swiftstrike Armor"
  texto: "During your Draw Phase, each time you draw a \"Six Samurai\" Monster Card(s): You can reveal it; Special Summon it."
  texto_pt: "Durante a sua Fase de Compra, sempre que você comprar um ou mais Cards de Monstro \"Seis Samurai\": você pode revelá-lo; Invoque-o por Invocação-Especial."
- nome: "Tour of Doom"
  texto: "During your opponent's Standby Phase, toss a coin: ● Heads: Your opponent cannot Normal or Flip Summon until the End Phase. ● Tails: You cannot Normal or Flip Summon during your next turn."
  texto_pt: "Durante a Fase de Apoio do seu oponente, lance uma moeda:\n● Cara: seu oponente não pode Invocar por Invocação-Normal nem por Invocação-Virar até a Fase Final.\n● Coroa: você não pode Invocar por Invocação-Normal nem por Invocação-Virar durante o seu próximo turno."
- nome: "Transmigration Break"
  texto: "Any cards that would be returned to the Deck from the Graveyard are removed from play instead."
  texto_pt: "Qualquer card que voltaria do Cemitério para o Deck é banido em vez disso."
- nome: "Dark Balter the Terrible"
  texto: "\"Possessed Dark Soul\" + \"Frontier Wiseman\"\nA Fusion Summon of this monster can only be conducted with the above Fusion Material Monsters. When a Normal Spell Card is activated, negate the effect by paying 1000 Life Points. The effect of an Effect Monster that this monster destroys as a result of battle is negated."
  texto_pt: "\"Alma Negra Possuída\" + \"Sábio da Fronteira\"\nA Invocação-Fusão deste monstro só pode ser feita com os Monstros Matéria de Fusão acima. Quando um Card de Magia Normal for ativado, você pode pagar 1000 PV para negar o efeito. O efeito de um Monstro de Efeito que este monstro destruir em batalha é negado."
  substitui: true
- nome: "Anti-Fusion Device"
  texto: "Destroy 1 face-up Fusion Monster on the field."
  texto_pt: "Destrua 1 Monstro de Fusão com a face para cima no campo."
- nome: "Beastking of the Swamps"
  texto: "You can substitute this card for any 1 Fusion Material Monster. When you do this, the other Fusion Material Monster(s) must be the correct one(s)."
  texto_pt: "Este card pode substituir qualquer 1 Monstro Matéria de Fusão. Quando fizer isso, os outros Monstros Matéria de Fusão precisam ser os corretos."
- nome: "Chain Material"
  texto: "Any time you Fusion Summon a monster this turn, you can remove from play, from your side of the field, Deck, hand or Graveyard, Fusion Material Monsters that are listed on the Fusion Monster Card, and use them as Fusion Material Monsters. You cannot attack during the turn this card is activated. If you used this effect for a Fusion Summon, the Summoned Fusion Monster(s) is destroyed during the End Phase."
  texto_pt: "Sempre que você Invocar um monstro por Invocação-Fusão neste turno, você pode banir do seu campo, Deck, mão ou Cemitério os Monstros Matéria de Fusão listados no Card de Monstro de Fusão e usá-los como Monstros Matéria de Fusão. Você não pode atacar no turno em que ativar este card. Se você usou este efeito numa Invocação-Fusão, os Monstros de Fusão Invocados são destruídos durante a Fase Final."
- nome: "Chthonian Polymer"
  texto: "Activate only when your opponent Fusion Summons a Fusion Monster. Tribute 1 monster to take control of that Fusion Monster."
  texto_pt: "Ative somente quando seu oponente Invocar um Monstro de Fusão por Invocação-Fusão. Ofereça 1 monstro como Tributo para assumir o controle desse Monstro de Fusão."
- nome: "Dimension Explosion"
  texto: "Return 1 face-up Fusion Monster you control to the Extra Deck. Both players select up to 2 of their monsters that are removed from play, and Special Summon them."
  texto_pt: "Devolva 1 Monstro de Fusão com a face para cima que você controla para o Deck Adicional. Cada duelista escolhe até 2 dos próprios monstros banidos e Invoca-os por Invocação-Especial."
- nome: "Fusion Devourer"
  texto: "If this card battles a Fusion Monster, that Fusion Monster's ATK becomes 0 during the Damage Step only."
  texto_pt: "Se este card batalhar com um Monstro de Fusão, o ATK desse Monstro de Fusão passa a ser 0 apenas durante a Etapa de Dano."
- nome: "Memory Crusher"
  texto: "If this card successfully attacks directly, inflict 100 damage to your opponent for each card in their Extra Deck."
  texto_pt: "Se este card atacar diretamente, cause 100 de dano ao seu oponente para cada card no Deck Adicional dele."
- nome: "Monster Eye"
  texto: "You can pay 1000 Life Points; add 1 \"Polymerization\" from your Graveyard to your hand."
  texto_pt: "Você pode pagar 1000 PV; adicione 1 \"Polimerização\" do seu Cemitério à sua mão."
- nome: "Mystical Sheep 1"
  texto: "You can substitute this card for any 1 Fusion-Material Monster. When you do this, the other Fusion-Material Monster(s) must be the correct one(s)."
  texto_pt: "Este card pode substituir qualquer 1 Monstro Matéria de Fusão. Quando fizer isso, os outros Monstros Matéria de Fusão precisam ser os corretos."
- nome: "Revoke Fusion"
  texto: "Discard 1 \"Polymerization\" to the Graveyard. Send 1 Fusion Monster from your Extra Deck to your Graveyard and Special Summon 1 monster from your hand that is listed as a Fusion Material Monster on that card. The Special Summoned monster is sent to the Graveyard during the End Phase of this turn."
  texto_pt: "Descarte 1 \"Polimerização\" para o Cemitério. Envie 1 Monstro de Fusão do seu Deck Adicional para o Cemitério e Invoque por Invocação-Especial, da sua mão, 1 monstro listado como Monstro Matéria de Fusão nesse card. O monstro Invocado por Invocação-Especial é enviado para o Cemitério durante a Fase Final deste turno."
- nome: "Ritual Sealing"
  texto: "Destroy 1 face-up Ritual Monster on the field."
  texto_pt: "Destrua 1 Monstro de Ritual com a face para cima no campo."
- nome: "Robolady"
  texto: "A warrior fully covered with metal. It upgrades by fusing with \"Roboyarou\"."
  texto_pt: "Uma guerreira toda coberta de metal. Ela fica mais forte ao se fundir com \"Robosoldado\"."
- nome: "Samsara"
  texto: "Monster Cards Tributed for a Ritual Summon are returned to the owner's Deck instead of being sent to the Graveyard."
  texto_pt: "Os Cards de Monstro oferecidos como Tributo para uma Invocação-Ritual voltam para o Deck do dono em vez de irem para o Cemitério."
- nome: "Super Robolady"
  texto: "\"Robolady\" + \"Roboyarou\"\nYou can Special Summon \"Super Roboyarou\" by returning this card from the field to the Extra Deck. You cannot use this effect during the same turn this monster is Special Summoned. In addition, increase the ATK of this monster by 1000 points during the Damage Step when this monster inflicts Direct Damage to your opponent's Life Points."
  texto_pt: "\"Robodama\" + \"Robosoldado\"\nVocê pode Invocar \"Super Roboyarou\" por Invocação-Especial devolvendo este card do campo para o Deck Adicional. Você não pode usar este efeito no mesmo turno em que este monstro for Invocado por Invocação-Especial. Além disso, este monstro ganha 1000 de ATK durante a Etapa de Dano quando causar dano direto ao seu oponente."
- nome: "Super Roboyarou"
  texto: "\"Roboyarou\" + \"Robolady\"\nYou can Special Summon \"Super Robolady\" by returning this card from the field to the Extra Deck. You cannot use this effect during the same turn this monster is Special Summoned. In addition, increase the ATK of this monster by 1000 points during the Damage Step when this monster battles with a monster."
  texto_pt: "\"Robosoldado\" + \"Robodama\"\nVocê pode Invocar \"Super Robodama\" por Invocação-Especial devolvendo este card do campo para o Deck Adicional. Você não pode usar este efeito no mesmo turno em que este monstro for Invocado por Invocação-Especial. Além disso, este monstro ganha 1000 de ATK durante a Etapa de Dano quando batalhar com um monstro."
- nome: "Supply"
  texto: "FLIP: Return 2 Fusion-Material monsters that were sent to the Graveyard as a result of a Fusion Summon to your hand."
  texto_pt: "VIRE: devolva para a sua mão 2 Monstros Matéria de Fusão que foram enviados para o Cemitério por uma Invocação-Fusão."
- nome: "After the Struggle"
  texto: "This card can only be activated during Main Phase 1. All monsters on both sides of the field that have been involved in damage calculation are destroyed during the End Step of the turn."
  texto_pt: "Este card só pode ser ativado durante a Fase Principal 1. Todos os monstros dos dois campos que participaram de um cálculo de dano são destruídos na Etapa Final do turno."
- nome: "Bait Doll"
  texto: "Target 1 Set card in the Spell & Trap Card Zone; reveal that target, force its activation if it is a Trap Card, then negate its effect if the activation timing is incorrect, and if you do, destroy it. (If it is not a Trap Card, return it face-down.) When this card resolves, shuffle it into the Deck instead of sending it to the Graveyard."
  texto_pt: "Escolha 1 card Baixado na Zona de Magias & Armadilhas; revele o alvo e, se for um Card de Armadilha, force a ativação dele; depois, se a ativação estiver fora do momento certo, negue o efeito e, se isso acontecer, destrua-o. (Se não for um Card de Armadilha, devolva-o com a face para baixo.) Quando este card for resolvido, embaralhe-o no Deck em vez de enviá-lo para o Cemitério."
- nome: "Double Snare"
  texto: "Target 1 face-up card on the field that has an effect that negates Trap effects; destroy it."
  texto_pt: "Escolha 1 card com a face para cima no campo que tenha um efeito que nega efeitos de Armadilha; destrua-o."
- nome: "Lightwave Tuning"
  texto: "Select 1 Level 4 LIGHT monster you control. It is treated as a Tuner monster while it is face-up on the field."
  texto_pt: "Escolha 1 monstro de LUZ de Nível 4 que você controla. Ele é tratado como um monstro Regulador enquanto estiver com a face para cima no campo."
- nome: "The Mask of Remnants"
  texto: "When this card is activated: Shuffle this card from the field into the Deck. While this card is equipped to a monster by the effect of \"Masked Beast Des Gardius\", take control of that monster."
  texto_pt: "Quando este card for ativado: embaralhe este card do campo no Deck. Enquanto este card estiver equipado a um monstro pelo efeito de \"Masked Beast Des Gardius\", assuma o controle desse monstro."
- nome: "Morphtronic Accelerator"
  texto: "Return 1 \"Morphtronic\" monster from your hand to the Deck. Destroy 1 card on the field, and draw 1 card."
  texto_pt: "Devolva 1 monstro \"Morfotrônico(a)\" da sua mão para o Deck. Destrua 1 card no campo e compre 1 card."
- nome: "Psi-Impulse"
  texto: "Tribute 1 Psychic-Type monster. Return all cards in your opponent's hand to the Deck. Then, they draw 3 cards."
  texto_pt: "Ofereça como Tributo 1 monstro do Tipo Psíquico. Devolva todos os cards da mão do seu oponente para o Deck. Depois, ele compra 3 cards."
- nome: "Restructer Revolution"
  texto: "Inflict 200 points of damage to your opponent's Life Points for each card in your opponent's hand."
  texto_pt: "Cause 200 de dano ao seu oponente para cada card na mão dele."
- nome: "Ruthless Denial"
  texto: "Select 1 monster you control and send it to the Graveyard, and send 1 random card in your opponent's hand to the Graveyard."
  texto_pt: "Escolha 1 monstro que você controla e envie-o para o Cemitério; envie também 1 card aleatório da mão do seu oponente para o Cemitério."
- nome: "Short Circuit"
  texto: "Activate only if you control 3 or more \"Batteryman\" monsters. Destroy all cards your opponent controls."
  texto_pt: "Ative somente se você controlar 3 ou mais monstros \"Homem-Bateria\". Destrua todos os cards que seu oponente controla."
- nome: "Timidity"
  texto: "Neither player can destroy Set Spell and Trap Cards on the field until your opponent's next End Phase."
  texto_pt: "Nenhum duelista pode destruir Magias e Armadilhas Baixadas no campo até a próxima Fase Final do seu oponente."
- nome: "Unity"
  texto: "Select 1 monster on your side of the field. The DEF of the selected monster becomes equal to the combined original DEF of all face-up monsters on your side of the field, until the end of this turn."
  texto_pt: "Escolha 1 monstro do seu campo. Até o fim deste turno, a DEF dele passa a ser igual à soma da DEF original de todos os monstros com a face para cima do seu campo."
- nome: "Yu-Jo Friendship"
  texto: "Offer your opponent a handshake. If they accept your handshake, each player's Life Points become half the combined Life Points of both players. If you have \"Unity\" in your hand and show it to your opponent, they must accept the handshake."
  texto_pt: "Ofereça um aperto de mão ao seu oponente. Se ele aceitar, os PV de cada duelista passam a ser a metade da soma dos PV dos dois. Se você tiver \"Unity\" na mão e mostrá-lo ao seu oponente, ele precisa aceitar o aperto de mão."
- nome: "Mind Crush"
  texto: "Declare 1 card name. If your opponent has the declared card(s) in their hand, discard all of the declared card(s) to the Graveyard. Otherwise, you randomly discard 1 card."
  texto_pt: "Declare o nome de 1 card. Se seu oponente tiver esse card na mão, descarte todas as cópias dele para o Cemitério. Se não tiver, você descarta 1 card aleatório."
- nome: "Zero Sprite"
  texto: "Equip this card to 1 monster on the field. The equipped monster's original ATK becomes 0, but it can attack twice during the same Battle Phase."
  texto_pt: "Equipe este card a 1 monstro no campo. O ATK original do monstro equipado passa a ser 0, mas ele pode atacar duas vezes na mesma Fase de Batalha."
- nome: "Bamboo Scrap"
  texto: "Tribute 1 Plant-Type monster. Special Summon 2 \"Plant Tokens\" (Plant-Type/EARTH/Level 1/ATK 800/DEF 500) to your opponent's side of the field in Defense Position."
  texto_pt: "Ofereça como Tributo 1 monstro do Tipo Planta. Invoque por Invocação-Especial 2 \"Fichas de Planta\" (Planta/TERRA/Nível 1/ATK 800/DEF 500) no campo do seu oponente, em Posição de Defesa."
- nome: "Battle Mania"
  texto: "Activate only during your opponent's Standby Phase. All face-up monsters your opponent controls are changed to Attack Position, and cannot change their battle positions this turn. All monsters your opponent currently controls must attack this turn, if able."
  texto_pt: "Ative somente durante a Fase de Apoio do seu oponente. Todos os monstros com a face para cima que seu oponente controla mudam para Posição de Ataque e não podem mudar a posição de batalha neste turno. Todos os monstros que seu oponente controla agora devem atacar neste turno, se puderem."
- nome: "Blasting Fuse"
  texto: "If all zones of this card's column are occupied, while this card is Set: Destroy all cards in this column."
  texto_pt: "Se todas as zonas da coluna deste card estiverem ocupadas, enquanto este card estiver Baixado: destrua todos os cards desta coluna."
- nome: "Brutal Potion"
  texto: "This card becomes an Equip Card, and equips to 1 monster you control. Once per turn, when you inflict damage to your opponent with a card effect, the equipped monster gains 1000 ATK until the End Phase."
  texto_pt: "Este card vira um Card de Equipamento e é equipado a 1 monstro que você controla. Uma vez por turno, quando você causar dano ao seu oponente com o efeito de um card, o monstro equipado ganha 1000 de ATK até a Fase Final."
- nome: "Confusion Chaff"
  texto: "Activate only when your opponent declares a second direct attack during the same Battle Phase. Conduct battle between the attacking monster and the first monster that attacked directly (other effects cannot be activated during this battle)."
  texto_pt: "Ative somente quando seu oponente declarar um segundo ataque direto na mesma Fase de Batalha. Faça o monstro atacante batalhar com o primeiro monstro que atacou diretamente (outros efeitos não podem ser ativados durante essa batalha)."
- nome: "Dark Coffin"
  texto: "When this face-down card is destroyed and sent to the Graveyard, your opponent selects and executes 1 of the following effects:\n● Discard 1 random card in their hand.\n● Select 1 monster on their side of the field and destroy it."
  texto_pt: "Quando este card com a face para baixo for destruído e enviado para o Cemitério, seu oponente escolhe e aplica 1 destes efeitos:\n● Descartar 1 card aleatório da mão dele.\n● Escolher 1 monstro no campo dele e destruí-lo."
- nome: "Dark Spirit of the Silent"
  texto: "Activate only when an opponent's monster declares an attack. Negate that attack, and select another face-up monster your opponent controls. That monster attacks instead. (If it is in face-up Defense Position, change it to Attack Position.)"
  texto_pt: "Ative somente quando um monstro do oponente declarar um ataque. Negue esse ataque e escolha outro monstro com a face para cima que seu oponente controla. Esse monstro ataca no lugar. (Se ele estiver em Posição de Defesa com a face para cima, mude-o para Posição de Ataque.)"
- nome: "Defensive Tactics"
  texto: "If you control a face-up \"Gladiator Beast\" monster: For the rest of this turn, monsters you control cannot be destroyed by battle, and any Battle Damage you take is reduced to 0. After this card resolves, put it on the bottom of your Deck."
  texto_pt: "Se você controlar um monstro \"Besta Gladiadora\" com a face para cima: pelo resto deste turno, os monstros que você controla não podem ser destruídos em batalha e qualquer dano de batalha que você sofrer passa a ser 0. Depois que este card for resolvido, coloque-o no fundo do seu Deck."
- nome: "Equip Shot"
  texto: "Activate only during the Battle Phase. Select 1 Equip Card equipped to a face-up Attack Position monster you control, and select 1 face-up Attack Position monster your opponent controls. Equip that monster with the selected Equip Card. Then, conduct battle between your previously equipped monster and the selected monster (other effects cannot be activated during this battle)."
  texto_pt: "Ative somente durante a Fase de Batalha. Escolha 1 Card de Equipamento equipado a um monstro com a face para cima em Posição de Ataque que você controla e escolha 1 monstro com a face para cima em Posição de Ataque que seu oponente controla. Equipe esse monstro com o Card de Equipamento escolhido. Depois, faça o seu monstro que estava equipado batalhar com o monstro escolhido (outros efeitos não podem ser ativados durante essa batalha)."
- nome: "Flashbang"
  texto: "Activate only after damage calculation when a monster your opponent controls made a direct attack. It is now the End Phase of this turn."
  texto_pt: "Ative somente depois do cálculo de dano, quando um monstro que seu oponente controla tiver feito um ataque direto. O turno passa para a Fase Final."
- nome: "Froggy Forcefield"
  texto: "Activate only when a face-up \"Frog\" monster you control, except \"Frog the Jam\", is selected as an attack target. Destroy all Attack Position monsters your opponent controls."
  texto_pt: "Ative somente quando um monstro \"Sapo\" com a face para cima que você controla, exceto \"Frog the Jam\", for escolhido como alvo de um ataque. Destrua todos os monstros em Posição de Ataque que seu oponente controla."
- nome: "Gemini Trap Hole"
  texto: "Activate only when a Gemini monster that is treated as an Effect Monster is destroyed by battle. Destroy all monsters your opponent controls."
  texto_pt: "Ative somente quando um monstro Gêmeos tratado como Monstro de Efeito for destruído em batalha. Destrua todos os monstros que seu oponente controla."
- nome: "Interdimensional Warp"
  texto: "Select a monster you control and a monster with an A-Counter(s) your opponent controls. Switch control of those monsters."
  texto_pt: "Escolha 1 monstro que você controla e 1 monstro com um ou mais Marcadores A que seu oponente controla. Troque o controle desses monstros."
- nome: "Judgment of the Pharaoh"
  texto: "Pay half of your Life Points. Select and activate an appropriate effect which can be applied:\n● If \"Yu-Jo Friendship\" is in your Graveyard, until the end of this turn: your opponent cannot Normal Summon, Set, Flip Summon, or Special Summon a monster(s) or activate an Effect Monster's effect.\n● If \"Unity\" is in your Graveyard, until the end of this turn: negate the effects of all Spell and Trap Cards on your opponent's side of the field, and your opponent cannot activate or Set Spell or Trap Cards."
  texto_pt: "Pague metade dos seus PV. Escolha e ative um dos efeitos que puder ser aplicado:\n● Se \"Yu-Jo Friendship\" estiver no seu Cemitério, até o fim deste turno: seu oponente não pode Invocar por Invocação-Normal, Baixar, Invocar por Invocação-Virar ou por Invocação-Especial nenhum monstro nem ativar efeitos de Monstros de Efeito.\n● Se \"Unity\" estiver no seu Cemitério, até o fim deste turno: negue os efeitos de todos os Cards de Magia e de Armadilha no campo do seu oponente, e seu oponente não pode ativar nem Baixar Cards de Magia ou de Armadilha."
- nome: "Judgment of Thunder"
  texto: "Activate only when you Summon a Thunder-Type monster(s). Destroy 1 card your opponent controls."
  texto_pt: "Ative somente quando você Invocar um ou mais monstros do Tipo Trovão. Destrua 1 card que seu oponente controla."
- nome: "Life Equalizer"
  texto: "Activate only when the difference between both players' Life Points is 8000 or more. Both players' Life Points become 3000."
  texto_pt: "Ative somente quando a diferença entre os PV dos dois duelistas for de 8000 ou mais. Os PV dos dois duelistas passam a ser 3000."
- nome: "Morphtransition"
  texto: "Activate only when a face-up \"Morphtronic\" monster you control is selected as an attack target. Negate the attack, and change the battle position of the selected \"Morphtronic\" monster."
  texto_pt: "Ative somente quando um monstro \"Morfotrônico(a)\" com a face para cima que você controla for escolhido como alvo de um ataque. Negue o ataque e mude a posição de batalha desse monstro \"Morfotrônico(a)\"."
- nome: "Mystical Refpanel"
  texto: "Activate only when a Spell Card that targets 1 player is activated. The effect of that Spell Card is applied to the other player instead."
  texto_pt: "Ative somente quando for ativado um Card de Magia que escolhe 1 duelista como alvo. O efeito desse Card de Magia é aplicado ao outro duelista em vez disso."
- nome: "Next to be Lost"
  texto: "Select 1 face-up monster you control. Send 1 card from your Deck to the Graveyard with the same name as the selected card."
  texto_pt: "Escolha 1 monstro com a face para cima que você controla. Envie do seu Deck para o Cemitério 1 card com o mesmo nome dele."
- nome: "Psychic Trigger"
  texto: "Activate only while your Life Points are lower than your opponent's. Select 2 Psychic-Type monsters in your Graveyard. Remove them from play and draw 2 cards."
  texto_pt: "Ative somente enquanto os seus PV forem menores que os do seu oponente. Escolha 2 monstros do Tipo Psíquico no seu Cemitério. Bana-os e compre 2 cards."
- nome: "Return Soul"
  texto: "Activate only during the End Phase. You can return up to 3 monsters destroyed this turn from the Graveyard to their owners' Decks."
  texto_pt: "Ative somente durante a Fase Final. Você pode devolver do Cemitério para o Deck do dono até 3 monstros destruídos neste turno."
- nome: "Revival Gift"
  texto: "Select 1 Tuner monster from your Graveyard and Special Summon it. Its effects are negated. Special Summon 2 \"Gift Fiend Tokens\" (Fiend-Type/DARK/Level 3/ATK 1500/DEF 1500) to your opponent's side of the field."
  texto_pt: "Escolha 1 monstro Regulador do seu Cemitério e Invoque-o por Invocação-Especial. Os efeitos dele são negados. Invoque por Invocação-Especial 2 \"Fichas de Demônio Presente\" (Demônio/TREVAS/Nível 3/ATK 1500/DEF 1500) no campo do seu oponente."
- nome: "Royal Writ of Taxation"
  texto: "Activate only during your opponent's Standby Phase. Select 1 random card from your opponent's hand and look at it. Unless the selected card or a card with the same name is Normal Summoned or activated by the end of your next turn, inflict 1000 damage to your opponent. If the selected card or a card with the same name is Normal Summoned or activated by the end of your next turn, you take 1000 damage."
  texto_pt: "Ative somente durante a Fase de Apoio do seu oponente. Escolha 1 card aleatório da mão do seu oponente e olhe-o. Se nem esse card nem outro com o mesmo nome for Invocado por Invocação-Normal ou ativado até o fim do seu próximo turno, cause 1000 de dano ao seu oponente. Se esse card, ou outro com o mesmo nome, for Invocado por Invocação-Normal ou ativado até o fim do seu próximo turno, você sofre 1000 de dano."
- nome: "Synchro Deflector"
  texto: "Activate only when a face-up Synchro Monster you control is selected as an attack target. Negate the attack and destroy 1 monster your opponent controls."
  texto_pt: "Ative somente quando um Monstro Sincro com a face para cima que você controla for escolhido como alvo de um ataque. Negue o ataque e destrua 1 monstro que seu oponente controla."
- nome: "Synchro Strike"
  texto: "Target Synchro Summoned monster gains 500 ATK for each Synchro Material Monster used to Summon it, until the End Phase."
  texto_pt: "O monstro escolhido como alvo, Invocado por Invocação-Sincro, ganha 500 de ATK para cada Monstro Matéria Sincro usado para Invocá-lo, até a Fase Final."
- nome: "Updraft"
  texto: "Remove all Fog Counters from the field. Inflict 300 damage to your opponent for each Fog Counter you removed."
  texto_pt: "Remova todos os Marcadores de Névoa do campo. Cause 300 de dano ao seu oponente para cada Marcador de Névoa removido."
- nome: "Weed Out"
  texto: "Pay 500 Life Points. Destroy all face-up Attack Position Level 3 monsters."
  texto_pt: "Pague 500 PV. Destrua todos os monstros de Nível 3 com a face para cima em Posição de Ataque."
- nome: "Alien Mother"
  texto: "If this card destroys a monster with an A-Counter by battle and sends it to the Graveyard, Special Summon the destroyed monster to your side of the field at the end of the Battle Phase. When this card is removed from the field, all monsters that were Special Summoned by this card's effect are destroyed."
  texto_pt: "Se este card destruir em batalha um monstro com um Marcador A e enviá-lo para o Cemitério, Invoque por Invocação-Especial o monstro destruído no seu campo no fim da Fase de Batalha. Quando este card sair do campo, todos os monstros Invocados por Invocação-Especial pelo efeito deste card são destruídos."
- nome: "Shadow Delver"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it be treated as an Effect Monster with this effect:\n● Once per turn, you can select 1 face-up Level 4 or lower DARK monster you control. It can attack your opponent directly this turn."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● Uma vez por turno, você pode escolher 1 monstro de TREVAS de Nível 4 ou menos com a face para cima que você controla. Ele pode atacar o seu oponente diretamente neste turno."
- nome: "Greenkappa"
  texto: "FLIP: Target 2 Set Spell/Trap Cards on the field; destroy those targets."
  texto_pt: "VIRE: escolha 2 Magias/Armadilhas Baixadas no campo; destrua os alvos."
- nome: "Hidden Soldiers"
  texto: "When your opponent Normal or Flip Summons a monster: Special Summon 1 Level 4 or lower DARK monster from your hand."
  texto_pt: "Quando seu oponente Invocar um monstro por Invocação-Normal ou por Invocação-Virar: Invoque por Invocação-Especial 1 monstro de TREVAS de Nível 4 ou menos da sua mão."
- nome: "Alien Psychic"
  texto: "This card is changed to Defense Position when it is Normal Summoned or Flip Summoned. Monsters with A-Counters cannot declare an attack."
  texto_pt: "Este card muda para Posição de Defesa quando for Invocado por Invocação-Normal ou por Invocação-Virar. Monstros com Marcadores A não podem declarar ataques."
- nome: "Dark Effigy"
  texto: "If you Tribute Summon a DARK Normal Monster, you can treat this 1 monster as 2 Tributes."
  texto_pt: "Se você Invocar por Invocação-Tributo um Monstro Normal de TREVAS, você pode considerar este monstro como 2 Tributos."
- nome: "Dark Nephthys"
  texto: "If you have 3 or more DARK monsters in your Graveyard and this card in your hand: You can banish 2 of them from your Graveyard; send this card from your hand to the Graveyard. During your next Standby Phase after this card was sent to the Graveyard by this effect: Special Summon this card from the Graveyard. When this card is Special Summoned: Target 1 Spell/Trap Card on the field; destroy that target."
  texto_pt: "Se você tiver 3 ou mais monstros de TREVAS no seu Cemitério e este card na sua mão: você pode banir 2 deles do seu Cemitério; envie este card da sua mão para o Cemitério. Durante a sua próxima Fase de Apoio depois que este card for enviado para o Cemitério por este efeito: Invoque este card do Cemitério por Invocação-Especial. Quando este card for Invocado por Invocação-Especial: escolha 1 Card de Magia/Armadilha no campo; destrua o alvo."
- nome: "Dragon Seeker"
  texto: "When this card is Normal Summoned or Flip Summoned, destroy 1 face-up Dragon-Type monster on the field."
  texto_pt: "Quando este card for Invocado por Invocação-Normal ou por Invocação-Virar, destrua 1 monstro do Tipo Dragão com a face para cima no campo."
- nome: "Goblin Black Ops"
  texto: "This card can attack your opponent directly. If this card attacks, it is changed to Defense Position at the end of the Battle Phase. This card's battle position cannot be changed until the end of your next turn, except with a card effect."
  texto_pt: "Este card pode atacar o seu oponente diretamente. Se este card atacar, ele muda para Posição de Defesa no fim da Fase de Batalha. A posição de batalha deste card não pode mudar até o fim do seu próximo turno, exceto pelo efeito de um card."
- nome: "Inferno Hammer"
  texto: "When this card destroys your opponent's monster and sends it to the Graveyard as a result of battle, you can select 1 face-up monster on your opponent's side of the field and flip it into face-down Defense Position."
  texto_pt: "Quando este card destruir um monstro do seu oponente em batalha e enviá-lo para o Cemitério, você pode escolher 1 monstro com a face para cima no campo do seu oponente e virá-lo com a face para baixo em Posição de Defesa."
- nome: "Masked Beast Des Gardius"
  texto: "Cannot be Normal Summoned/Set. Must first be Special Summoned (from your hand) by Tributing 2 monsters, including at least 1 \"Grand Tiki Elder\" or \"Melchid the Four-Face Beast\". If this card is sent from the field to your GY: Target 1 face-up monster your opponent controls; equip 1 \"The Mask of Remnants\" from your Deck to it."
  texto_pt: "Não pode ser Invocado por Invocação-Normal nem Baixado. Deve primeiro ser Invocado por Invocação-Especial (da sua mão) oferecendo como Tributo 2 monstros, incluindo pelo menos 1 \"Grand Tiki Elder\" ou \"Melchid, a Besta de Quatro Faces\". Se este card for enviado do campo para o seu Cemitério: escolha 1 monstro com a face para cima que seu oponente controla; equipe-o com 1 \"The Mask of Remnants\" do seu Deck."
- nome: "Mucus Yolk"
  texto: "This card can attack your opponent's Life Points directly. Each time this card inflicts Battle Damage to your opponent's Life Points, increase the ATK of this card by 1000 points during your next Standby Phase. The ATK increase lasts as long as this card remains face-up on the field."
  texto_pt: "Este card pode atacar o seu oponente diretamente. Sempre que este card causar dano de batalha ao seu oponente, ele ganha 1000 de ATK durante a sua próxima Fase de Apoio. O aumento de ATK vale enquanto este card estiver com a face para cima no campo."
- nome: "Needle Ball"
  texto: "FLIP: You can pay 2000 Life Points to inflict 1000 damage to your opponent."
  texto_pt: "VIRE: você pode pagar 2000 PV para causar 1000 de dano ao seu oponente."
- nome: "Nuvia the Wicked"
  texto: "If this monster is Normal Summoned, destroy this card. If your opponent controls any monster, decrease the ATK of this card by 200 points for each monster on your opponents side of the field."
  texto_pt: "Se este monstro for Invocado por Invocação-Normal, destrua este card. Se seu oponente controlar algum monstro, este card perde 200 de ATK para cada monstro no campo do seu oponente."
- nome: "Regenerating Rose"
  texto: "When this card is destroyed by battle and sent to the Graveyard, you can Special Summon 2 \"Regenerating Rose Tokens\" (Plant-Type/DARK/Level 3/ATK 1200/DEF 1200)."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, você pode Invocar por Invocação-Especial 2 \"Fichas de Rosa Regenerante\" (Planta/TREVAS/Nível 3/ATK 1200/DEF 1200)."
- nome: "Samsara Lotus"
  texto: "During your End Phase, if you control no Spell or Trap Cards, you can Special Summon this card from your Graveyard in face-up Attack Position. This card's controller takes 1000 damage during each of their Standby Phases."
  texto_pt: "Durante a sua Fase Final, se você não controlar Cards de Magia ou de Armadilha, você pode Invocar este card do seu Cemitério por Invocação-Especial com a face para cima em Posição de Ataque. O controlador deste card sofre 1000 de dano durante cada uma das Fases de Apoio dele."
- nome: "Sphere of Chaos"
  texto: "While this card is face-up on the field its Attribute is also treated as LIGHT. Once per turn, this card cannot be destroyed by battle. When this card is Tribute Summoned, you can add 1 Level 3 monster from your Deck to your hand."
  texto_pt: "Enquanto este card estiver com a face para cima no campo, o Atributo dele também é tratado como LUZ. Uma vez por turno, este card não pode ser destruído em batalha. Quando este card for Invocado por Invocação-Tributo, você pode adicionar 1 monstro de Nível 3 do seu Deck à sua mão."
- nome: "Sword of Dark Rites"
  texto: "Equip only to a DARK monster. It gains 400 ATK. When the equipped monster is Tributed and this card is sent to the Graveyard, return this card to your hand."
  texto_pt: "Equipe somente a um monstro de TREVAS. Ele ganha 400 de ATK. Quando o monstro equipado for oferecido como Tributo e este card for enviado para o Cemitério, devolva este card para a sua mão."
- nome: "The Big Saturn"
  texto: "Cannot be Special Summoned from the hand or Deck. Once per turn: You can discard 1 card and pay 1000 Life Points; this card gains 1000 ATK until the End Phase. When this card in your possession is destroyed by your opponent's card effect and sent to your Graveyard: Both players take damage equal to this card's ATK in the Graveyard."
  texto_pt: "Não pode ser Invocado por Invocação-Especial da mão nem do Deck. Uma vez por turno: você pode descartar 1 card e pagar 1000 PV; este card ganha 1000 de ATK até a Fase Final. Quando este card em sua posse for destruído pelo efeito de um card do seu oponente e enviado para o seu Cemitério: os dois duelistas sofrem dano igual ao ATK deste card no Cemitério."
- nome: "The Dark Creator"
  texto: "Cannot be Normal Summoned/Set. Must first be Special Summoned (from your hand) by having 5 or more DARK monsters in your Graveyard while you control no monsters. Once per turn: You can banish 1 DARK monster from your Graveyard to target 1 DARK monster in your Graveyard; Special Summon that target."
  texto_pt: "Não pode ser Invocado por Invocação-Normal nem Baixado. Deve primeiro ser Invocado por Invocação-Especial (da sua mão) enquanto você tiver 5 ou mais monstros de TREVAS no seu Cemitério e não controlar nenhum monstro. Uma vez por turno: você pode banir 1 monstro de TREVAS do seu Cemitério para escolher 1 monstro de TREVAS no seu Cemitério; Invoque o alvo por Invocação-Especial."
