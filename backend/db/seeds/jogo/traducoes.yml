- nome: "King Pyron"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it be treated as an Effect Monster with this effect:\n● Once per turn, you can inflict 1000 damage to your opponent."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● Uma vez por turno, você pode causar 1000 de dano ao seu oponente."
