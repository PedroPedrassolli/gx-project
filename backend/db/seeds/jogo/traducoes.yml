  texto_pt: "Se você Invocar este card por Invocação-Tributo oferecendo como Tributo 1 dos monstros a seguir, ele ganha o efeito correspondente:\n● Batteryman D: negue o efeito de um Card de Magia ou de Armadilha que escolha somente este card como alvo.\n● Batteryman C: durante a batalha entre este card atacante e um monstro em Posição de Defesa cuja DEF seja menor que o ATK deste card, cause a diferença como dano de batalha ao seu oponente.\n● Batteryman AA: este card ganha 1000 de ATK."
- nome: "Alien Grey"
  texto: "FLIP: Place 1 A-Counter on 1 face-up monster on your opponent's side of the field. (If a monster with an A-Counter battles an \"Alien\" monster, it loses 300 ATK and DEF for each A-Counter during damage calculation only.) After this card has been flipped face-up, when it is destroyed by battle and sent to the Graveyard, draw 1 card."
  texto_pt: "VIRE: coloque 1 Marcador A em 1 monstro com a face para cima no lado do campo do seu oponente. (Se um monstro com Marcador A batalhar com um monstro \"Alien\", ele perde 300 de ATK e DEF para cada Marcador A, apenas durante o cálculo de dano.) Depois que este card tiver sido virado com a face para cima, quando ele for destruído em batalha e enviado para o Cemitério, compre 1 card."
- nome: "Batteryman D"
  texto: "Your opponent cannot select a Thunder-Type monster you control as an attack target (except \"Batteryman D\")."
  texto_pt: "Seu oponente não pode escolher como alvo de ataque um monstro do Tipo Trovão que você controla (exceto \"Batteryman D\")."
- nome: "Shine Palace"
  texto: "Equip only to a LIGHT monster. It gains 700 ATK."
  texto_pt: "Equipe somente a um monstro de LUZ. Ele ganha 700 de ATK."
- nome: "Dawnbreak Gardna"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it be treated as an Effect Monster with this effect:\n● The original DEF of this card becomes 2300."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● A DEF original deste card passa a ser 2300."
- nome: "Dreamsprite"
  texto: "When attacked by your opponent's monster, select another 1 of your Monster Cards and designate it as the attack's target, then calculate damage."
  texto_pt: "Quando for atacado por um monstro do seu oponente, escolha outro dos seus Cards de Monstro e designe-o como alvo do ataque; depois, calcule o dano."
- nome: "Elf's Light"
  texto: "A LIGHT monster equipped with this card increases its ATK by 400 points and decreases its DEF by 200 points."
  texto_pt: "Um monstro de LUZ equipado com este card ganha 400 de ATK e perde 200 de DEF."
- nome: "Emes the Infinity"
  texto: "Each time this card destroys an opponent's monster and sends it to the Graveyard as a result of battle, increase the ATK of this card by 700 points."
  texto_pt: "Sempre que este card destruir um monstro do oponente em batalha e enviá-lo para o Cemitério, aumente o ATK deste card em 700."
- nome: "Emperor of Lightning"
  texto: "This card cannot be Special Summoned. This card must be Tribute Summoned by Tributing 3 Thunder-Type monsters on your side of the field. If this card attacks your opponent's Life Points directly and makes them 0, the controller of this card wins the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card deve ser Invocado por Invocação-Tributo oferecendo como Tributo 3 monstros do Tipo Trovão no seu lado do campo. Se este card atacar os PV do seu oponente diretamente e reduzi-los a 0, o controlador deste card vence a Partida."
- nome: "Interplanetary Invader \"A\""
  texto: "Gain control of a monster that attacks this face-up Attack Position card, at the end of the Battle Phase."
  texto_pt: "No fim da Fase de Batalha, assuma o controle de um monstro que atacar este card em Posição de Ataque com a face para cima."
- nome: "Metal Shooter"
  texto: "When this card is Normal Summoned, place 2 counters on it. This card gains 800 ATK for each of these counters on it. If this card would be destroyed by a card effect, remove 1 of this card's counters instead."
  texto_pt: "Quando este card for Invocado por Invocação-Normal, coloque 2 marcadores nele. Este card ganha 800 de ATK para cada um desses marcadores nele. Se este card fosse ser destruído pelo efeito de um card, em vez disso, remova 1 dos marcadores deste card."
- nome: "Morphtronic Radion"
  texto: "● While in Attack Position: \"Morphtronic\" monsters you control gain 800 ATK. ● While in Defense Position: \"Morphtronic\" monsters you control gain 1000 DEF."
  texto_pt: "● Em Posição de Ataque: monstros \"Morfotrônico(a)\" que você controla ganham 800 de ATK.\n● Em Posição de Defesa: monstros \"Morfotrônico(a)\" que você controla ganham 1000 de DEF."
- nome: "Neo-Spacian Twinkle Moss"
  texto: "This card's name is also treated as \"Neo-Spacian Glow Moss\". This card cannot be Special Summoned except with \"NEX\". When this card attacks or is attacked, draw 1 card. Reveal that card, and based on its type apply the proper effect: ● Monster: End the Battle Phase. ● Spell: You can change this card's attack to a direct attack. ● Trap: This monster is changed to Defense Position."
  texto_pt: "O nome deste card também é tratado como \"Musgo Brilhante Neoespacial\". Este card não pode ser Invocado por Invocação-Especial, exceto com \"NEX\". Quando este card atacar ou for atacado, compre 1 card. Revele esse card e, de acordo com o tipo dele, aplique o efeito correspondente:\n● Monstro: encerre a Fase de Batalha.\n● Magia: você pode transformar o ataque deste card em um ataque direto.\n● Armadilha: este monstro muda para Posição de Defesa."
- nome: "Radiant Spirit"
  texto: "When this card is destroyed by battle and sent to the Graveyard, destroy all face-down and non-LIGHT monsters."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, destrua todos os monstros com a face para baixo e todos os que não sejam de LUZ."
- nome: "Sage of Silence"
  texto: "If this card destroys an opponent's monster by battle, your opponent cannot activate Spell Cards during the next turn."
  texto_pt: "Se este card destruir um monstro do oponente em batalha, seu oponente não pode ativar Cards de Magia durante o próximo turno."
- nome: "Sage of Stillness"
  texto: "If this card destroys an opponent's monster by battle, your opponent cannot activate Trap Cards during the next turn."
  texto_pt: "Se este card destruir um monstro do oponente em batalha, seu oponente não pode ativar Cards de Armadilha durante o próximo turno."
- nome: "Servant of Catabolism"
  texto: "This monster may attack your opponent's Life Points directly."
  texto_pt: "Este monstro pode atacar os PV do seu oponente diretamente."
- nome: "Soul of Purity and Light"
  texto: "This card cannot be Normal Summoned or Set. This card can only be Special Summoned by removing from play 2 LIGHT monsters in your Graveyard. All monsters your opponent controls lose 300 ATK during their Battle Phase only."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card só pode ser Invocado por Invocação-Especial banindo 2 monstros de LUZ do seu Cemitério. Todos os monstros que seu oponente controla perdem 300 de ATK, somente durante a Fase de Batalha dele."
- nome: "Teva"
  texto: "When this card is Tribute Summoned successfully, your opponent cannot declare an attack during his/her next turn."
  texto_pt: "Quando este card for Invocado por Invocação-Tributo com sucesso, seu oponente não pode declarar ataques durante o próximo turno dele."
- nome: "Worm Barses"
  texto: "When this card is Normal Summoned: Target 1 Defense Position monster; change that target to face-up Attack Position."
  texto_pt: "Quando este card for Invocado por Invocação-Normal: escolha 1 monstro em Posição de Defesa; mude o alvo para Posição de Ataque com a face para cima."
- nome: "Worm Cartaros"
  texto: "FLIP: Add 1 Level 4 or lower Reptile-Type \"Worm\" monster from your Deck to your hand."
  texto_pt: "VIRE: adicione 1 monstro \"Worm\" do Tipo Réptil de Nível 4 ou menos do seu Deck à sua mão."
- nome: "Worm Dimikles"
  texto: "FLIP: This card gains 300 ATK and DEF."
  texto_pt: "VIRE: este card ganha 300 de ATK e DEF."
- nome: "Worm Erokin"
  texto: "This card cannot be Special Summoned. Once per turn, select 1 face-up Reptile-Type \"Worm\" monster on the field and change it to face-down Defense Position."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Uma vez por turno, escolha 1 monstro \"Worm\" do Tipo Réptil com a face para cima no campo e mude-o para Posição de Defesa com a face para baixo."
- nome: "Worm Falco"
  texto: "FLIP: Change all face-up Reptile-Type \"Worm\" monsters you control to face-down Defense Position, except this card."
  texto_pt: "VIRE: mude todos os monstros \"Worm\" do Tipo Réptil com a face para cima que você controla, exceto este card, para Posição de Defesa com a face para baixo."
- nome: "Worm Gulse"
  texto: "Each time a face-down Defense Position monster is flipped face-up, place 1 Worm Counter on this card. This card gains 300 ATK for each Worm Counter on it."
  texto_pt: "Sempre que um monstro em Posição de Defesa com a face para baixo for virado com a face para cima, coloque 1 Marcador de Verme neste card. Este card ganha 300 de ATK para cada Marcador de Verme nele."
- nome: "Worm Hope"
  texto: "FLIP: When this card is flipped face-up by an opponent's monster's attack, draw 1 card.\nWhen this card is sent from the field to the Graveyard, send 1 card from your hand to the Graveyard."
  texto_pt: "VIRE: quando este card for virado com a face para cima pelo ataque de um monstro do oponente, compre 1 card.\nQuando este card for enviado do campo para o Cemitério, envie 1 card da sua mão para o Cemitério."
- nome: "Worm Illidan"
  texto: "Each time a card is Set on your side of the field, place 1 Worm Counter on this card. You can remove 2 Worm Counters from this card to select 1 card your opponent controls, and destroy it."
  texto_pt: "Sempre que um card for Baixado no seu lado do campo, coloque 1 Marcador de Verme neste card. Você pode remover 2 Marcadores de Verme deste card para escolher 1 card que seu oponente controla e destruí-lo."
- nome: "Worm King"
  texto: "This card can be Tribute Summoned in face-up Attack Position by Tributing 1 Reptile-Type \"Worm\" monster. You can Tribute 1 Reptile-Type \"Worm\" monster to select 1 card your opponent controls, and destroy it."
  texto_pt: "Este card pode ser Invocado por Invocação-Tributo com a face para cima em Posição de Ataque oferecendo como Tributo 1 monstro \"Worm\" do Tipo Réptil. Você pode oferecer como Tributo 1 monstro \"Worm\" do Tipo Réptil para escolher 1 card que seu oponente controla e destruí-lo."
- nome: "Green Baboon, Defender of the Forest"
  texto: "When a face-up Beast monster you control is destroyed and sent to the GY, while this card is in your hand or GY (except during the Damage Step): You can pay 1000 LP; Special Summon this card."
  texto_pt: "Quando um monstro Besta com a face para cima que você controla for destruído e enviado para o Cemitério, enquanto este card estiver na sua mão ou no Cemitério (exceto durante a Etapa de Dano): você pode pagar 1000 PV; Invoque este card por Invocação-Especial."
- nome: "Rescue Cat"
  texto: "You can send this face-up card to the Graveyard to Special Summon 2 Level 3 or lower Beast-Type monsters from your Deck. Those monsters are destroyed during the End Phase."
  texto_pt: "Você pode enviar este card com a face para cima para o Cemitério para Invocar por Invocação-Especial 2 monstros do Tipo Besta de Nível 3 ou menos do seu Deck. Esses monstros são destruídos durante a Fase Final."
- nome: "Alien Shocktrooper"
  texto: "The Aliens have used a mysterious biological substance to create a supreme race of soldiers. They do not have the natural powers of the other Aliens, but can make stunning physical attacks."
  texto_pt: "Os Aliens usaram uma misteriosa substância biológica para criar uma raça suprema de soldados. Eles não têm os poderes naturais dos outros Aliens, mas são capazes de ataques físicos impressionantes."
- nome: "Alien Infiltrator"
  texto: "Once per turn, this card can move to an adjacent unoccupied Monster Card Zone. If no Spell, Trap or Monster Card on your opponent's side of the field is in the same column as this card, it can attack your opponent directly."
  texto_pt: "Uma vez por turno, este card pode se mover para uma Zona de Monstros vizinha que esteja vazia. Se nenhum Card de Magia, Armadilha ou Monstro no lado do campo do seu oponente estiver na mesma coluna deste card, ele pode atacar o seu oponente diretamente."
- nome: "Alien Warrior"
  texto: "When this card is destroyed by battle and sent to the Graveyard, place 2 A-Counters on the monster that destroyed it. (If a monster with an A-Counter battles an \"Alien\" monster, it loses 300 ATK and DEF for each A-Counter during damage calculation only.)"
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, coloque 2 Marcadores A no monstro que o destruiu. (Se um monstro com Marcador A batalhar com um monstro \"Alien\", ele perde 300 de ATK e DEF para cada Marcador A, apenas durante o cálculo de dano.)"
- nome: "Commander Gottoms, Swordmaster"
  texto: "All face-up \"Saber\" monsters you control gain 400 ATK."
  texto_pt: "Todos os monstros \"Sabre\" com a face para cima que você controla ganham 400 de ATK."
- nome: "Big Piece Golem"
  texto: "If your opponent controls a monster and you control no monsters, you can Normal Summon this card without Tributes."
  texto_pt: "Se seu oponente controlar um monstro e você não controlar nenhum, você pode Invocar este card por Invocação-Normal sem Tributos."
- nome: "Earth Effigy"
  texto: "This card can be treated as 2 Tributes for the Tribute Summon of an EARTH Normal Monster."
  texto_pt: "Este card pode ser considerado como 2 Tributos para a Invocação-Tributo de um Monstro Normal de TERRA."
- nome: "Gallis the Star Beast"
  texto: "You can reveal this card in your hand; send the top card of your Deck to the Graveyard, then, if it was a monster, inflict damage to your opponent equal to its Level x 200 and Special Summon this card from your hand, otherwise destroy this card."
  texto_pt: "Você pode revelar este card na sua mão; envie o card do topo do seu Deck para o Cemitério e, depois, se for um monstro, cause dano ao seu oponente igual ao Nível dele x 200 e Invoque este card da sua mão por Invocação-Especial; caso contrário, destrua este card."
- nome: "Gigantic Cephalotus"
  texto: "This card gains 200 ATK each time a Plant-Type monster is sent from the field to the Graveyard."
  texto_pt: "Este card ganha 200 de ATK sempre que um monstro do Tipo Planta for enviado do campo para o Cemitério."
- nome: "Iron Chain Snake"
  texto: "During your Main Phase, you can equip this card to 1 face-up monster your opponent controls. That monster loses 800 ATK and DEF. When it is destroyed by battle and sent to the Graveyard, its controller sends cards equal to its Level from the top of their Deck to the Graveyard."
  texto_pt: "Durante a sua Fase Principal, você pode equipar este card a 1 monstro com a face para cima que seu oponente controla. Esse monstro perde 800 de ATK e DEF. Quando ele for destruído em batalha e enviado para o Cemitério, o controlador dele envia do topo do Deck para o Cemitério uma quantidade de cards igual ao Nível dele."
- nome: "Lady Panther"
  texto: "Tribute this face-up card to return 1 of your monsters destroyed as a result of battle during this turn to the top of your Deck."
  texto_pt: "Ofereça este card com a face para cima como Tributo para devolver ao topo do seu Deck 1 dos seus monstros destruídos em batalha neste turno."
- nome: "Karakuri Spider"
  texto: "If this card attacks a DARK monster, destroy the attack target after damage calculation."
  texto_pt: "Se este card atacar um monstro de TREVAS, destrua o alvo do ataque depois do cálculo de dano."
- nome: "Medium Piece Golem"
  texto: "When this card is Summoned, if you control a \"Big Piece Golem\", you can Special Summon 1 \"Small Piece Golem\" from your Deck. That monster's effect is negated while it is face-up on the field."
  texto_pt: "Quando este card for Invocado, se você controlar um \"Big Piece Golem\", você pode Invocar por Invocação-Especial 1 \"Small Piece Golem\" do seu Deck. O efeito desse monstro é negado enquanto ele estiver com a face para cima no campo."
- nome: "Morphtronic Magnen"
  texto: "● While in Attack Position: If your opponent controls a face-up monster, this card can only select their highest ATK monster as an attack target. ● While in Defense Position: Your opponent cannot select another monster as an attack target."
  texto_pt: "● Em Posição de Ataque: se seu oponente controlar um monstro com a face para cima, este card só pode escolher como alvo de ataque o monstro dele com o maior ATK.\n● Em Posição de Defesa: seu oponente não pode escolher outro monstro como alvo de ataque."
- nome: "Nettles"
  texto: "If this face-up card would be destroyed, you can destroy 1 face-up Plant-Type monster you control instead."
  texto_pt: "Se este card com a face para cima fosse ser destruído, em vez disso, você pode destruir 1 monstro do Tipo Planta com a face para cima que você controla."
- nome: "Raging Earth"
  texto: "When this card is destroyed by battle and sent to the Graveyard, destroy all face-down and non-EARTH monsters."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, destrua todos os monstros com a face para baixo e todos os que não sejam de TERRA."
- nome: "Razor Lizard"
  texto: "While you control another Reptile-Type monster, if this card attacks a face-down Defense Position monster, destroy the monster immediately with this card's effect without flipping it face-up or applying damage calculation."
  texto_pt: "Enquanto você controlar outro monstro do Tipo Réptil, se este card atacar um monstro em Posição de Defesa com a face para baixo, destrua esse monstro imediatamente com o efeito deste card, sem virá-lo com a face para cima nem aplicar o cálculo de dano."
- nome: "Sauropod Brachion"
  texto: "When a monster(s) is Summoned to your opponent's side of the field, change this card to Defense Position."
  texto_pt: "Quando um ou mais monstros forem Invocados no lado do campo do seu oponente, mude este card para Posição de Defesa."
- nome: "Small Piece Golem"
  texto: "When this card is Summoned, if you control a \"Big Piece Golem\", you can Special Summon 1 \"Medium Piece Golem\" from your Deck. That monster's effect is negated while it is face-up on the field."
  texto_pt: "Quando este card for Invocado, se você controlar um \"Big Piece Golem\", você pode Invocar por Invocação-Especial 1 \"Medium Piece Golem\" do seu Deck. O efeito desse monstro é negado enquanto ele estiver com a face para cima no campo."
- nome: "Wall of Ivy"
  texto: "FLIP: Special Summon 1 \"Ivy Token\" (Plant-Type/EARTH/Level 1/ATK 0/DEF 0) in Defense Position to your opponent's side of the field. When this Token is destroyed, its controller takes 300 damage."
  texto_pt: "VIRE: Invoque por Invocação-Especial 1 \"Ficha de Hera\" (Planta/TERRA/Nível 1/ATK 0/DEF 0) em Posição de Defesa no lado do campo do seu oponente. Quando esta Ficha for destruída, o controlador dela sofre 300 de dano."
- nome: "Wodan the Resident of the Forest"
  texto: "Increase this card's ATK by 100 points for every Plant-Type monster that is face-up on the field."
  texto_pt: "Aumente o ATK deste card em 100 para cada monstro do Tipo Planta com a face para cima no campo."
- nome: "X-Saber Axel"
  texto: "While you control this face-up card, when a \"Saber\" monster is destroyed by battle and sent to the Graveyard, draw 1 card."
  texto_pt: "Enquanto você controlar este card com a face para cima, quando um monstro \"Sabre\" for destruído em batalha e enviado para o Cemitério, compre 1 card."
- nome: "X-Saber Uruz"
  texto: "When this card destroys an opponent's monster by battle and sends it to the Graveyard, you can Tribute this card to return the destroyed card to the top of its owner's Deck."
  texto_pt: "Quando este card destruir um monstro do oponente em batalha e enviá-lo para o Cemitério, você pode oferecer este card como Tributo para devolver o card destruído ao topo do Deck do dono."
- nome: "Greed Quasar"
  texto: "This card's original ATK and DEF are each equal to its Level x 300. This monster's Level is increased by the Level of monsters it destroys by battle."
  texto_pt: "O ATK e a DEF originais deste card são, cada um, iguais ao Nível dele x 300. O Nível deste monstro aumenta de acordo com o Nível dos monstros que ele destruir em batalha."
- nome: "Puppet King"
  texto: "When your opponent adds a Monster Card(s) to their hand, except by drawing, you can Special Summon this card from your hand. If you do, destroy it during your next turn's End Phase."
  texto_pt: "Quando seu oponente adicionar um ou mais Cards de Monstro à mão, exceto comprando, você pode Invocar este card da sua mão por Invocação-Especial. Se fizer isso, destrua-o durante a Fase Final do seu próximo turno."
- nome: "Ancient Gear Cannon"
  texto: "You can Tribute this card; inflict 500 damage to your opponent, and if you do, neither player can activate Trap Cards during the Battle Phase of this turn."
  texto_pt: "Você pode oferecer este card como Tributo; cause 500 de dano ao seu oponente e, se fizer isso, nenhum duelista pode ativar Cards de Armadilha durante a Fase de Batalha deste turno."
- nome: "Ancient Gear Drill"
  texto: "If you control an \"Ancient Gear\" monster: Discard 1 card; Set 1 Spell Card directly from your Deck. This turn, that Spell Card cannot be activated."
  texto_pt: "Se você controlar um monstro \"Mecanismo Antigo\": descarte 1 card; Baixe 1 Card de Magia diretamente do seu Deck. Neste turno, esse Card de Magia não pode ser ativado."
- nome: "Ancient Gear Explosive"
  texto: "Target 1 \"Ancient Gear\" monster you control; destroy it, and if you do, inflict damage to your opponent equal to half its original ATK."
  texto_pt: "Escolha 1 monstro \"Mecanismo Antigo\" que você controla; destrua-o e, se fizer isso, cause dano ao seu oponente igual à metade do ATK original dele."
- nome: "Ancient Gear Factory"
  texto: "Reveal 1 Level 5 or higher \"Ancient Gear\" monster from your hand, then banish a number of \"Ancient Gear\" monsters from your Graveyard, whose combined Levels are double the revealed monster's, and if you do, if you Normal Summon the revealed monster this turn, you must Normal Smmon it without Tributing."
  texto_pt: "Revele 1 monstro \"Mecanismo Antigo\" de Nível 5 ou mais da sua mão; depois, bana do seu Cemitério monstros \"Mecanismo Antigo\" cuja soma dos Níveis seja o dobro do Nível do monstro revelado e, se fizer isso, se você Invocar o monstro revelado por Invocação-Normal neste turno, você deve Invocá-lo sem oferecer Tributos."
- nome: "Ancient Gear Fist"
  texto: "Equip only to an \"Ancient Gear\" monster. At the end of the Damage Step, if the equipped monster battled a monster and is still on the field: Destroy the monster it battled."
  texto_pt: "Equipe somente a um monstro \"Mecanismo Antigo\". No fim da Etapa de Dano, se o monstro equipado tiver batalhado com um monstro e ainda estiver no campo: destrua o monstro com que ele batalhou."
- nome: "Ancient Gear Tank"
  texto: "Equip only to an \"Ancient Gear\" monster. It gains 600 ATK. When this card is destroyed and sent to the Graveyard: Inflict 600 damage to your opponent."
  texto_pt: "Equipe somente a um monstro \"Mecanismo Antigo\". Ele ganha 600 de ATK. Quando este card for destruído e enviado para o Cemitério: cause 600 de dano ao seu oponente."
- nome: "Colosseum - Cage of the Gladiator Beasts"
  texto: "Place 1 Counter on this card each time a monster is Special Summoned from either player's Deck. All \"Gladiator Beast\" monsters gain 100 ATK and DEF for each of these counters on this card. If this card would be destroyed by a card effect, you can discard 1 \"Colosseum - Cage of the Gladiator Beasts\" to prevent this card from being destroyed."
  texto_pt: "Coloque 1 marcador neste card sempre que um monstro for Invocado por Invocação-Especial do Deck de qualquer duelista. Todos os monstros \"Besta Gladiadora\" ganham 100 de ATK e DEF para cada um desses marcadores neste card. Se este card fosse ser destruído pelo efeito de um card, você pode descartar 1 \"Colosseum - Cage of the Gladiator Beasts\" para impedir que este card seja destruído."
- nome: "Disarm"
  texto: "Return 1 \"Gladiator Beast\" card from your hand to the Deck, and negate the activation and effect of a Spell Card, and destroy it."
  texto_pt: "Devolva 1 card \"Besta Gladiadora\" da sua mão para o Deck, negue a ativação e o efeito de um Card de Magia e destrua-o."
- nome: "Double Tag Team"
  texto: "Activate only when you Special Summon a \"Gladiator Beast\" monster. Special Summon 1 Level 4 or lower \"Gladiator Beast\" monster from your hand or Deck."
  texto_pt: "Ative somente quando você Invocar um monstro \"Besta Gladiadora\" por Invocação-Especial. Invoque por Invocação-Especial 1 monstro \"Besta Gladiadora\" de Nível 4 ou menos da sua mão ou do seu Deck."
- nome: "Dragon Manipulator"
  texto: "FLIP: Take control of 1 face-up Dragon-Type monster on your opponent's side of the field until the end of the End Phase."
  texto_pt: "VIRE: assuma o controle de 1 monstro do Tipo Dragão com a face para cima no lado do campo do seu oponente até o fim da Fase Final."
- nome: "Gadget Soldier"
  texto: "A rust-free machine warrior born to battle."
  texto_pt: "Um guerreiro mecânico à prova de ferrugem, nascido para a batalha."
- nome: "Gladiator Beast Gaiodiaz"
  texto: "\"Gladiator Beast Spartacus\" + 1 \"Gladiator Beast\" monster\nThis card can only be Special Summoned from your Extra Deck, by returning the above cards you control to the Deck. (You do not use \"Polymerization\".) When this card destroys a monster by battle and sends it to the Graveyard, inflict damage to your opponent equal to the DEF of the destroyed monster. At the end of the Battle Phase, if this card attacked or was attacked, you can return it to the Extra Deck to Special Summon 2 \"Gladiator Beast\" monsters from your Deck, except \"Gladiator Beast Spartacus\"."
  texto_pt: "\"Gladiator Beast Spartacus\" + 1 monstro \"Besta Gladiadora\"\nEste card só pode ser Invocado por Invocação-Especial do seu Deck Adicional devolvendo para o Deck os cards acima que você controla. (Você não usa \"Polimerização\".) Quando este card destruir um monstro em batalha e enviá-lo para o Cemitério, cause ao seu oponente dano igual à DEF do monstro destruído. No fim da Fase de Batalha, se este card atacou ou foi atacado, você pode devolvê-lo para o Deck Adicional para Invocar por Invocação-Especial 2 monstros \"Besta Gladiadora\" do seu Deck, exceto \"Gladiator Beast Spartacus\"."
- nome: "Gladiator Beast Hoplomus"
  texto: "If this card was Special Summoned by the effect of a \"Gladiator Beast\" monster, its original DEF becomes 2400. At the end of the Battle Phase, if this card attacked or was attacked: You can shuffle it into the Deck; Special Summon 1 \"Gladiator Beast\" monster from your Deck, except \"Gladiator Beast Hoplomus\"."
  texto_pt: "Se este card foi Invocado por Invocação-Especial pelo efeito de um monstro \"Besta Gladiadora\", a DEF original dele passa a ser 2400. No fim da Fase de Batalha, se este card atacou ou foi atacado: você pode embaralhá-lo no Deck; Invoque por Invocação-Especial 1 monstro \"Besta Gladiadora\" do seu Deck, exceto \"Gladiator Beast Hoplomus\"."
- nome: "Gladiator Beast Octavius"
  texto: "When this card is Special Summoned by the effect of a \"Gladiator Beast\" monster: Target 1 face-down Spell or Trap Card in the Spell & Trap Card Zone; destroy that target. At the end of your Battle Phase, if this card attacked or was attacked: Shuffle this card into the Deck or discard 1 card."
  texto_pt: "Quando este card for Invocado por Invocação-Especial pelo efeito de um monstro \"Besta Gladiadora\": escolha 1 Card de Magia ou de Armadilha com a face para baixo na Zona de Magias e Armadilhas; destrua o alvo. No fim da sua Fase de Batalha, se este card atacou ou foi atacado: embaralhe este card no Deck ou descarte 1 card."
- nome: "Gladiator Beast Spartacus"
  texto: "This card cannot be Special Summoned except by the effect of \"Gladiator Beast Hoplomus\". When this card is Special Summoned, add 1 \"Gladiator Beast\" Equip Spell Card from your Deck to your hand. At the end of the Battle Phase, if this card attacked or was attacked, you can return it to the Deck to Special Summon 1 \"Gladiator Beast\" monster from your Deck, except \"Gladiator Beast Spartacus\"."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial, exceto pelo efeito de \"Gladiator Beast Hoplomus\". Quando este card for Invocado por Invocação-Especial, adicione 1 Card de Magia de Equipamento \"Besta Gladiadora\" do seu Deck à sua mão. No fim da Fase de Batalha, se este card atacou ou foi atacado, você pode devolvê-lo para o Deck para Invocar por Invocação-Especial 1 monstro \"Besta Gladiadora\" do seu Deck, exceto \"Gladiator Beast Spartacus\"."
- nome: "Gladiator Beast Torax"
  texto: "If this card was Special Summoned by the effect of a \"Gladiator Beast\" monster, at the end of any Battle Phase that this card attacked or was attacked, you can return it to the Deck to draw 1 card."
  texto_pt: "Se este card foi Invocado por Invocação-Especial pelo efeito de um monstro \"Besta Gladiadora\", no fim de qualquer Fase de Batalha em que este card atacou ou foi atacado, você pode devolvê-lo para o Deck para comprar 1 card."
- nome: "Gladiator Beast's Battle Gladius"
  texto: "Equip only to a \"Gladiator Beast\" monster. It gains 300 ATK. When the equipped monster is returned from your side of the field to the Deck and this card is sent to the Graveyard, return this card to your hand."
  texto_pt: "Equipe somente a um monstro \"Besta Gladiadora\". Ele ganha 300 de ATK. Quando o monstro equipado for devolvido do seu lado do campo para o Deck e este card for enviado para o Cemitério, devolva este card para a sua mão."
- nome: "Gladiator Beast's Battle Halberd"
  texto: "Equip only to a \"Gladiator Beast\" monster. When it attacks, destroy 1 Spell or Trap Card at the end of the Damage Step. When the equipped monster is returned from your side of the field to the Deck and this card is sent to the Graveyard, return this card to your hand."
  texto_pt: "Equipe somente a um monstro \"Besta Gladiadora\". Quando ele atacar, destrua 1 Card de Magia ou de Armadilha no fim da Etapa de Dano. Quando o monstro equipado for devolvido do seu lado do campo para o Deck e este card for enviado para o Cemitério, devolva este card para a sua mão."
- nome: "Gladiator Beast's Battle Manica"
  texto: "Equip only to a \"Gladiator Beast\" monster. It cannot be destroyed by battle (Damage calculation is applied normally). When the equipped monster is returned from your side of the field to the Deck and this card is sent to the Graveyard, return this card to your hand."
  texto_pt: "Equipe somente a um monstro \"Besta Gladiadora\". Ele não pode ser destruído em batalha (o cálculo de dano é aplicado normalmente). Quando o monstro equipado for devolvido do seu lado do campo para o Deck e este card for enviado para o Cemitério, devolva este card para a sua mão."
- nome: "Gladiator Lash"
  texto: "Activate only when you Special Summon a \"Gladiator Beast\" monster. Your opponent discards 1 card of their choice."
  texto_pt: "Ative somente quando você Invocar um monstro \"Besta Gladiadora\" por Invocação-Especial. Seu oponente descarta 1 card à escolha dele."
- nome: "Gladiator's Return"
  texto: "Target 3 \"Gladiator Beast\" cards in your Graveyard; shuffle all 3 targets into the Deck, then draw 1 card."
  texto_pt: "Escolha 3 cards \"Besta Gladiadora\" no seu Cemitério; embaralhe os 3 alvos no Deck e, depois, compre 1 card."
- nome: "Jowls of Dark Demise"
  texto: "FLIP: Target 1 monster your opponent controls; gain control of it (until the End Phase), and if you do, it can attack your opponent directly this turn."
  texto_pt: "VIRE: escolha 1 monstro que seu oponente controla; assuma o controle dele (até a Fase Final) e, se fizer isso, ele pode atacar o seu oponente diretamente neste turno."
- nome: "Parry"
  texto: "Return 1 \"Gladiator Beast\" card from your hand to the Deck, and negate the activation and effect of a Trap Card, and destroy it."
  texto_pt: "Devolva 1 card \"Besta Gladiadora\" da sua mão para o Deck, negue a ativação e o efeito de um Card de Armadilha e destrua-o."
- nome: "Stronghold the Moving Fortress"
  texto: "After activation, Special Summon this card in Defense Position; it is treated as an Effect Monster Card (Machine-Type/EARTH/Level 4/ATK 0/DEF 2000). (This card is still treated as a Trap Card.) While \"Green Gadget\", \"Red Gadget\", and \"Yellow Gadget\" are all face-up on your side of the field, the ATK of this card becomes 3000."
  texto_pt: "Depois da ativação, Invoque este card por Invocação-Especial em Posição de Defesa; ele é tratado como um Card de Monstro de Efeito (Máquina/TERRA/Nível 4/ATK 0/DEF 2000). (Este card continua sendo tratado como um Card de Armadilha.) Enquanto \"Dispositivo Verde\", \"Dispositivo Vermelho\" e \"Dispositivo Amarelo\" estiverem todos com a face para cima no seu lado do campo, o ATK deste card passa a ser 3000."
- nome: "Test Ape"
  texto: "When this card is destroyed by battle and sent to the Graveyard, you can Special Summon 1 Level 4 or lower \"Gladiator Beast\" monster from your Deck."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, você pode Invocar por Invocação-Especial 1 monstro \"Besta Gladiadora\" de Nível 4 ou menos do seu Deck."
- nome: "Emissary of the Afterlife"
  texto: "When this card is sent from the field to the Graveyard, each player selects 1 Level 3 or lower Normal Monster from their Deck, and adds it to their hand after showing it to the opponent. The Decks are then shuffled."
  texto_pt: "Quando este card for enviado do campo para o Cemitério, cada duelista escolhe 1 Monstro Normal de Nível 3 ou menos do próprio Deck e o adiciona à mão depois de mostrá-lo ao oponente. Depois, os Decks são embaralhados."
- nome: "Cú Chulainn the Awakened"
  texto: "This card can only be Ritual Summoned with the Ritual Spell Card, \"Emblem of the Awakening\". Once per turn, you can remove from play 1 Normal Monster from your Graveyard. This card gains ATK equal to that Normal Monster's ATK, until the Standby Phase of your next turn."
  texto_pt: "Este card só pode ser Invocado por Invocação-Ritual com o Card de Magia de Ritual \"Emblema do Despertar\". Uma vez por turno, você pode banir 1 Monstro Normal do seu Cemitério. Este card ganha ATK igual ao ATK desse Monstro Normal até a Fase de Apoio do seu próximo turno."
- nome: "Lycanthrope"
  texto: "This card can only be Ritual Summoned with the Ritual Spell Card, \"Synthesis Spell\". When this card inflicts Battle Damage to your opponent, inflict 200 damage to your opponent for each Normal Monster in your Graveyard."
  texto_pt: "Este card só pode ser Invocado por Invocação-Ritual com o Card de Magia de Ritual \"Synthesis Spell\". Quando este card causar dano de batalha ao seu oponente, cause 200 de dano ao seu oponente para cada Monstro Normal no seu Cemitério."
- nome: "Spiral Serpent"
  texto: "When huge whirlpools lay cities asunder, it is the hunger of this sea serpent at work. No one has ever escaped its dreaded Spiral Wave to accurately describe the terror they experienced."
  texto_pt: "Quando redemoinhos gigantes despedaçam cidades, é a fome desta serpente marinha em ação. Ninguém jamais escapou da sua temida Onda Espiral para descrever com precisão o terror que viveu."
- nome: "Amphibian Beast"
  texto: "On land or in the sea, the speed of this monster is unmatchable."
  texto_pt: "Em terra ou no mar, a velocidade deste monstro é inigualável."
- nome: "Dharma Cannon"
  texto: "A monstrous creature whose body is lined with cannons that never miss their targets."
  texto_pt: "Uma criatura monstruosa com o corpo coberto de canhões que nunca erram o alvo."
- nome: "Doron"
  texto: "This monster splits in two and attacks from opposite sides."
  texto_pt: "Este monstro se divide em dois e ataca por lados opostos."
- nome: "Emblem of the Awakening"
  texto: "This card is used to Ritual Summon \"Cú Chulainn the Awakened\". You must also Tribute monsters whose total Levels equal 4 or more from the field or your hand."
  texto_pt: "Este card é usado para a Invocação-Ritual de \"Cú Chulainn the Awakened\". Você também deve oferecer como Tributo, do campo ou da sua mão, monstros cuja soma dos Níveis seja 4 ou mais."
- nome: "Hurricail"
  texto: "A tornado that ravages the wastelands with sharp winds that can cut to the bone."
  texto_pt: "Um tornado que devasta as terras ermas com ventos afiados capazes de cortar até os ossos."
- nome: "Laughing Flower"
  texto: "A flower whose laugh can confuse the minds of enemies."
  texto_pt: "Uma flor cuja risada consegue confundir a mente dos inimigos."
- nome: "Secrets of the Gallant"
  texto: "Select 1 Normal Monster you control. When the selected monster inflicts Battle Damage to your opponent this turn, your opponent discards 2 random cards."
  texto_pt: "Escolha 1 Monstro Normal que você controla. Quando o monstro escolhido causar dano de batalha ao seu oponente neste turno, seu oponente descarta 2 cards aleatórios."
- nome: "Synthesis Spell"
  texto: "This card is used to Ritual Summon \"Lycanthrope\". You must also Tribute monsters whose total Levels equal 6 or more from the field or your hand."
  texto_pt: "Este card é usado para a Invocação-Ritual de \"Lycanthrope\". Você também deve oferecer como Tributo, do campo ou da sua mão, monstros cuja soma dos Níveis seja 6 ou mais."
- nome: "X-Saber Anu Piranha"
  texto: "A female X-Saber Warrior, known for her graceful attacks and calm decision making in battle. Her ambition is merciless, and strikes fear in the hearts of her enemies."
  texto_pt: "Uma guerreira X-Saber conhecida pelos ataques graciosos e pelas decisões calmas em batalha. Sua ambição é implacável e enche de medo o coração dos inimigos."
- nome: "Yamatano Dragon Scroll"
  texto: "A dragon conjured from the very scroll in which it was depicted."
  texto_pt: "Um dragão conjurado do próprio pergaminho em que foi retratado."
- nome: "Battle Fusion"
  texto: "Activate during the Damage Step after a Fusion Monster you control battles. Your monster's ATK is increased by the enemy monster's ATK until the end of the Damage Step."
  texto_pt: "Ative durante a Etapa de Dano, depois que um Monstro de Fusão que você controla batalhar. O ATK do seu monstro aumenta no valor do ATK do monstro inimigo até o fim da Etapa de Dano."
- nome: "Final Fusion"
  texto: "Activate when a Fusion Monster you control declares an attack while battling an opponent's Fusion Monster. Both players take Battle Damage equal to the total ATK of the battling monsters."
  texto_pt: "Ative quando um Monstro de Fusão que você controla declarar um ataque em uma batalha com um Monstro de Fusão do oponente. Os dois duelistas sofrem dano de batalha igual à soma do ATK dos monstros em batalha."
- nome: "Reverse of Neos"
  texto: "Activate only when a face-up \"Neos\" Fusion Monster you control is destroyed. Special Summon 1 \"Elemental Hero Neos\" from your Deck in Attack Position. It gains 1000 ATK and is destroyed during the End Phase of this turn."
  texto_pt: "Ative somente quando um Monstro de Fusão \"Neos\" com a face para cima que você controla for destruído. Invoque por Invocação-Especial 1 \"Elemental Hero Neos\" do seu Deck em Posição de Ataque. Ele ganha 1000 de ATK e é destruído durante a Fase Final deste turno."
- nome: "Neo Space Pathfinder"
  texto: "You can discard this card to the Graveyard to add 1 \"Neo Space\" from your Deck or Graveyard to your hand."
  texto_pt: "Você pode descartar este card para o Cemitério para adicionar 1 \"Neo Espaço\" do seu Deck ou Cemitério à sua mão."
- nome: "Cocoon Party"
  texto: "Special Summon 1 \"Chrysalis\" monster from your Deck for each \"Neo-Spacian\" monster with a different name in your Graveyard."
  texto_pt: "Invoque por Invocação-Especial 1 monstro \"Chrysalis\" do seu Deck para cada monstro \"Neoespacial\" com nome diferente no seu Cemitério."
- nome: "Cocoon Veil"
  texto: "Activate by Tributing 1 face-up \"Chrysalis\" monster. This turn, any damage to a player caused by an effect becomes 0. Special Summon 1 \"Neo-Spacian\" monster written on the \"Chrysalis\" monster you Tributed from your hand, Deck or from either player's Graveyard."
  texto_pt: "Ative oferecendo como Tributo 1 monstro \"Chrysalis\" com a face para cima. Neste turno, qualquer dano a um duelista causado por um efeito passa a ser 0. Invoque por Invocação-Especial, da sua mão, do seu Deck ou do Cemitério de qualquer duelista, 1 monstro \"Neoespacial\" escrito no monstro \"Chrysalis\" que você ofereceu como Tributo."
- nome: "Elemental HERO Flare Neos"
  texto: "\"Elemental HERO Neos\" + \"Neo-Spacian Flare Scarab\"\nMust first be Special Summoned (from your Extra Deck) by shuffling the above cards you control into the Deck. (You do not use \"Polymerization\".) This card gains 400 ATK for each Spell/Trap Card on the field. During the End Phase: Shuffle this card into the Extra Deck."
  texto_pt: "\"Neos, o HERÓI do Elemento\" + \"Escaravelho de Chamas Neoespacial\"\nDeve primeiro ser Invocado por Invocação-Especial (do seu Deck Adicional) embaralhando no Deck os cards acima que você controla. (Você não usa \"Polimerização\".) Este card ganha 400 de ATK para cada Card de Magia/Armadilha no campo. Durante a Fase Final: embaralhe este card no Deck Adicional."
- nome: "Elemental HERO Grand Neos"
  texto: "\"Elemental HERO Neos\" + \"Neo-Spacian Grand Mole\"\nMust first be Special Summoned (from your Extra Deck) by shuffling the above cards you control into the Deck. Once per turn: You can target 1 monster your opponent controls; return that target to the hand. Once per turn, during the End Phase: Return this card to the Extra Deck."
  texto_pt: "\"Neos, o HERÓI do Elemento\" + \"Grande Toupeira Neoespacial\"\nDeve primeiro ser Invocado por Invocação-Especial (do seu Deck Adicional) embaralhando no Deck os cards acima que você controla. Uma vez por turno: você pode escolher 1 monstro que seu oponente controla; devolva o alvo para a mão. Uma vez por turno, durante a Fase Final: devolva este card para o Deck Adicional."
- nome: "Elemental HERO Marine Neos"
  texto: "\"Elemental HERO Neos\" + \"Neo-Spacian Marine Dolphin\"\nMust first be Special Summoned (from your Extra Deck) by shuffling the above cards you control into the Deck. (You do not use \"Polymerization\".) Once per turn: You can destroy 1 random card in your opponent's hand."
  texto_pt: "\"Neos, o HERÓI do Elemento\" + \"Neo-Spacian Marine Dolphin\"\nDeve primeiro ser Invocado por Invocação-Especial (do seu Deck Adicional) embaralhando no Deck os cards acima que você controla. (Você não usa \"Polimerização\".) Uma vez por turno: você pode destruir 1 card aleatório na mão do seu oponente."
- nome: "Neo-Spacian Marine Dolphin"
  texto: "This card's name is also treated as \"Neo-Spacian Aqua Dolphin\". This card cannot be Special Summoned except with \"NEX\". Once per turn, you can discard 1 card to look at your opponent's hand and select 1 Monster Card in it. If you control a monster with ATK greater than or equal to the selected monster's, destroy the selected monster and inflict 500 damage to your opponent."
  texto_pt: "O nome deste card também é tratado como \"Golfinho Aqua Neoespacial\". Este card não pode ser Invocado por Invocação-Especial, exceto com \"NEX\". Uma vez por turno, você pode descartar 1 card para olhar a mão do seu oponente e escolher 1 Card de Monstro nela. Se você controlar um monstro com ATK maior ou igual ao do monstro escolhido, destrua o monstro escolhido e cause 500 de dano ao seu oponente."
- nome: "The Rival's Name"
  texto: "Select 1 monster from your opponent's Graveyard. This card becomes a Monster Card (Spellcaster-Type/LIGHT/Level 1/ATK 0/DEF 0) and is Special Summoned to your Monster Card Zone. (This card is still treated as a Spell Card.)"
  texto_pt: "Escolha 1 monstro no Cemitério do seu oponente. Este card vira um Card de Monstro (Mago/LUZ/Nível 1/ATK 0/DEF 0) e é Invocado por Invocação-Especial na sua Zona de Monstros. (Este card continua sendo tratado como um Card de Magia.)"
- nome: "Chrysalis Chicky"
  texto: "You can Tribute this card while \"Neo Space\" is on the field to Special Summon 1 \"Neo-Spacian Air Hummingbird\" from your hand or Deck."
  texto_pt: "Você pode oferecer este card como Tributo enquanto \"Neo Espaço\" estiver no campo para Invocar por Invocação-Especial 1 \"Beija-flor do Ar Neoespacial\" da sua mão ou do seu Deck."
- nome: "Chrysalis Dolphin"
  texto: "By Tributing this card while \"Neo Space\" is on the field, Special Summon 1 \"Neo-Spacian Aqua Dolphin\" from your hand or Deck."
  texto_pt: "Você pode oferecer este card como Tributo enquanto \"Neo Espaço\" estiver no campo para Invocar por Invocação-Especial 1 \"Golfinho Aqua Neoespacial\" da sua mão ou do seu Deck."
- nome: "Chrysalis Larva"
  texto: "You can Tribute this card while \"Neo Space\" is on the field to Special Summon 1 \"Neo-Spacian Flare Scarab\" from your hand or Deck."
  texto_pt: "Você pode oferecer este card como Tributo enquanto \"Neo Espaço\" estiver no campo para Invocar por Invocação-Especial 1 \"Escaravelho de Chamas Neoespacial\" da sua mão ou do seu Deck."
- nome: "Chrysalis Mole"
  texto: "You can Tribute this card while \"Neo Space\" is on the field to Special Summon 1 \"Neo-Spacian Grand Mole\" from your hand or Deck."
  texto_pt: "Você pode oferecer este card como Tributo enquanto \"Neo Espaço\" estiver no campo para Invocar por Invocação-Especial 1 \"Grande Toupeira Neoespacial\" da sua mão ou do seu Deck."
- nome: "Chrysalis Pantail"
  texto: "You can Tribute this card while \"Neo Space\" is on the field to Special Summon 1 \"Neo-Spacian Dark Panther\" from your hand or Deck."
  texto_pt: "Você pode oferecer este card como Tributo enquanto \"Neo Espaço\" estiver no campo para Invocar por Invocação-Especial 1 \"Pantera Negra Neoespacial\" da sua mão ou do seu Deck."
- nome: "Chrysalis Pinny"
  texto: "You can Tribute this card while \"Neo Space\" is on the field to Special Summon 1 \"Neo-Spacian Glow Moss\" from your hand or Deck."
  texto_pt: "Você pode oferecer este card como Tributo enquanto \"Neo Espaço\" estiver no campo para Invocar por Invocação-Especial 1 \"Musgo Brilhante Neoespacial\" da sua mão ou do seu Deck."
- nome: "Cocoon Rebirth"
  texto: "You can Tribute 1 face-up \"Chrysalis\" monster you control to Special Summon 1 \"Neo-Spacian\" monster written in the card text of that card from either player's Graveyard."
  texto_pt: "Você pode oferecer como Tributo 1 monstro \"Chrysalis\" com a face para cima que você controla para Invocar por Invocação-Especial, do Cemitério de qualquer duelista, 1 monstro \"Neoespacial\" escrito no texto desse card."
- nome: "Common Soul"
  texto: "Select 1 face-up monster on the field. Special Summon 1 \"Neo-Spacian\" monster from your hand to the same side of the field as the selected monster. The selected monster gains ATK equal to the ATK of the monster that was Special Summoned by this effect. When this card is removed from the field, return the Special Summoned monster to its owner's hand."
  texto_pt: "Escolha 1 monstro com a face para cima no campo. Invoque por Invocação-Especial 1 monstro \"Neoespacial\" da sua mão no mesmo lado do campo do monstro escolhido. O monstro escolhido ganha ATK igual ao ATK do monstro Invocado por Invocação-Especial por este efeito. Quando este card sair do campo, devolva o monstro Invocado por Invocação-Especial para a mão do dono."
- nome: "Contact"
  texto: "Send all \"Chrysalis\" monsters you control to the Graveyard, and Special Summon 1 monster from your hand or Deck that is written in the card text of those cards."
  texto_pt: "Envie para o Cemitério todos os monstros \"Chrysalis\" que você controla e Invoque por Invocação-Especial, da sua mão ou do seu Deck, 1 monstro escrito no texto desses cards."
- nome: "Contact Out"
  texto: "Return 1 \"Neos\" Fusion Monster you control to the Extra Deck. If all the Fusion Material Monsters listed on that Fusion Monster are in your Deck, you can Special Summon them."
  texto_pt: "Devolva 1 Monstro de Fusão \"Neos\" que você controla para o Deck Adicional. Se todos os Monstros Matéria de Fusão listados nesse Monstro de Fusão estiverem no seu Deck, você pode Invocá-los por Invocação-Especial."
- nome: "Elemental HERO Aqua Neos"
  texto: "\"Elemental HERO Neos\" + \"Neo-Spacian Aqua Dolphin\"\nMust first be Special Summoned (from your Extra Deck) by shuffling the above cards you control into the Deck. Once per turn: You can discard 1 card; destroy 1 random card in your opponent's hand. Once per turn, during the End Phase: Return this card to the Extra Deck."
  texto_pt: "\"Neos, o HERÓI do Elemento\" + \"Golfinho Aqua Neoespacial\"\nDeve primeiro ser Invocado por Invocação-Especial (do seu Deck Adicional) embaralhando no Deck os cards acima que você controla. Uma vez por turno: você pode descartar 1 card; destrua 1 card aleatório na mão do seu oponente. Uma vez por turno, durante a Fase Final: devolva este card para o Deck Adicional."
- nome: "Elemental HERO Dark Neos"
  texto: "\"Elemental HERO Neos\" + \"Neo-Spacian Dark Panther\"\nMust first be Special Summoned (from your Extra Deck) by shuffling the above cards you control into the Deck. You can target 1 face-up Effect Monster on the field; negate its effects while you control this face-up card. (You can only target 1 monster at a time with this effect.) Once per turn, during the End Phase: Return this card to the Extra Deck."
  texto_pt: "\"Neos, o HERÓI do Elemento\" + \"Pantera Negra Neoespacial\"\nDeve primeiro ser Invocado por Invocação-Especial (do seu Deck Adicional) embaralhando no Deck os cards acima que você controla. Você pode escolher 1 Monstro de Efeito com a face para cima no campo; negue os efeitos dele enquanto você controlar este card com a face para cima. (Você só pode escolher 1 monstro por vez com este efeito.) Uma vez por turno, durante a Fase Final: devolva este card para o Deck Adicional."
- nome: "Elemental HERO Divine Neos"
  texto: "Must be Fusion Summoned using any 5 \"Neos\", \"Neo Space\", \"Neo-Spacian\", or \"HERO\" monsters, including at least 1 \"Neos\" or \"Neo Space\" monster, 1 \"Neo-Spacian\" monster, and 1 \"HERO\" monster, and cannot be Special Summoned by other ways. Once per turn: You can banish 1 \"Neos\", \"Neo Space\", \"Neo-Spacian\", or \"HERO\" monster from your Graveyard; this card gains 500 ATK, and until the End Phase it also gains the banished monster's effects."
  texto_pt: "Deve ser Invocado por Invocação-Fusão usando 5 monstros \"Neos\", \"Neo Espaço\", \"Neoespacial\" ou \"HERÓI\" quaisquer, incluindo pelo menos 1 monstro \"Neos\" ou \"Neo Espaço\", 1 monstro \"Neoespacial\" e 1 monstro \"HERÓI\", e não pode ser Invocado por Invocação-Especial de outras formas. Uma vez por turno: você pode banir 1 monstro \"Neos\", \"Neo Espaço\", \"Neoespacial\" ou \"HERÓI\" do seu Cemitério; este card ganha 500 de ATK e, até a Fase Final, também ganha os efeitos do monstro banido."
- nome: "Elemental HERO Glow Neos"
  texto: "\"Elemental HERO Neos\" + \"Neo-Spacian Glow Moss\"\nMust first be Special Summoned (from your Extra Deck) by shuffling the above cards you control into the Deck. Once per turn, during the End Phase: Return this card to the Extra Deck. Once per turn, during your Main Phase 1: You can target 1 face-up card your opponent controls; destroy that target, and if you do, apply this effect based on its type. ● Monster: This card cannot attack this turn. ● Spell: This card can attack directly this turn. ● Trap: Change this card to Defense Position."
  texto_pt: "\"Neos, o HERÓI do Elemento\" + \"Musgo Brilhante Neoespacial\"\nDeve primeiro ser Invocado por Invocação-Especial (do seu Deck Adicional) embaralhando no Deck os cards acima que você controla. Uma vez por turno, durante a Fase Final: devolva este card para o Deck Adicional. Uma vez por turno, durante a sua Fase Principal 1: você pode escolher 1 card com a face para cima que seu oponente controla; destrua o alvo e, se fizer isso, aplique este efeito de acordo com o tipo dele.\n● Monstro: este card não pode atacar neste turno.\n● Magia: este card pode atacar diretamente neste turno.\n● Armadilha: mude este card para Posição de Defesa."
- nome: "Hero Kid"
  texto: "When this card is Special Summoned: You can Special Summon any number of \"Hero Kid\"(s) from your Deck."
  texto_pt: "Quando este card for Invocado por Invocação-Especial: você pode Invocar por Invocação-Especial qualquer número de \"Hero Kid\" do seu Deck."
- nome: "Hero Medal"
  texto: "When this Set card is destroyed and sent to the Graveyard by an opponent's card effect, shuffle this card into its owner's Deck. Then draw 1 card."
  texto_pt: "Quando este card Baixado for destruído e enviado para o Cemitério pelo efeito de um card do oponente, embaralhe este card no Deck do dono. Depois, compre 1 card."
- nome: "Hero's Rule 2"
  texto: "Negate the activation of a Spell, Trap, or Effect Monster's effect that targets a card(s) in the Graveyard, and destroy it."
  texto_pt: "Negue a ativação de uma Magia, Armadilha ou efeito de Monstro de Efeito que escolha como alvo um ou mais cards no Cemitério e destrua-o."
- nome: "Kid Guard"
  texto: "When an opponent's monster declares an attack: Tribute 1 \"Hero Kid\"; negate the attack, then add 1 \"Elemental HERO\" monster from your Deck to your hand."
  texto_pt: "Quando um monstro do oponente declarar um ataque: ofereça como Tributo 1 \"Hero Kid\"; negue o ataque e, depois, adicione 1 monstro \"HERÓI do Elemento\" do seu Deck à sua mão."
- nome: "Miracle Kids"
  texto: "Target 1 monster your opponent controls; that target loses 400 ATK for each \"Hero Kid\" in your Graveyard, until the End Phase."
  texto_pt: "Escolha 1 monstro que seu oponente controla; o alvo perde 400 de ATK para cada \"Hero Kid\" no seu Cemitério, até a Fase Final."
- nome: "Neos Force"
  texto: "Equip only to \"Elemental HERO Neos\". It gains 800 ATK. When it destroys a monster by battle and sends it to the Graveyard: Inflict damage to your opponent equal to the original ATK of the destroyed monster in the Graveyard. During the End Phase: Shuffle this card into the Deck."
  texto_pt: "Equipe somente a \"Neos, o HERÓI do Elemento\". Ele ganha 800 de ATK. Quando ele destruir um monstro em batalha e enviá-lo para o Cemitério: cause ao seu oponente dano igual ao ATK original do monstro destruído no Cemitério. Durante a Fase Final: embaralhe este card no Deck."
- nome: "NEX"
  texto: "Send 1 face-up \"Neo-Spacian\" monster you control to the Graveyard. Special Summon 1 Level 4 monster with the same name from your Extra Deck."
  texto_pt: "Envie para o Cemitério 1 monstro \"Neoespacial\" com a face para cima que você controla. Invoque por Invocação-Especial 1 monstro de Nível 4 com o mesmo nome do seu Deck Adicional."
- nome: "Super Junior Confrontation"
  texto: "Activate only when an opponent's monster declares an attack. Negate the battle, and 1 monster with the lowest ATK in face-up Attack Position your opponent controls battles against 1 monster with the lowest DEF in face-up Defense Position you control. After that battle, end the Battle Phase."
  texto_pt: "Ative somente quando um monstro do oponente declarar um ataque. Negue a batalha; então, 1 monstro com o menor ATK em Posição de Ataque com a face para cima que seu oponente controla batalha contra 1 monstro com a menor DEF em Posição de Defesa com a face para cima que você controla. Depois dessa batalha, encerre a Fase de Batalha."
- nome: "Kiteroid"
  texto: "Activate when you discard this card from your hand during damage calculation after a direct attack. Any Battle Damage you would receive from that direct attack becomes 0. Only once, if you remove this card from the game when it is in your Graveyard, any Battle Damage you would receive from a direct attack becomes 0."
  texto_pt: "Ative quando você descartar este card da sua mão durante o cálculo de dano depois de um ataque direto. Qualquer dano de batalha que você sofreria com esse ataque direto passa a ser 0. Uma única vez, se você banir este card enquanto ele estiver no seu Cemitério, qualquer dano de batalha que você sofreria com um ataque direto passa a ser 0."
- nome: "Clear Cube"
  texto: "When this card is face-up on the field, do not treat its Attribute as DARK. When this card is removed from the field, you can Special Summon 1 \"Clear Cube\" from your Deck."
  texto_pt: "Quando este card estiver com a face para cima no campo, o Atributo dele não é tratado como TREVAS. Quando este card sair do campo, você pode Invocar por Invocação-Especial 1 \"Clear Cube\" do seu Deck."
- nome: "Ally of Justice Light Gazer"
  texto: "1 Tuner + 1 or more non-Tuner monsters\nThis card gains 200 ATK for each LIGHT monster in your opponent's Graveyard."
  texto_pt: "1 Regulador + 1 ou mais monstros não-Reguladores\nEste card ganha 200 de ATK para cada monstro de LUZ no Cemitério do seu oponente."
- nome: "Ally of Justice Thousand Arms"
  texto: "This card can attack all face-up LIGHT monsters your opponent controls once each. If this card battles a non-LIGHT monster, destroy this card before damage calculation."
  texto_pt: "Este card pode atacar uma vez cada monstro de LUZ com a face para cima que seu oponente controla. Se este card batalhar com um monstro que não seja de LUZ, destrua este card antes do cálculo de dano."
- nome: "Ally of Justice Unknown Crusher"
  texto: "When this card battles a LIGHT monster, remove that monster from play after damage calculation."
  texto_pt: "Quando este card batalhar com um monstro de LUZ, bana esse monstro depois do cálculo de dano."
- nome: "Cannon Soldier MK-2"
  texto: "You can Tribute 2 monsters to inflict 1500 damage to your opponent."
  texto_pt: "Você pode oferecer 2 monstros como Tributo para causar 1500 de dano ao seu oponente."
- nome: "Carrierroid"
  texto: "When an opponent activates a card's effect that targets and destroys a Spell or Trap Card(s) you control, you can discard 1 card to negate its activation and destroy the card."
  texto_pt: "Quando um oponente ativar o efeito de um card que escolhe como alvo e destrói um ou mais Cards de Magia ou de Armadilha que você controla, você pode descartar 1 card para negar a ativação e destruir esse card."
- nome: "Decoyroid"
  texto: "While this card is face-up on your side of the field, your opponent cannot select a face-up monster as an attack target except \"Decoyroid\"."
  texto_pt: "Enquanto este card estiver com a face para cima no seu lado do campo, seu oponente não pode escolher um monstro com a face para cima como alvo de ataque, exceto \"Decoyroid\"."
- nome: "Gadget Hauler"
  texto: "Once per turn, you can send any number of \"Morphtronic\" monsters from your hand to the Graveyard to have this card gain 800 ATK for each."
  texto_pt: "Uma vez por turno, você pode enviar qualquer número de monstros \"Morfotrônico(a)\" da sua mão para o Cemitério para que este card ganhe 800 de ATK para cada um."
- nome: "Heavy Mech Support Platform"
  texto: "Once per turn, you can either: Target 1 Machine-Type monster you control; equip this card to that target, OR: Unequip this card and Special Summon it in face-up Attack Position. While equipped by this effect, the equipped monster gains 500 ATK and DEF. (A monster can only be equipped with 1 Union monster at a time. If the equipped monster would be destroyed, destroy this card instead.)"
  texto_pt: "Uma vez por turno, você pode: escolher 1 monstro do Tipo Máquina que você controla e equipar este card ao alvo, OU desequipar este card e Invocá-lo por Invocação-Especial com a face para cima em Posição de Ataque. Enquanto estiver equipado por este efeito, o monstro equipado ganha 500 de ATK e DEF. (Um monstro só pode estar equipado com 1 Monstro União por vez. Se o monstro equipado fosse ser destruído, em vez disso, destrua este card.)"
- nome: "Cipher Soldier"
  texto: "When battling a Warrior-Type monster, this card gains 2000 ATK and DEF during damage calculation only."
  texto_pt: "Ao batalhar com um monstro do Tipo Guerreiro, este card ganha 2000 de ATK e DEF, somente durante o cálculo de dano."
- nome: "Morphtronic Cameran"
  texto: "● While in Attack Position: When this card is destroyed by battle, you can Special Summon 1 Level 4 or lower \"Morphtronic\" monster from your hand or Graveyard, except \"Morphtronic Cameran\". ● While in Defense Position: \"Morphtronic\" monsters on the field cannot be targeted by effects."
  texto_pt: "● Em Posição de Ataque: quando este card for destruído em batalha, você pode Invocar por Invocação-Especial 1 monstro \"Morfotrônico(a)\" de Nível 4 ou menos da sua mão ou do seu Cemitério, exceto \"Morphtronic Cameran\".\n● Em Posição de Defesa: monstros \"Morfotrônico(a)\" no campo não podem ser escolhidos como alvo de efeitos."
- nome: "Ojamandala"
  texto: "Pay 1000 Life Points. Special Summon 1 \"Ojama Green\", \"Ojama Yellow\" and \"Ojama Black\" from your Graveyard."
  texto_pt: "Pague 1000 PV. Invoque por Invocação-Especial 1 \"Ojama Verde\", 1 \"Ojama Amarelo\" e 1 \"Ojama Negro\" do seu Cemitério."
- nome: "Level Down!?"
  texto: "Select 1 face-up \"LV\" monster on the field to activate this card. Return the selected card to its owner's Deck and Special Summon 1 monster from the owner's Graveyard to their side of the field with the same name but lower \"LV\" (ignoring the Summoning conditions)."
  texto_pt: "Escolha 1 monstro \"LV\" com a face para cima no campo para ativar este card. Devolva o card escolhido para o Deck do dono e Invoque por Invocação-Especial, do Cemitério do dono para o lado do campo dele, 1 monstro com o mesmo nome mas com \"LV\" menor (ignorando as condições de Invocação)."
- nome: "Level Modulation"
  texto: "Your opponent draws 2 cards. Special Summon 1 \"LV\" monster from your Graveyard, ignoring the Summoning conditions. The monster that was Special Summoned by this effect cannot attack, nor activate or apply its effect this turn."
  texto_pt: "Seu oponente compra 2 cards. Invoque por Invocação-Especial 1 monstro \"LV\" do seu Cemitério, ignorando as condições de Invocação. O monstro Invocado por Invocação-Especial por este efeito não pode atacar nem ativar ou aplicar o efeito dele neste turno."
- nome: "Dragonic Knight"
  texto: "When the effect of an opponent's monster is activated that targets and destroys a card(s) you control, you can send the targeted card(s) to the Graveyard to Special Summon this card from your hand."
  texto_pt: "Quando for ativado o efeito de um monstro do oponente que escolhe como alvo e destrói um ou mais cards que você controla, você pode enviar os cards escolhidos para o Cemitério para Invocar este card da sua mão por Invocação-Especial."
- nome: "Pride Shout"
  texto: "If a monster you control with 0 ATK receives a direct attack, inflict damage to your opponent equal to the DEF of the attacking monster at the end of the Damage Step."
  texto_pt: "Se um monstro com 0 de ATK que você controla receber um ataque direto, cause ao seu oponente dano igual à DEF do monstro atacante no fim da Etapa de Dano."
- nome: "Armor Breaker"
  texto: "Once per turn, you can equip this card to a Warrior-Type monster you control, OR unequip it to Special Summon this card in face-up Attack Position. While equipped to a monster by this effect, when that monster inflicts Battle Damage to your opponent, destroy 1 card on the field. (A monster can only be equipped with 1 Union Monster at a time. If the equipped monster would be destroyed by battle, this card is destroyed instead.)"
  texto_pt: "Uma vez por turno, você pode equipar este card a um monstro do Tipo Guerreiro que você controla OU desequipá-lo para Invocar este card por Invocação-Especial com a face para cima em Posição de Ataque. Enquanto estiver equipado a um monstro por este efeito, quando esse monstro causar dano de batalha ao seu oponente, destrua 1 card no campo. (Um monstro só pode estar equipado com 1 Monstro União por vez. Se o monstro equipado fosse ser destruído em batalha, em vez disso, destrua este card.)"
- nome: "Chthonian Soldier"
  texto: "When this card is destroyed by an opponent's attacking monster and sent to the Graveyard, the Battle Damage you took from this battle is also inflicted to your opponent."
  texto_pt: "Quando este card for destruído por um monstro atacante do oponente e enviado para o Cemitério, o dano de batalha que você sofreu nessa batalha também é causado ao seu oponente."
- nome: "Infernal Incinerator"
  texto: "This card can only be Normal Summoned or Set by discarding all other card(s) in your hand and Tributing 1 card you control with 2000 or more ATK. This card gains 200 ATK for each monster your opponent controls. This card loses 500 ATK for each other monster you control."
  texto_pt: "Este card só pode ser Invocado por Invocação-Normal ou Baixado descartando todos os outros cards da sua mão e oferecendo como Tributo 1 card que você controla com 2000 ou mais de ATK. Este card ganha 200 de ATK para cada monstro que seu oponente controla. Este card perde 500 de ATK para cada outro monstro que você controla."
- nome: "Over Limit"
  texto: "Pay 500 Life Points. Special Summon from both players' Graveyards as many Normal Monsters as possible with 1000 or less ATK that were destroyed by battle this turn."
  texto_pt: "Pague 500 PV. Invoque por Invocação-Especial, dos Cemitérios dos dois duelistas, o máximo possível de Monstros Normais com 1000 ou menos de ATK que foram destruídos em batalha neste turno."
- nome: "W-Wing Catapult"
  texto: "Once per turn, you can equip this card to a \"V-Tiger Jet\" you control, OR unequip it to Special Summon this card in face-up Attack Position. When equipped to a monster by this card's effect, the equipped monster gains 400 ATK and DEF. (A monster can only be equipped with 1 Union Monster at a time. If the equipped monster would be destroyed by battle, destroy this card instead.)"
  texto_pt: "Uma vez por turno, você pode equipar este card a um \"V-Jato Tigre\" que você controla OU desequipá-lo para Invocar este card por Invocação-Especial com a face para cima em Posição de Ataque. Quando estiver equipado a um monstro pelo efeito deste card, o monstro equipado ganha 400 de ATK e DEF. (Um monstro só pode estar equipado com 1 Monstro União por vez. Se o monstro equipado fosse ser destruído em batalha, em vez disso, destrua este card.)"
- nome: "Y-Dragon Head"
  texto: "Once per turn, during your Main Phase, if you control this card on the field, you can equip it to your \"X-Head Cannon\" as an Equip Card, OR unequip the Union equipment and Special Summon this card in face-up Attack Position. While equipped to a monster by this card's effect, increase the ATK and DEF of the equipped monster by 400 points. (1 monster can only be equipped with 1 Union Monster at a time. If the equipped monster is destroyed as a result of battle, destroy this card instead.)"
  texto_pt: "Uma vez por turno, durante a sua Fase Principal, se você controlar este card no campo, você pode equipá-lo ao seu \"Cabeça de Canhão X\" como Card de Equipamento OU desfazer o equipamento de União e Invocar este card por Invocação-Especial com a face para cima em Posição de Ataque. Enquanto estiver equipado a um monstro pelo efeito deste card, aumente o ATK e a DEF do monstro equipado em 400. (1 monstro só pode estar equipado com 1 Monstro União por vez. Se o monstro equipado for destruído em batalha, em vez dele, destrua este card.)"
- nome: "Z-Metal Tank"
  texto: "Once per turn, during your Main Phase, if you control this card on the field, you can equip it to your \"X-Head Cannon\" or \"Y-Dragon Head\" as an Equip Card, OR unequip the Union equipment and Special Summon this card in face-up Attack Position. While equipped to a monster by this card's effect, increase the ATK and DEF of the equipped monster by 600 points. (1 monster can only be equipped with 1 Union Monster at a time. If the equipped monster is destroyed as a result of battle, destroy this card instead.)"
  texto_pt: "Uma vez por turno, durante a sua Fase Principal, se você controlar este card no campo, você pode equipá-lo ao seu \"Cabeça de Canhão X\" ou \"Cabeça de Dragão Y\" como Card de Equipamento OU desfazer o equipamento de União e Invocar este card por Invocação-Especial com a face para cima em Posição de Ataque. Enquanto estiver equipado a um monstro pelo efeito deste card, aumente o ATK e a DEF do monstro equipado em 600. (1 monstro só pode estar equipado com 1 Monstro União por vez. Se o monstro equipado for destruído em batalha, em vez dele, destrua este card.)"
- nome: "Future Fusion"
  texto: "Send, from your Deck to the Graveyard, Fusion Material Monsters that are listed on a Fusion Monster Card, and select that 1 Fusion Monster from your Fusion Deck. Special Summon a Fusion Monster from your Fusion Deck with the same name as the selected Fusion Monster during your 2nd Standby Phase after this card's activation. (This Special Summon is treated as a Fusion Summon.) When this card is removed from the field, destroy the monster. When the monster is destroyed, destroy this card."
  texto_pt: "Envie do seu Deck para o Cemitério os Monstros Matéria de Fusão listados em um Card de Monstro de Fusão e escolha esse Monstro de Fusão no seu Deck Adicional. Durante a sua 2ª Fase de Apoio depois da ativação deste card, Invoque por Invocação-Especial do seu Deck Adicional um Monstro de Fusão com o mesmo nome do Monstro de Fusão escolhido. (Esta Invocação-Especial é tratada como uma Invocação-Fusão.) Quando este card sair do campo, destrua o monstro. Quando o monstro for destruído, destrua este card."
- nome: "Chthonian Emperor Dragon"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it be treated as an Effect Monster with this effect:\n● This card can attack twice during the same Battle Phase."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● Este card pode atacar duas vezes durante a mesma Fase de Batalha."
- nome: "Cyber Ogre 2"
  texto: "\"Cyber Ogre\" + \"Cyber Ogre\"\nA Fusion Summon of this monster can only be conducted with the above Fusion Material Monsters. When this card attacks, it gains ATK equal to half the ATK of the attack target, during damage calculation only."
  texto_pt: "\"Cyber Ogre\" + \"Cyber Ogre\"\nA Invocação-Fusão deste monstro só pode ser feita com os Monstros Matéria de Fusão acima. Quando este card atacar, ele ganha ATK igual à metade do ATK do alvo do ataque, somente durante o cálculo de dano."
- nome: "Armored Cybern"
  texto: "Once per turn, you can equip this card to a \"Cyber Dragon\" you control, or to a Fusion Monster you control that lists \"Cyber Dragon\" as a Fusion Material Monster, OR unequip it to Special Summon this card in face-up Attack Position. Once per turn, while equipped to a monster by this effect, you can decrease the equipped monster's ATK by 1000 and destroy 1 face-up monster. (A monster can only by equipped with 1 Union Monster at a time. If the equipped monster would be destroyed, destroy this card instead.)"
  texto_pt: "Uma vez por turno, você pode equipar este card a um \"Dragão Cibernético\" que você controla, ou a um Monstro de Fusão que você controla que liste \"Dragão Cibernético\" como Monstro Matéria de Fusão, OU desequipá-lo para Invocar este card por Invocação-Especial com a face para cima em Posição de Ataque. Uma vez por turno, enquanto estiver equipado a um monstro por este efeito, você pode diminuir o ATK do monstro equipado em 1000 e destruir 1 monstro com a face para cima. (Um monstro só pode estar equipado com 1 Monstro União por vez. Se o monstro equipado fosse ser destruído, em vez disso, destrua este card.)"
- nome: "Attack Reflector Unit"
  texto: "Tribute 1 \"Cyber Dragon\". Special Summon 1 \"Cyber Barrier Dragon\" from your hand or Deck."
  texto_pt: "Ofereça como Tributo 1 \"Dragão Cibernético\". Invoque por Invocação-Especial 1 \"Cyber Barrier Dragon\" da sua mão ou do seu Deck."
- nome: "Byroad Sacrifice"
  texto: "Activate only if a monster on your side of the field is destroyed by battle. Special Summon 1 \"Cyber Ogre\" from your hand."
  texto_pt: "Ative somente se um monstro no seu lado do campo for destruído em batalha. Invoque por Invocação-Especial 1 \"Cyber Ogre\" da sua mão."
- nome: "Cyber Barrier Dragon"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except with \"Attack Reflector Unit\". Once per turn, while this card is in Attack Position, your opponent's next attack is negated."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto com \"Attack Reflector Unit\". Uma vez por turno, enquanto este card estiver em Posição de Ataque, o próximo ataque do seu oponente é negado."
- nome: "Cyber Esper"
  texto: "While this card is in face-up Attack Position, you can look at every card your opponent draws."
  texto_pt: "Enquanto este card estiver em Posição de Ataque com a face para cima, você pode olhar cada card que seu oponente comprar."
- nome: "Cyber Kirin"
  texto: "You can Tribute this card to make any effect damage you take this turn 0."
  texto_pt: "Você pode oferecer este card como Tributo para que qualquer dano por efeito que você sofrer neste turno passe a ser 0."
- nome: "Cyber Laser Dragon"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except with \"Photon Generator Unit\". Once per turn, you can destroy 1 monster with ATK or DEF equal to or higher than the ATK of this card."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto com \"Photon Generator Unit\". Uma vez por turno, você pode destruir 1 monstro com ATK ou DEF igual ou maior que o ATK deste card."
- nome: "Cyber Ogre"
  texto: "By discarding this card from your hand to the Graveyard, negate 1 battle involving a \"Cyber Ogre\" on your side of the field, and it gains 2000 ATK until the end of its next battle. This effect can be activated during either player's turn."
  texto_pt: "Descartando este card da sua mão para o Cemitério, negue 1 batalha que envolva um \"Cyber Ogre\" no seu lado do campo; ele ganha 2000 de ATK até o fim da próxima batalha dele. Este efeito pode ser ativado durante o turno de qualquer duelista."
- nome: "Cyber Ouroboros"
  texto: "When this card is removed from play, you can send 1 card from your hand to the Graveyard to draw 1 card."
  texto_pt: "Quando este card for banido, você pode enviar 1 card da sua mão para o Cemitério para comprar 1 card."
- nome: "Cybernetic Zone"
  texto: "Select 1 face-up Machine-Type Fusion Monster you control and remove it from play until the End Phase of this turn. When that monster is returned to the field, double its ATK. During your next Standby Phase, destroy it."
  texto_pt: "Escolha 1 Monstro de Fusão do Tipo Máquina com a face para cima que você controla e bana-o até a Fase Final deste turno. Quando esse monstro voltar para o campo, dobre o ATK dele. Durante a sua próxima Fase de Apoio, destrua-o."
- nome: "Damage Polarizer"
  texto: "Activate only when an effect that inflicts damage is activated. Negate its activation and effect, and each player draws 1 card."
  texto_pt: "Ative somente quando for ativado um efeito que causa dano. Negue a ativação e o efeito, e cada duelista compra 1 card."
- nome: "Fusion Guard"
  texto: "Activate only when an effect that inflicts damage is activated. Negate its activation and effect, and randomly send 1 Fusion Monster from your Extra Deck to the Graveyard."
  texto_pt: "Ative somente quando for ativado um efeito que causa dano. Negue a ativação e o efeito e envie aleatoriamente 1 Monstro de Fusão do seu Deck Adicional para o Cemitério."
- nome: "Morphtronic Boomboxen"
  texto: "● While in Attack Position, this card can attack twice during each Battle Phase.\n● Once per turn, while in Defense Position, when a face-up \"Morphtronic\" monster you control is targeted for an attack: You can negate the attack."
  texto_pt: "● Em Posição de Ataque, este card pode atacar duas vezes durante cada Fase de Batalha.\n● Uma vez por turno, em Posição de Defesa, quando um monstro \"Morfotrônico(a)\" com a face para cima que você controla for escolhido como alvo de um ataque: você pode negar o ataque."
- nome: "Morphtronic Clocken"
  texto: "● While in Attack Position: This card gains 500 ATK for each Morph Counter on it. ● While in Defense Position: Once per turn, you can place 1 Morph Counter on this card. You can Tribute this card to inflict 1000 damage to your opponent for each Morph Counter on it."
  texto_pt: "● Em Posição de Ataque: este card ganha 500 de ATK para cada Marcador Morph nele.\n● Em Posição de Defesa: uma vez por turno, você pode colocar 1 Marcador Morph neste card. Você pode oferecer este card como Tributo para causar 1000 de dano ao seu oponente para cada Marcador Morph nele."
- nome: "Photon Generator Unit"
  texto: "Tribute 2 \"Cyber Dragons\". Special Summon 1 \"Cyber Laser Dragon\" from your hand, Deck, or Graveyard."
  texto_pt: "Ofereça como Tributo 2 \"Dragão Cibernético\". Invoque por Invocação-Especial 1 \"Cyber Laser Dragon\" da sua mão, do seu Deck ou do seu Cemitério."
- nome: "Trojan Blast"
  texto: "Activate only when an opponent's card effect shifts control of a monster from your side of the field to theirs. Destroy that 1 monster and inflict damage to your opponent equal to its ATK."
  texto_pt: "Ative somente quando o efeito de um card do oponente transferir o controle de um monstro do seu lado do campo para o dele. Destrua esse monstro e cause ao seu oponente dano igual ao ATK dele."
- nome: "Archfiend Marmot of Nefariousness"
  texto: "An air marmot that has a nefarious horn and wings. It attacks by throwing acorns."
  texto_pt: "Uma marmota voadora com um chifre nefasto e asas. Ataca arremessando bolotas."
- nome: "Array of Revealing Light"
  texto: "Declare 1 Type of monster. Any monster of the declared Type cannot declare an attack during the turn it is Normal Summoned, Flip Summoned or Special Summoned."
  texto_pt: "Declare 1 Tipo de monstro. Monstros do Tipo declarado não podem declarar ataques no turno em que forem Invocados por Invocação-Normal, por Invocação-Virar ou por Invocação-Especial."
- nome: "Dimensional Inversion"
  texto: "Activate only when a monster(s) you own is removed from play by an opponent's effect. Special Summon 1 of those monsters."
  texto_pt: "Ative somente quando um ou mais monstros que você possui forem banidos por um efeito do oponente. Invoque por Invocação-Especial 1 desses monstros."
- nome: "Doriado"
  texto: "A spirit of the forest powered by the surrounding trees and wildlife."
  texto_pt: "Um espírito da floresta, fortalecido pelas árvores e pela vida selvagem ao redor."
- nome: "Light Spiral"
  texto: "Each time a card(s) is sent from your Deck to the Graveyard by the effect of a \"Lightsworn\" monster, remove from play the top card of your opponent's Deck."
  texto_pt: "Sempre que um ou mais cards forem enviados do seu Deck para o Cemitério pelo efeito de um monstro \"Luminoso(a)\", bana o card do topo do Deck do seu oponente."
- nome: "Mushroom Man"
  texto: "Found in humid regions, this creature attacks enemies with a lethal rain of poison spores."
  texto_pt: "Encontrada em regiões úmidas, esta criatura ataca os inimigos com uma chuva letal de esporos venenosos."
- nome: "Princess Curran"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except with \"Trial of the Princesses\". During your Standby Phase, inflict 600 damage to your opponent for each monster they control."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto com \"Trial of the Princesses\". Durante a sua Fase de Apoio, cause 600 de dano ao seu oponente para cada monstro que ele controla."
- nome: "Princess Pikeru"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except with \"Trial of the Princesses\". During your Standby Phase, gain 800 Life Points for each monster you control."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto com \"Trial of the Princesses\". Durante a sua Fase de Apoio, ganhe 800 PV para cada monstro que você controla."
- nome: "Queen's Bodyguard"
  texto: "\"Allure Queen\" monsters on your side of the field cannot be selected as an attack target."
  texto_pt: "Monstros \"Allure Queen\" no seu lado do campo não podem ser escolhidos como alvo de ataque."
- nome: "Ryko, Lightsworn Hunter"
  texto: "FLIP: You can destroy 1 card on the field. Send the top 3 cards of your Deck to the Graveyard."
  texto_pt: "VIRE: você pode destruir 1 card no campo. Envie os 3 cards do topo do seu Deck para o Cemitério."
- nome: "Simultaneous Loss"
  texto: "Each player sends the top card of their Deck to the Graveyard."
  texto_pt: "Cada duelista envia o card do topo do próprio Deck para o Cemitério."
- nome: "The League of Uniform Nomenclature"
  texto: "Select 1 face-up Level 2 or lower Normal Monster you control to activate this card. Special Summon as many cards as possible from your Deck with the same name as the selected monster."
  texto_pt: "Escolha 1 Monstro Normal de Nível 2 ou menos com a face para cima que você controla para ativar este card. Invoque por Invocação-Especial do seu Deck o máximo possível de cards com o mesmo nome do monstro escolhido."
- nome: "The Paths of Destiny"
  texto: "Both players toss a coin once. If a player's result is Heads, they gain 2000 Life Points, and if their result is Tails, they take 2000 damage."
  texto_pt: "Os dois duelistas jogam uma moeda uma vez. Se o resultado de um duelista for Cara, ele ganha 2000 PV; se for Coroa, ele sofre 2000 de dano."
- nome: "Trial of the Princesses"
  texto: "Equip only to \"White Magician Pikeru\" or \"Ebon Magician Curran\"; it gains 800 ATK. During a turn that the equipped monster destroyed a Level 5 or higher monster by battle, you can Tribute the equipped monster and this card to Special Summon from your hand or Deck: 1 \"Princess Pikeru\" if you Tributed \"White Magician Pikeru\", or 1 \"Princess Curran\" if you Tributed \"Ebon Magician Curran\"."
  texto_pt: "Equipe somente a \"Mágico Branco Pikeru\" ou \"Maga de Ébano Curran\"; ele ganha 800 de ATK. Durante um turno em que o monstro equipado tiver destruído em batalha um monstro de Nível 5 ou mais, você pode oferecer como Tributo o monstro equipado e este card para Invocar por Invocação-Especial, da sua mão ou do seu Deck: 1 \"Princess Pikeru\" se você ofereceu \"Mágico Branco Pikeru\" como Tributo, ou 1 \"Princess Curran\" se você ofereceu \"Maga de Ébano Curran\" como Tributo."
- nome: "Wulf, Lightsworn Beast"
  texto: "This card cannot be Normal Summoned or Set. When this card is sent from your Deck to the Graveyard, Special Summon it."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Quando este card for enviado do seu Deck para o Cemitério, Invoque-o por Invocação-Especial."
- nome: "Cyber Blader"
  texto: "\"Etoile Cyber\" + \"Blade Skater\"\nA Fusion Summon of this card can only be conducted with the above Fusion Material Monsters. While your opponent controls only 1 monster, this card cannot be destroyed by battle. While your opponent controls only 2 monsters, double this card's ATK. While your opponent controls only 3 monsters, negate the effects of your opponent's Spell, Trap, and Effect Monster Cards."
  texto_pt: "\"Ciber Etoile\" + \"Skater de Lâmina\"\nA Invocação-Fusão deste card só pode ser feita com os Monstros Matéria de Fusão acima. Enquanto seu oponente controlar apenas 1 monstro, este card não pode ser destruído em batalha. Enquanto seu oponente controlar apenas 2 monstros, dobre o ATK deste card. Enquanto seu oponente controlar apenas 3 monstros, negue os efeitos dos Cards de Magia, de Armadilha e de Monstro de Efeito do seu oponente."
- nome: "Ice Master"
  texto: "You can Special Summon this card (from your hand) by Tributing 2 WATER monsters. Once per turn: You can target 1 face-up monster on the field; place an Ice Counter on that target. You can Tribute this card; destroy all monsters with an Ice Counter(s)."
  texto_pt: "Você pode Invocar este card por Invocação-Especial (da sua mão) oferecendo como Tributo 2 monstros de ÁGUA. Uma vez por turno: você pode escolher 1 monstro com a face para cima no campo; coloque um Marcador de Gelo no alvo. Você pode oferecer este card como Tributo; destrua todos os monstros com um ou mais Marcadores de Gelo."
- nome: "Avalanching Aussa"
  texto: "Once per turn, you can Tribute 1 EARTH monster (except this card) to Special Summon 1 EARTH monster from your hand. The monster Special Summoned by this effect is destroyed if \"Avalanching Aussa\" is removed from your side of the field."
  texto_pt: "Uma vez por turno, você pode oferecer como Tributo 1 monstro de TERRA (exceto este card) para Invocar por Invocação-Especial 1 monstro de TERRA da sua mão. O monstro Invocado por Invocação-Especial por este efeito é destruído se \"Avalanching Aussa\" sair do seu lado do campo."
- nome: "The Forgiving Maiden"
  texto: "Tribute this face-up card to return to your hand 1 of your monsters destroyed as a result of battle during this turn."
  texto_pt: "Ofereça este card com a face para cima como Tributo para devolver à sua mão 1 dos seus monstros destruídos em batalha neste turno."
- nome: "Giant Scorpion of the Tundra"
  texto: "An extraordinary blue scorpion found in the tundra, not in the desert."
  texto_pt: "Um extraordinário escorpião azul encontrado na tundra, não no deserto."
- nome: "Kunoichi"
  texto: "When control of this face-up card changes, its new controller discards 1 random card."
  texto_pt: "Quando o controle deste card com a face para cima mudar, o novo controlador descarta 1 card aleatório."
- nome: "Multiple Piece Golem"
  texto: "\"Big Piece Golem\" + \"Medium Piece Golem\"\nAt the end of the Battle Phase, if this card attacked or was attacked, you can return it to the Extra Deck. Then, if all of the Fusion Material Monsters that were used for the Fusion Summon of this card are in your Graveyard, you can Special Summon them."
  texto_pt: "\"Big Piece Golem\" + \"Medium Piece Golem\"\nNo fim da Fase de Batalha, se este card atacou ou foi atacado, você pode devolvê-lo para o Deck Adicional. Depois, se todos os Monstros Matéria de Fusão usados na Invocação-Fusão deste card estiverem no seu Cemitério, você pode Invocá-los por Invocação-Especial."
- nome: "Sonic Maid"
  texto: "A maiden that uses sound to her advantage, she wields a scythe that's shaped like a musical note."
  texto_pt: "Uma donzela que usa o som a seu favor; ela empunha uma foice em forma de nota musical."
- nome: "Splendid Venus"
  texto: "All non-Fairy-Type monsters lose 500 ATK and DEF. The activation and effects of your Spell and Trap Cards cannot be negated."
  texto_pt: "Todos os monstros que não sejam do Tipo Fada perdem 500 de ATK e DEF. A ativação e os efeitos dos seus Cards de Magia e de Armadilha não podem ser negados."
- nome: "St. Joan"
  texto: "\"The Forgiving Maiden\" + \"Darklord Marie\""
  texto_pt: "\"The Forgiving Maiden\" + \"Senhora Obscura Maria\""
- nome: "Warrior of Tradition"
  texto: "\"Sonic Maid\" + \"Beautiful Headhuntress\""
  texto_pt: "\"Sonic Maid\" + \"Beautiful Headhuntress\""
- nome: "30,000-Year White Turtle"
  texto: "A huge turtle that has existed for over 30,000 years."
  texto_pt: "Uma tartaruga enorme que existe há mais de 30.000 anos."
- nome: "Abyss Flower"
  texto: "A rarely seen flower that blossoms quietly on the edge of darkness."
  texto_pt: "Uma flor rara que desabrocha em silêncio à beira da escuridão."
- nome: "Acid Crawler"
  texto: "A giant caterpillar that secretes an acid mist that melts anything."
  texto_pt: "Uma lagarta gigante que expele uma névoa ácida capaz de derreter qualquer coisa."
- nome: "Akakieisu"
  texto: "A sorcerer who utters spells that render monsters unconscious."
  texto_pt: "Um feiticeiro que profere feitiços que deixam os monstros inconscientes."
- nome: "Akihiron"
  texto: "This strange creature hides in the deep, dark corners of the seven seas."
  texto_pt: "Esta criatura estranha se esconde nos cantos profundos e escuros dos sete mares."
- nome: "Ancient Sorcerer"
  texto: "Armed with an array of magic wands, this creature is capable of multiple attacks."
  texto_pt: "Armada com uma coleção de varinhas mágicas, esta criatura é capaz de atacar várias vezes."
- nome: "Ancient Tree of Enlightenment"
  texto: "This ancient arbor uses its extensive knowledge to avoid the damage of enemy attacks."
  texto_pt: "Esta árvore ancestral usa seu vasto conhecimento para evitar o dano dos ataques inimigos."
- nome: "Aqua Snake"
  texto: "This monster hypnotizes an opponent with the ball on its tail and draws them to a watery doom."
  texto_pt: "Este monstro hipnotiza o oponente com a bola na ponta da cauda e o arrasta para um destino aquático."
- nome: "Archfiend Mirror"
  texto: "A wicked mirror that hypnotizes enemies, diverting attacks from their intended targets."
  texto_pt: "Um espelho maligno que hipnotiza os inimigos e desvia os ataques dos alvos pretendidos."
- nome: "Arlownay"
  texto: "A lady monster dwelling in a flower, she sprinkles the air with poisonous pollen."
  texto_pt: "Uma dama-monstro que vive em uma flor e espalha pólen venenoso no ar."
- nome: "Arma Knight"
  texto: "An ammonite warrior that has protected the seas throughout history."
  texto_pt: "Um guerreiro amonite que protegeu os mares ao longo da história."
- nome: "Armored Rat"
  texto: "The fur on this monster rat is tough enough to repel swords."
  texto_pt: "O pelo deste rato-monstro é tão resistente que repele espadas."
- nome: "B. Dragon Jungle King"
  texto: "A jet-black dragon found in the deepest jungles who normally devours trees."
  texto_pt: "Um dragão negro como azeviche, encontrado nas selvas mais profundas, que normalmente devora árvores."
- nome: "Barrel Lily"
  texto: "This wicked flower attacks enemies with pollen projectiles."
  texto_pt: "Esta flor maligna ataca os inimigos com projéteis de pólen."
- nome: "Bat"
  texto: "A mechanical bat that drops blasts from its wings."
  texto_pt: "Um morcego mecânico que dispara rajadas das asas."
- nome: "Beaked Snake"
  texto: "This monster wraps itself around an opponent and pecks away with its huge beak."
  texto_pt: "Este monstro se enrola no oponente e o bica com seu bico enorme."
- nome: "Bean Soldier"
  texto: "A plant-warrior that attacks with seeds and sword."
  texto_pt: "Um guerreiro-planta que ataca com sementes e espada."
- nome: "Beautiful Beast Trainer"
  texto: "A rare female beast-master with a very dangerous whip."
  texto_pt: "Uma rara domadora de feras com um chicote muito perigoso."
- nome: "Binding Chain"
  texto: "The mystic links of this chain can rob enemies of their power."
  texto_pt: "Os elos místicos desta corrente conseguem roubar o poder dos inimigos."
- nome: "Bio Plant"
  texto: "A monster created from a major accident in an underground lab."
  texto_pt: "Um monstro criado por um grave acidente em um laboratório subterrâneo."
- nome: "Bio-Mage"
  texto: "A mysterious priest created as a result of the latest advances in biotechnology."
  texto_pt: "Um sacerdote misterioso, criado pelos avanços mais recentes da biotecnologia."
- nome: "Blocker"
  texto: "Constructed from several components, this monster can launch them in a pincer attack."
  texto_pt: "Construído com várias peças, este monstro consegue lançá-las em um ataque em pinça."
- nome: "Bone Mouse"
  texto: "A mouse that has returned as a zombie to seek revenge on cats."
  texto_pt: "Um rato que voltou como zumbi para se vingar dos gatos."
- nome: "Boneheimer"
  texto: "This monster wanders the seas, sucking dry any creatures it may encounter."
  texto_pt: "Este monstro vaga pelos mares, sugando até secar qualquer criatura que encontrar."
- nome: "Boo Koo"
  texto: "A book-like wizard with a wealth of magic written inside."
  texto_pt: "Um mago em forma de livro, com uma riqueza de magias escritas por dentro."
- nome: "Boulder Tortoise"
  texto: "A stone turtle that is nearly indestructible."
  texto_pt: "Uma tartaruga de pedra quase indestrutível."
- nome: "Candle of Fate"
  texto: "Decides the fate of an opponent when the candle on its fingertip burns out."
  texto_pt: "Decide o destino de um oponente quando a vela na ponta do seu dedo se apaga."
- nome: "Corroding Shark"
  texto: "A zombie shark that can deliver its lethal curse with a spell."
  texto_pt: "Um tubarão zumbi capaz de lançar sua maldição letal com um feitiço."
- nome: "Crow Goblin"
  texto: "A clever long-nosed goblin, he is a force to be reckoned with."
  texto_pt: "Um goblin narigudo e esperto; é uma força a ser respeitada."
- nome: "Cyber Soldier of Darkworld"
  texto: "A mechanical soldier that won't stop attacking until all life readings have been extinguished from its sensors.\n\n(This card is not treated as a \"Cyber\" card.)"
  texto_pt: "Um soldado mecânico que não para de atacar até que todos os sinais de vida desapareçam dos seus sensores.\n\n(Este card não é tratado como um card \"Ciber\".)"
- nome: "Cyber Soldier"
  texto: "Guardian of the Machine Master, it crushes opposition by rolling over them."
  texto_pt: "Guardião do Mestre das Máquinas, esmaga a oposição passando por cima dela."
- nome: "Dancing Elf"
  texto: "An elf that dances across the sky with wings of razor-sharp blades."
  texto_pt: "Uma elfa que dança pelo céu com asas de lâminas afiadas como navalhas."
- nome: "Dark Plant"
  texto: "This mutant flower draws its power from pollutants and the dark forces."
  texto_pt: "Esta flor mutante tira seu poder dos poluentes e das forças das trevas."
- nome: "Dark Shade"
  texto: "A crystal monster that unleashes a brilliant light to blind enemies."
  texto_pt: "Um monstro de cristal que libera uma luz brilhante para cegar os inimigos."
- nome: "Djinn the Watcher of the Wind"
  texto: "This creature generates gale-force winds and tornadoes to blow its enemies away."
  texto_pt: "Esta criatura gera ventos fortíssimos e tornados para varrer os inimigos."
- nome: "Dragon Statue"
  texto: "A stone warrior with the heart of a dragon."
  texto_pt: "Um guerreiro de pedra com coração de dragão."
- nome: "Droll Bird"
  texto: "This monster stuns its enemies with a massive beak and ear-piercing wails."
  texto_pt: "Este monstro atordoa os inimigos com um bico enorme e gritos de estourar os tímpanos."
- nome: "Eldeen"
  texto: "The cane of this monster is the source of many powerful spells."
  texto_pt: "A bengala deste monstro é a fonte de muitos feitiços poderosos."
- nome: "Embryonic Beast"
  texto: "An imperfect monster with a belly vortex that sucks in opponents of any size."
  texto_pt: "Um monstro imperfeito com um vórtice na barriga que suga oponentes de qualquer tamanho."
- nome: "Emperor of the Land and Sea"
  texto: "A reptilian monster that sprays fire in every direction."
  texto_pt: "Um monstro reptiliano que cospe fogo em todas as direções."
- nome: "Eyearmor"
  texto: "This warrior transforms into various creatures to confuse enemies in battle."
  texto_pt: "Este guerreiro se transforma em várias criaturas para confundir os inimigos em batalha."
- nome: "Fairywitch"
  texto: "Though destined to be a fairy, this creature chose the way of the witch instead."
  texto_pt: "Embora destinada a ser uma fada, esta criatura escolheu o caminho da bruxa."
- nome: "Fairy of the Fountain"
  texto: "This fairy protects a fountain from any who seek to muddy its waters."
  texto_pt: "Esta fada protege uma fonte de quem quiser turvar suas águas."
- nome: "Fairy's Gift"
  texto: "This flying monster is known for delivering happiness to all."
  texto_pt: "Este monstro voador é conhecido por levar felicidade a todos."
- nome: "Fiend Reflection 1"
  texto: "This monster can draw its enemies into a mirror world that renders them helpless."
  texto_pt: "Este monstro consegue atrair os inimigos para um mundo de espelhos que os deixa indefesos."
- nome: "Fiend Sword"
  texto: "Whoever resists the curse of this blade will gain untold power."
  texto_pt: "Quem resistir à maldição desta lâmina ganhará um poder incalculável."
- nome: "Fiend's Hand"
  texto: "Arms that reach out from the Swamp of Chaos to drag down the unwary."
  texto_pt: "Braços que saem do Pântano do Caos para arrastar os desavisados."
- nome: "Fire Eye"
  texto: "An eye engulfed in flames that flaps its wings to create hot blasts of air."
  texto_pt: "Um olho envolto em chamas que bate as asas para criar rajadas de ar quente."
- nome: "Flame Dancer"
  texto: "This monster moves while swinging its burning rope."
  texto_pt: "Este monstro se move girando sua corda em chamas."
- nome: "Flying Fish"
  texto: "Three wishes are granted to those fortunate enough to see this monster in flight."
  texto_pt: "Três desejos são concedidos a quem tiver a sorte de ver este monstro em voo."
- nome: "Fungi of the Musk"
  texto: "Melts away anything that dares to stand before it."
  texto_pt: "Derrete qualquer coisa que ouse ficar na sua frente."
- nome: "Ganigumo"
  texto: "A crab that binds its enemies with a sticky web and attacks them with its sharp claws."
  texto_pt: "Um caranguejo que prende os inimigos com uma teia pegajosa e os ataca com as garras afiadas."
- nome: "Garvas"
  texto: "A wicked beast that resembles a winged lion."
  texto_pt: "Uma fera maligna que lembra um leão alado."
- nome: "Gate Deeg"
  texto: "This weird monster has a portal in its belly that brings reinforcements from the farthest reaches of the netherworld."
  texto_pt: "Este monstro estranho tem um portal na barriga que traz reforços dos confins do submundo."
- nome: "Genin"
  texto: "A creature that defeats its enemies using sleight-of-hand."
  texto_pt: "Uma criatura que derrota os inimigos com truques de prestidigitação."
- nome: "Gorgon Egg"
  texto: "The gorgon egg's massive eyes are said to reflect the fate of its enemies."
  texto_pt: "Dizem que os olhos enormes do ovo de górgona refletem o destino dos inimigos."
- nome: "Grand Tiki Elder"
  texto: "A masked monster that wields the most deadly of curses."
  texto_pt: "Um monstro mascarado que domina as maldições mais mortais."
- nome: "Graveyard and the Hand of Invitation"
  texto: "A graveyard that serves as a power source for zombies."
  texto_pt: "Um cemitério que serve de fonte de poder para os zumbis."
- nome: "Great Bill"
  texto: "Nothing escapes from this beast's massive mouth."
  texto_pt: "Nada escapa da boca enorme desta fera."
- nome: "Happy Lover"
  texto: "Enemies become overjoyed when struck by the Heart Ray emitted from the forehead of this tiny cherub."
  texto_pt: "Os inimigos ficam radiantes quando atingidos pelo Raio do Coração que sai da testa deste pequeno querubim."
- nome: "Holograh"
  texto: "This machine generates illusions that leave an enemy wide open to attacks."
  texto_pt: "Esta máquina gera ilusões que deixam o inimigo totalmente exposto a ataques."
- nome: "Hyo"
  texto: "None can survive the cold touch of this sub-zero warrior."
  texto_pt: "Ninguém sobrevive ao toque gelado deste guerreiro abaixo de zero."
- nome: "Ice Water"
  texto: "A very aggressive mermaid that attacks enemies with the spikes growing from its body."
  texto_pt: "Uma sereia muito agressiva que ataca os inimigos com os espinhos que crescem do seu corpo."
- nome: "Ill Witch"
  texto: "This monster blasts enemies with unexpected bursts of wind."
  texto_pt: "Este monstro atinge os inimigos com rajadas de vento inesperadas."
- nome: "Kamakiriman"
  texto: "A man-shaped mantis with two razor-sharp scythes."
  texto_pt: "Um louva-a-deus em forma de homem, com duas foices afiadas como navalhas."
- nome: "Kanan the Swordmistress"
  texto: "A lady warrior armed with sword and shield, she floats lightly and stings sharply."
  texto_pt: "Uma guerreira armada com espada e escudo; ela flutua com leveza e golpeia com precisão."
- nome: "Kanikabuto"
  texto: "A monster crab with huge claws for clipping enemies to little pieces."
  texto_pt: "Um caranguejo-monstro com pinças enormes para cortar os inimigos em pedacinhos."
- nome: "Kappa Avenger"
  texto: "An amphibian that sold his soul for unlimited power to avenge his late friend."
  texto_pt: "Um anfíbio que vendeu a alma em troca de poder ilimitado para vingar seu falecido amigo."
- nome: "Kattapillar"
  texto: "Attacks enemies by spitting thin, sticky webs."
  texto_pt: "Ataca os inimigos cuspindo teias finas e pegajosas."
- nome: "Key Mace 2"
  texto: "This fiend brings out the worst in everyone."
  texto_pt: "Este demônio desperta o que há de pior em todos."
- nome: "Key Mace"
  texto: "Enemies' hearts will melt at the sight of this small fairy's cuteness."
  texto_pt: "O coração dos inimigos derrete diante da fofura desta pequena fada."
- nome: "Korogashi"
  texto: "A high-powered dung beetle that can roll dung larger than itself. It crushes its foes with its massive ball of dung."
  texto_pt: "Um besouro rola-bosta superpoderoso, capaz de rolar uma bola de esterco maior que ele. Esmaga os inimigos com sua enorme bola de esterco."
- nome: "LaMoon"
  texto: "A sorcerer that draws its powers from the lunar landscape."
  texto_pt: "Um feiticeiro que tira seus poderes da paisagem lunar."
- nome: "Leo Wizard"
  texto: "A wizard with a black mantle who is actually a talking lion in disguise."
  texto_pt: "Um mago de manto negro que, na verdade, é um leão falante disfarçado."
- nome: "Lightning Conger"
  texto: "This massive eel generates huge charges of electricity and unleashes them as thunderbolts."
  texto_pt: "Esta enguia enorme gera cargas elétricas gigantescas e as libera como raios."
- nome: "Lisark"
  texto: "A creature with sapphire eyes that mesmerizes and confuses enemies."
  texto_pt: "Uma criatura de olhos de safira que hipnotiza e confunde os inimigos."
- nome: "Living Vase"
  texto: "A living vase that bites enemies and blinds them with a blast of pollen from its flower."
  texto_pt: "Um vaso vivo que morde os inimigos e os cega com uma rajada de pólen da sua flor."
- nome: "Lizard Soldier"
  texto: "A beast soldier derived from dragons, it is small for a Dragon-Type. Moving very quickly, this monster is an excellent strategist."
  texto_pt: "Um soldado-fera descendente dos dragões, pequeno para um monstro do Tipo Dragão. Muito veloz, este monstro é um excelente estrategista."
- nome: "Lord of Zemia"
  texto: "A wicked entity that manipulates enemies towards a path of destruction."
  texto_pt: "Uma entidade maligna que conduz os inimigos por um caminho de destruição."
- nome: "Lucky Trinket"
  texto: "This creature may look slim and weak, but it's protected by a mystical force."
  texto_pt: "Esta criatura pode parecer magra e fraca, mas é protegida por uma força mística."
- nome: "Lunar Queen Elzaim"
  texto: "A lovely creature guarded by the moon. Her lunar curtain can block just about any attack."
  texto_pt: "Uma criatura encantadora protegida pela lua. Sua cortina lunar consegue bloquear quase qualquer ataque."
- nome: "Mabarrel"
  texto: "This cannon-like creature fires eyeballs so fast they can't be seen."
  texto_pt: "Esta criatura em forma de canhão dispara globos oculares tão rápido que não dá para vê-los."
- nome: "Machine Attacker"
  texto: "This machine, created to lead charges into enemy territory, mows down enemies by rushing."
  texto_pt: "Criada para liderar investidas em território inimigo, esta máquina atropela os inimigos em disparada."
- nome: "Madjinn Gunn"
  texto: "A living weapon that spits projectiles."
  texto_pt: "Uma arma viva que cospe projéteis."
- nome: "Maiden of the Moonlight"
  texto: "A sorcerer blessed by lunar light with powers far beyond mortal comprehension."
  texto_pt: "Uma feiticeira abençoada pela luz da lua, com poderes muito além da compreensão dos mortais."
- nome: "Man-Eating Plant"
  texto: "A meat-eating plant that is attractive to the eye but dangerous when approached."
  texto_pt: "Uma planta carnívora que atrai os olhos, mas é perigosa para quem se aproxima."
- nome: "Masked Clown"
  texto: "This warrior's fatal dance is performed with a lethal sickle."
  texto_pt: "A dança fatal deste guerreiro é executada com uma foice letal."
- nome: "Mech Bass"
  texto: "This monster carries a devastating plasma cannon on its powerful back."
  texto_pt: "Este monstro carrega um devastador canhão de plasma nas costas poderosas."
- nome: "Mech Mole Zombie"
  texto: "This creature attacks by launching missile-like arms."
  texto_pt: "Esta criatura ataca lançando braços que parecem mísseis."
- nome: "Mechaleon"
  texto: "This monster can hide just about anywhere by adopting the colors of its surroundings."
  texto_pt: "Este monstro consegue se esconder em quase qualquer lugar assumindo as cores ao redor."
- nome: "Megasonic Eye"
  texto: "Made of mysterious metal, this monster is a doomsday machine from the edge of the universe."
  texto_pt: "Feito de um metal misterioso, este monstro é uma máquina do juízo final vinda dos confins do universo."
- nome: "Megirus Light"
  texto: "The fatal beams from the eyes of this monster result in grim destruction."
  texto_pt: "Os raios fatais dos olhos deste monstro causam uma destruição terrível."
- nome: "Metal Guardian"
  texto: "A fiend guarding the treasures of the netherworld, it's most at home in the dark."
  texto_pt: "Um demônio que guarda os tesouros do submundo; sente-se em casa na escuridão."
- nome: "Midnight Fiend"
  texto: "This monster only appears when a midnight tribute is made."
  texto_pt: "Este monstro só aparece quando é feita uma oferenda à meia-noite."
- nome: "Molten Behemoth"
  texto: "A giant born from magma, it attacks with a magma punch."
  texto_pt: "Um gigante nascido do magma; ataca com um soco de magma."
- nome: "Mon Larvas"
  texto: "A further step in the evolutionary chain, it is much more powerful than \"Larvas\"."
  texto_pt: "Um passo além na cadeia evolutiva, é muito mais poderoso que \"Larvas\"."
- nome: "Monstrous Bird"
  texto: "Few have set eyes on this dive-bombing bird and lived to tell the tale."
  texto_pt: "Poucos viram esta ave que mergulha como um bombardeiro e viveram para contar a história."
- nome: "Monsturtle"
  texto: "Protected by a spiked shell, this turtle has a very nasty disposition."
  texto_pt: "Protegida por um casco espinhoso, esta tartaruga tem um temperamento péssimo."
- nome: "Moon Envoy"
  texto: "Many have fallen victim to this lunar warrior's crescent pike."
  texto_pt: "Muitos caíram vítimas da lança crescente deste guerreiro lunar."
- nome: "Mountain Warrior"
  texto: "A tough warrior that can move smoothly on even the roughest terrain."
  texto_pt: "Um guerreiro resistente que se move com facilidade até no terreno mais acidentado."
- nome: "Muse-A"
  texto: "A fairy of the arts that is unbeatable on the harp."
  texto_pt: "Uma fada das artes, imbatível na harpa."
- nome: "Mystery Hand"
  texto: "This monster twists reality and reaches between dimensions to attack its enemies."
  texto_pt: "Este monstro distorce a realidade e atravessa dimensões para atacar os inimigos."
- nome: "Mystical Capture Chain"
  texto: "A mystical chain that binds enemies, rendering them immobile."
  texto_pt: "Uma corrente mística que prende os inimigos e os deixa imóveis."
- nome: "Necrolancer the Time-lord"
  texto: "The one-eyed Necrolancer launches his onslaught from a dimensional ring that can appear out of thin air."
  texto_pt: "O caolho Necrolancer lança seu ataque de um anel dimensional que pode surgir do nada."
- nome: "Nekogal 1"
  texto: "A pussycat-fairy. Contrary to her lovely beauty, she claws on her enemies."
  texto_pt: "Uma fada-gatinha. Ao contrário da sua beleza encantadora, ela arranha os inimigos com as garras."
- nome: "Night Lizard"
  texto: "A lizard warrior protected by a hide of very tough emerald scales."
  texto_pt: "Um guerreiro-lagarto protegido por um couro de escamas de esmeralda muito resistentes."
- nome: "Nightmare Scorpion"
  texto: "A creature that generates nightmares to haunt an opponent, it attacks with four poisonous tails."
  texto_pt: "Uma criatura que cria pesadelos para assombrar o oponente; ataca com quatro caudas venenosas."
- nome: "Obese Marmot of Nefariousness"
  texto: "An ill-mannered field varmint that will sink its teeth into anything."
  texto_pt: "Um bicho do campo mal-educado que crava os dentes em qualquer coisa."
- nome: "One Who Hunts Souls"
  texto: "This dangerous creature brandishes a soul-sucking sword."
  texto_pt: "Esta criatura perigosa empunha uma espada que suga almas."
- nome: "Orion the Battle King"
  texto: "None have lived to tell tales of this powerful battle fairy."
  texto_pt: "Ninguém viveu para contar histórias sobre esta poderosa fada de batalha."
- nome: "Wattkid"
  texto: "A creature that electrocutes opponents with bolts of lightning."
  texto_pt: "Uma criatura que eletrocuta os oponentes com raios."
- nome: "Oscillo Hero"
  texto: "A strange warrior from another dimension."
  texto_pt: "Um guerreiro estranho vindo de outra dimensão."
- nome: "Phantom Dewan"
  texto: "A sorcerer that can paralyze an enemy with a single curse."
  texto_pt: "Um feiticeiro capaz de paralisar um inimigo com uma única maldição."
- nome: "Phantom Ghost"
  texto: "A vengeful spirit made up of many restless souls."
  texto_pt: "Um espírito vingativo formado por muitas almas inquietas."
- nome: "Queen of Autumn Leaves"
  texto: "Queen of the Emerald Forest and wife of the Spirit King, she lives surrounded by vivid red leaves."
  texto_pt: "Rainha da Floresta Esmeralda e esposa do Rei dos Espíritos, ela vive cercada de folhas de um vermelho intenso."
- nome: "Rainbow Marine Mermaid"
  texto: "A reticent mermaid who appears only on very rare occasions. She emerges only when a large rainbow arches across the sky."
  texto_pt: "Uma sereia reservada que aparece apenas em ocasiões muito raras. Ela só surge quando um grande arco-íris atravessa o céu."
- nome: "Rock Ogre Grotto 2"
  texto: "A golem formed by boulders, this monster turns its enemies to stone and crushes them to dust."
  texto_pt: "Um golem formado por rochas; este monstro transforma os inimigos em pedra e os reduz a pó."
- nome: "Rock Spirit"
  texto: "A fairy of boulders that looks like an earthenware statue. It is quite strong in terms of both attack and defense."
  texto_pt: "Uma fada das rochas que parece uma estátua de barro. É bem forte tanto no ataque quanto na defesa."
- nome: "Royal Guard"
  texto: "A mechanized soldier created to protect royalty."
  texto_pt: "Um soldado mecanizado criado para proteger a realeza."
- nome: "Sea King Dragon"
  texto: "Protected by a tough shell, this master of the sea attacks its enemies with toxic bubbles."
  texto_pt: "Protegido por uma carapaça resistente, este senhor dos mares ataca os inimigos com bolhas tóxicas."
- nome: "Sectarian of Secrets"
  texto: "This wizard worships the darkness, and is served by a sinister hand that drags its enemies into oblivion."
  texto_pt: "Este mago adora as trevas e é servido por uma mão sinistra que arrasta os inimigos para o esquecimento."
- nome: "Serpent Marauder"
  texto: "A snake with a single eye that blows an icy breath to freeze its opponents."
  texto_pt: "Uma cobra de um olho só que sopra um hálito gélido para congelar os oponentes."
- nome: "Shining Friendship"
  texto: "The peacemaker among monsters."
  texto_pt: "O pacificador entre os monstros."
- nome: "Sky Dragon"
  texto: "A flying dragon with four wings housing some very dangerous blades."
  texto_pt: "Um dragão voador com quatro asas que escondem lâminas muito perigosas."
- nome: "Solitude"
  texto: "This beast-warrior swings a massive scythe that feeds on the souls of the slain."
  texto_pt: "Esta besta-guerreira empunha uma foice enorme que se alimenta das almas dos mortos."
- nome: "Spherous Lady"
  texto: "Many have been deceived by the beauty of this vampire."
  texto_pt: "Muitos foram enganados pela beleza desta vampira."
- nome: "Spiked Snail"
  texto: "A very fast, bipedal snail with a pair of lethal arms."
  texto_pt: "Um caracol bípede muito rápido, com um par de braços letais."
- nome: "Spirit of the Books"
  texto: "This wise spirit dwells in books, using its accumulated knowledge to defeat enemies."
  texto_pt: "Este espírito sábio vive nos livros e usa o conhecimento acumulado para derrotar os inimigos."
- nome: "Spirit of the Mountain"
  texto: "An elderly magician that raises mountains with his flute."
  texto_pt: "Um mago idoso que ergue montanhas com sua flauta."
- nome: "Spirit of the Winds"
  texto: "A spirit of the wind that calls up a storm when it's in a bad mood."
  texto_pt: "Um espírito do vento que invoca uma tempestade quando está de mau humor."
- nome: "Stone Dragon"
  texto: "A dragon formed by huge boulders that are also used to attack the enemy."
  texto_pt: "Um dragão formado por rochas enormes, que também servem para atacar o inimigo."
- nome: "Stone Ghost"
  texto: "With a head that erupts when angered, this monster launches a dangerous shower of boulders."
  texto_pt: "Com uma cabeça que entra em erupção quando fica com raiva, este monstro lança uma perigosa chuva de rochas."
- nome: "Stuffed Animal"
  texto: "It may look like a harmless stuffed animal, but its zipper mouth deals a deadly bite."
  texto_pt: "Pode parecer um bicho de pelúcia inofensivo, mas sua boca de zíper dá uma mordida mortal."
- nome: "Supporter in the Shadows"
  texto: "A cute little elf that hides in the shadows and provides spiritual support."
  texto_pt: "Um elfinho fofo que se esconde nas sombras e dá apoio espiritual."
- nome: "Synchar"
  texto: "This two-headed creature spits laser blasts at its enemies."
  texto_pt: "Esta criatura de duas cabeças cospe rajadas de laser nos inimigos."
- nome: "Takriminos"
  texto: "A member of a race of sea serpents that freely travels through the sea."
  texto_pt: "Membro de uma raça de serpentes marinhas que viaja livremente pelo mar."
- nome: "Tao the Chanter"
  texto: "Master of Yin and Yang, this wizard handles a delicate balance of spells and counter spells."
  texto_pt: "Mestre do Yin e do Yang, este mago mantém um equilíbrio delicado entre feitiços e contrafeitiços."
- nome: "Tenderness"
  texto: "An adorable fairy that celebrates the gift of love."
  texto_pt: "Uma fada adorável que celebra o dom do amor."
- nome: "Tentacle Plant"
  texto: "A carnivorous plant that has an outgrowth of tentacles. It attacks someone nearby by extending its tentacles."
  texto_pt: "Uma planta carnívora da qual brotam tentáculos. Ataca quem estiver por perto estendendo os tentáculos."
- nome: "The Drdek"
  texto: "A bipedal eyeball that seldom misses an enemy with its lethal talons."
  texto_pt: "Um globo ocular bípede que raramente erra um inimigo com suas garras letais."
- nome: "The Illusory Gentleman"
  texto: "Wearing odd fashions, this gentleman is very fickle. He sometimes saves people and at other times commits crimes."
  texto_pt: "Com roupas excêntricas, este cavalheiro é muito volúvel. Às vezes salva pessoas, outras vezes comete crimes."
- nome: "The Judgement Hand"
  texto: "An all-powerful hand that delivers ruthless attacks."
  texto_pt: "Uma mão todo-poderosa que desfere ataques implacáveis."
- nome: "The Melting Red Shadow"
  texto: "This monster melts away to materialize under its enemies, taking them by surprise."
  texto_pt: "Este monstro se derrete para se materializar debaixo dos inimigos e pegá-los de surpresa."
- nome: "The Portrait's Secret"
  texto: "A portrait cursed by the artist, it is said to bring ill fortune to anyone who owns it."
  texto_pt: "Um retrato amaldiçoado pelo artista; dizem que traz azar a quem o possuir."
- nome: "The Thing That Hides in the Mud"
  texto: "This monster melts its way underground to attack enemies from below."
  texto_pt: "Este monstro abre caminho derretendo o subsolo para atacar os inimigos por baixo."
- nome: "The Wandering Doomed"
  texto: "A monster that wanders the edges of the netherworld."
  texto_pt: "Um monstro que vaga pelos limites do submundo."
- nome: "Three-Legged Zombies"
  texto: "A pair of friendly skeletons, lean and fat, that travel with extreme difficulty."
  texto_pt: "Uma dupla de esqueletos simpáticos, um magro e um gordo, que viajam com extrema dificuldade."
- nome: "Thunder Kid"
  texto: "This monster stores electricity within his body, and can unleash it with catastrophic power."
  texto_pt: "Este monstro armazena eletricidade no corpo e pode liberá-la com uma força catastrófica."
- nome: "Toad Master"
  texto: "A hermit frog that has been in existence for thousands of years, it attacks with tadpoles."
  texto_pt: "Um sapo eremita que existe há milhares de anos; ataca com girinos."
- nome: "Togex"
  texto: "An agile monster that rolls up to ram its opponents."
  texto_pt: "Um monstro ágil que se enrola como uma bola para atropelar os oponentes."
- nome: "Torike"
  texto: "Although a poor defender, this monster's sharp horn gives it an edge when attacking."
  texto_pt: "Embora seja fraco na defesa, o chifre afiado deste monstro lhe dá vantagem no ataque."
- nome: "Turtle Bird"
  texto: "An unusual turtle that not only swims at tremendous speeds, but can also sail across the skies."
  texto_pt: "Uma tartaruga incomum que não só nada em velocidade incrível como também consegue cruzar os céus."
- nome: "Turtle Raccoon"
  texto: "A cunning raccoon protected by a solid turtle shell, it attacks with deception."
  texto_pt: "Um guaxinim astuto protegido por um casco de tartaruga resistente; ataca com trapaças."
- nome: "Turu-Purun"
  texto: "A strange, one-eyed monster that can fell an enemy with a single stab of its spear."
  texto_pt: "Um monstro estranho de um olho só, capaz de derrubar um inimigo com um único golpe de lança."
- nome: "Twin Long Rods 1"
  texto: "With whip-like arms, this creature can attack enemies from a distance."
  texto_pt: "Com braços que parecem chicotes, esta criatura consegue atacar os inimigos à distância."
- nome: "Ushi Oni"
  texto: "A bull fiend restored by the dark arts, this monster appears out of a jar."
  texto_pt: "Um demônio-touro restaurado pelas artes das trevas; este monstro surge de dentro de um jarro."
- nome: "Violent Rain"
  texto: "This monster can call forth sudden torrents of battering rain."
  texto_pt: "Este monstro consegue invocar torrentes repentinas de chuva violenta."
- nome: "Vishwar Randi"
  texto: "This lady warrior with unquenchable bloodlust serves the forces of darkness."
  texto_pt: "Esta guerreira de sede de sangue insaciável serve às forças das trevas."
- nome: "Water Element"
  texto: "A sea-dwelling spirit that takes away sight by clouding the area in fog."
  texto_pt: "Um espírito que vive no mar e tira a visão de todos cobrindo a área de neblina."
- nome: "Water Girl"
  texto: "A lovely lady who can launch water projectiles that turn into lethal ice spikes before they reach an opponent."
  texto_pt: "Uma moça encantadora que lança projéteis de água que viram espinhos de gelo letais antes de atingir o oponente."
- nome: "Waterdragon Fairy"
  texto: "A water fairy that is said to be able to summon a giant sea serpent."
  texto_pt: "Uma fada da água que, dizem, consegue invocar uma serpente marinha gigante."
- nome: "Weather Control"
  texto: "This creature controls weather and is often the cause of mountain storms."
  texto_pt: "Esta criatura controla o clima e muitas vezes é a causa das tempestades nas montanhas."
- nome: "White Dolphin"
  texto: "A white dolphin with a horn that summons huge tidal waves."
  texto_pt: "Um golfinho branco com um chifre que invoca ondas gigantes."
- nome: "Wicked Dragon with the Ersatz Head"
  texto: "A two-headed dragon with a pair of jaws that can tear an enemy to shreds."
  texto_pt: "Um dragão de duas cabeças com um par de mandíbulas capaz de despedaçar um inimigo."
- nome: "Wilmee"
  texto: "A rabid rabbit that shears through opposition with its sharp skewers."
  texto_pt: "Um coelho raivoso que atravessa a oposição com seus espetos afiados."
- nome: "Wing Eagle"
  texto: "This flying creature never misses its intended target."
  texto_pt: "Esta criatura voadora nunca erra o alvo."
- nome: "Wing Egg Elf"
  texto: "This fairy in an eggshell uses massive wings to blow back almost any projectile attack."
  texto_pt: "Esta fada dentro de uma casca de ovo usa asas enormes para repelir quase qualquer ataque de projéteis."
- nome: "Winged Dragon, Guardian of the Fortress 2"
  texto: "This monster's wings are capable of generating tornadoes."
  texto_pt: "As asas deste monstro são capazes de gerar tornados."
- nome: "Winged Egg of New Life"
  texto: "It is said to signal that life is growing in a woman's womb."
  texto_pt: "Dizem que é um sinal de que uma vida está crescendo no ventre de uma mulher."
- nome: "Wolf Axwielder"
  texto: "Once it has started battle, this monster attacks fiercely and cannot stop."
  texto_pt: "Depois que a batalha começa, este monstro ataca com ferocidade e não consegue parar."
- nome: "Wood Clown"
  texto: "A creature with a wicked smile and a lethal sickle."
  texto_pt: "Uma criatura de sorriso malvado e foice letal."
- nome: "Wood Remains"
  texto: "A living corpse of wood re-animated by the power of darkness."
  texto_pt: "Um cadáver vivo de madeira, reanimado pelo poder das trevas."
- nome: "Wow Warrior"
  texto: "A fish with arms, legs, and some very sharp teeth."
  texto_pt: "Um peixe com braços, pernas e dentes muito afiados."
- nome: "Wretched Ghost of the Attic"
  texto: "A harmless monster found lurking in just about any attic."
  texto_pt: "Um monstro inofensivo que fica à espreita em praticamente qualquer sótão."
- nome: "Yamadron"
  texto: "This monster has three fire-breathing heads and can form a sea of blazing flames."
  texto_pt: "Este monstro tem três cabeças que cospem fogo e consegue formar um mar de chamas ardentes."
- nome: "Yaranzo"
  texto: "A treasure box containing a monster that attacks any unwary bandit."
  texto_pt: "Um baú de tesouro com um monstro dentro, que ataca qualquer bandido desavisado."
- nome: "Yashinoki"
  texto: "An intelligent palm tree that drops a hail of rock-hard coconuts on its enemies."
  texto_pt: "Uma palmeira inteligente que despeja uma chuva de cocos duros como pedra sobre os inimigos."
- nome: "Yormungarde"
  texto: "An extremely long snake that dwells in the world of myth."
  texto_pt: "Uma cobra extremamente longa que habita o mundo dos mitos."
- nome: "Zarigun"
  texto: "A lethal crawfish with extremely dangerous claws."
  texto_pt: "Um lagostim letal com pinças extremamente perigosas."
- nome: "Fushioh Richie"
  texto: "This card cannot be Normal Summoned or Set. This card can only be Special Summoned from your hand or your Deck by Tributing 1 \"Great Dezard\" that has fulfilled the condition. You can flip this card into face-down Defense Position once per turn during your Main Phase. As long as this monster remains face-up on the field, negate the activation and effects of all Spell and Trap Cards that target this card and destroy them. When this card is flipped face-up, you can Special Summon 1 Zombie-Type monster from your Graveyard."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card só pode ser Invocado por Invocação-Especial da sua mão ou do seu Deck oferecendo como Tributo 1 \"Great Dezard\" que tenha cumprido a condição. Uma vez por turno, durante a sua Fase Principal, você pode virar este card com a face para baixo em Posição de Defesa. Enquanto este monstro estiver com a face para cima no campo, negue a ativação e os efeitos de todos os Cards de Magia e de Armadilha que escolham este card como alvo e destrua-os. Quando este card for virado com a face para cima, você pode Invocar por Invocação-Especial 1 monstro do Tipo Zumbi do seu Cemitério."
- nome: "Ghoul with an Appetite"
  texto: "A monster with a heavy appetite that has never been satisfied."
  texto_pt: "Um monstro de apetite enorme que nunca foi saciado."
- nome: "Giant Axe Mummy"
  texto: "You can flip this card into face-down Defense Position once per turn during your Main Phase. If the ATK of a monster on your opponent's side of the field that attacks this card in face-down Defense Position is lower than the DEF of this monster, the attacking monster is destroyed."
  texto_pt: "Uma vez por turno, durante a sua Fase Principal, você pode virar este card com a face para baixo em Posição de Defesa. Se o ATK de um monstro do lado do campo do seu oponente que atacar este card em Posição de Defesa com a face para baixo for menor que a DEF deste monstro, o monstro atacante é destruído."
- nome: "Great Dezard"
  texto: "When this monster destroys the following number of monsters as a result of battle, the following effects are activated in order:\nOne: As long as this card remains face-up on the field, negate the activation and effects of all Spell and Trap Cards that target this card and destroy them.\nTwo: You can Special Summon 1 \"Fushioh Richie\" from your hand or your Deck by Tributing this card during your Main Phase."
  texto_pt: "Quando este monstro destruir em batalha a quantidade de monstros indicada abaixo, os efeitos a seguir são ativados em ordem:\nUm: enquanto este card estiver com a face para cima no campo, negue a ativação e os efeitos de todos os Cards de Magia e de Armadilha que escolham este card como alvo e destrua-os.\nDois: durante a sua Fase Principal, você pode oferecer este card como Tributo para Invocar por Invocação-Especial 1 \"Fushioh Richie\" da sua mão ou do seu Deck."
- nome: "Malice Ascendant"
  texto: "During your opponent's Standby Phase, send 1 card from the top of their Deck to the Graveyard for each \"Malice Ascendant\" in your Graveyard."
  texto_pt: "Durante a Fase de Apoio do seu oponente, envie para o Cemitério 1 card do topo do Deck dele para cada \"Malice Ascendant\" no seu Cemitério."
- nome: "Royal Keeper"
  texto: "Once per turn, you can flip this card into face-down Defense Position. When this card is flipped face-up, it gains 300 ATK and DEF until the end of the turn. (If attacked, this effect resolves after damage calculation.)"
  texto_pt: "Uma vez por turno, você pode virar este card com a face para baixo em Posição de Defesa. Quando este card for virado com a face para cima, ele ganha 300 de ATK e DEF até o fim do turno. (Se for atacado, este efeito é resolvido depois do cálculo de dano.)"
- nome: "Wandering Mummy"
  texto: "You can flip this card into face-down Defense Position once per turn during your Main Phase. After you use this effect, rearrange the face-down Defense Position monsters in your Main Monster Zones, then return them in face-down Defense Position."
  texto_pt: "Uma vez por turno, durante a sua Fase Principal, você pode virar este card com a face para baixo em Posição de Defesa. Depois de usar este efeito, reorganize os monstros em Posição de Defesa com a face para baixo nas suas Zonas de Monstros Principais e, depois, devolva-os em Posição de Defesa com a face para baixo."
- nome: "Zombie Mammoth"
  texto: "Destroy this card if you do not have a Zombie-Type monster in your Graveyard. When this face-up card is destroyed, inflict damage to its controller equal to its original ATK."
  texto_pt: "Destrua este card se você não tiver um monstro do Tipo Zumbi no seu Cemitério. Quando este card com a face para cima for destruído, cause ao controlador dele dano igual ao ATK original deste card."
- nome: "Destiny HERO - Disk Commander"
  texto: "When this card is Special Summoned from the Graveyard, draw 2 cards."
  texto_pt: "Quando este card for Invocado por Invocação-Especial do Cemitério, compre 2 cards."
- nome: "Ultimate Tyranno"
  texto: "If this card is in Attack Position at the beginning of your Battle Phase, first, you can and must attack all monsters on your opponent's side of the field once each with this card."
  texto_pt: "Se este card estiver em Posição de Ataque no início da sua Fase de Batalha, antes de tudo, você pode e deve atacar uma vez cada monstro no lado do campo do seu oponente com este card."
- nome: "\"A\" Cell Breeding Device"
  texto: "During each of your Standby Phases, put 1 A-Counter on 1 face-up monster your opponent controls."
  texto_pt: "Durante cada uma das suas Fases de Apoio, coloque 1 Marcador A em 1 monstro com a face para cima que seu oponente controla."
- nome: "Gilasaurus"
  texto: "You can Special Summon this card from your hand. If you do this, your opponent can Special Summon 1 monster from their Graveyard."
  texto_pt: "Você pode Invocar este card da sua mão por Invocação-Especial. Se fizer isso, seu oponente pode Invocar por Invocação-Especial 1 monstro do Cemitério dele."
- nome: "Mass Hypnosis"
  texto: "Activate only while you control an \"Alien\" monster. Select and take control of up to 3 of your opponent's monsters that each have an A-Counter(s) on them. This card is destroyed during the End Phase of the turn it is activated."
  texto_pt: "Ative somente enquanto você controlar um monstro \"Alien\". Escolha até 3 monstros do seu oponente que tenham um ou mais Marcadores A e assuma o controle deles. Este card é destruído durante a Fase Final do turno em que for ativado."
- nome: "Otherworld - The \"A\" Zone"
  texto: "If your opponent's monster battles an \"Alien\" monster you control, the opponent's monster loses 300 ATK and DEF during damage calculation only."
  texto_pt: "Se um monstro do seu oponente batalhar com um monstro \"Alien\" que você controla, o monstro do oponente perde 300 de ATK e DEF, somente durante o cálculo de dano."
- nome: "\"A\" Cell Scatter Burst"
  texto: "Select 1 face-up \"Alien\" monster you control. Destroy it and distribute new A-Counters equal to its Level among your opponent's face-up monsters."
  texto_pt: "Escolha 1 monstro \"Alien\" com a face para cima que você controla. Destrua-o e distribua entre os monstros com a face para cima do seu oponente novos Marcadores A em quantidade igual ao Nível dele."
- nome: "Brainwashing Beam"
  texto: "Select 1 monster with at least 1 A-Counter on your opponent's side of the field and take control of that monster. During each of your End Phases, remove 1 A-Counter from that controlled monster. If all A-Counters are removed from that monster, or that monster is destroyed, destroy this card."
  texto_pt: "Escolha 1 monstro com pelo menos 1 Marcador A no lado do campo do seu oponente e assuma o controle desse monstro. Durante cada uma das suas Fases Finais, remova 1 Marcador A do monstro controlado. Se todos os Marcadores A forem removidos desse monstro, ou se esse monstro for destruído, destrua este card."
- nome: "D - Shield"
  texto: "When an Attack Position \"Destiny HERO\" monster you control is targeted for an attack: Target it; change it to Defense Position and equip it with this card. The equipped monster cannot be destroyed by battle."
  texto_pt: "Quando um monstro \"HERÓI do Destino\" em Posição de Ataque que você controla for escolhido como alvo de um ataque: escolha-o como alvo; mude-o para Posição de Defesa e equipe-o com este card. O monstro equipado não pode ser destruído em batalha."
- nome: "Destiny HERO - Captain Tenacious"
  texto: "Once per turn, during your Standby Phase: You can target 1 \"Destiny HERO\" monster in your Graveyard that was destroyed by battle since your last Standby Phase, if you controlled this face-up card when the target was destroyed; Special Summon that target."
  texto_pt: "Uma vez por turno, durante a sua Fase de Apoio: você pode escolher 1 monstro \"HERÓI do Destino\" no seu Cemitério que tenha sido destruído em batalha desde a sua última Fase de Apoio, se você controlava este card com a face para cima quando o alvo foi destruído; Invoque o alvo por Invocação-Especial."
- nome: "Destiny HERO - Double Dude"
  texto: "Cannot be Special Summoned. This card can attack twice during each Battle Phase. During your Standby Phase, if this card was destroyed since your last Standby Phase: You can Special Summon 2 \"Double Dude Tokens\" (Warrior-Type/DARK/Level 4/ATK 1000/DEF 1000). This card must be in your Graveyard to activate and to resolve this effect."
  texto_pt: "Não pode ser Invocado por Invocação-Especial. Este card pode atacar duas vezes durante cada Fase de Batalha. Durante a sua Fase de Apoio, se este card foi destruído desde a sua última Fase de Apoio: você pode Invocar por Invocação-Especial 2 \"Fichas de Double Dude\" (Guerreiro/TREVAS/Nível 4/ATK 1000/DEF 1000). Este card deve estar no seu Cemitério para ativar e resolver este efeito."
- nome: "Cobraman Sakuzy"
  texto: "You can flip this card into face-down Defense Position once per turn during your Main Phase. When this card is flipped face-up, look at all Set Spell and Trap Cards on your opponent's side of the field and then return them to their original position."
  texto_pt: "Uma vez por turno, durante a sua Fase Principal, você pode virar este card com a face para baixo em Posição de Defesa. Quando este card for virado com a face para cima, olhe todos os Cards de Magia e de Armadilha Baixados no lado do campo do seu oponente e, depois, devolva-os à posição original."
- nome: "Corruption Cell \"A\""
  texto: "Place 1 A-Counter on 1 face-up monster on your opponent's side of the field."
  texto_pt: "Coloque 1 Marcador A em 1 monstro com a face para cima no lado do campo do seu oponente."
- nome: "Crop Circles"
  texto: "Send any number of monsters from your side of the field to the Graveyard to activate this card. Select from your Deck 1 \"Alien\" monster whose Level is equal to the total Levels of the sent monsters, and Special Summon it. If you fail to find a monster to Special Summon, you take 2000 damage."
  texto_pt: "Envie qualquer número de monstros do seu lado do campo para o Cemitério para ativar este card. Escolha do seu Deck 1 monstro \"Alien\" cujo Nível seja igual à soma dos Níveis dos monstros enviados e Invoque-o por Invocação-Especial. Se você não encontrar um monstro para Invocar por Invocação-Especial, você sofre 2000 de dano."
- nome: "Cyclone Blade"
  texto: "Equip only to a \"Destiny HERO\" monster. At the end of the Damage Step, if the equipped monster attacked: Target 1 Spell/Trap Card on the field; destroy that target."
  texto_pt: "Equipe somente a um monstro \"HERÓI do Destino\". No fim da Etapa de Dano, se o monstro equipado atacou: escolha 1 Card de Magia/Armadilha no campo; destrua o alvo."
- nome: "D - Formation"
  texto: "Each time a face-up \"Destiny HERO\" monster(s) you control is destroyed, place 1 D Counter on this card for each of those monsters. When you Normal or Special Summon a monster during your Main Phase: You can send this card with 2 or more D Counters to the Graveyard; add up to 2 cards from your Deck and/or Graveyard to your hand, with the same name as that monster."
  texto_pt: "Sempre que um ou mais monstros \"HERÓI do Destino\" com a face para cima que você controla forem destruídos, coloque 1 Marcador D neste card para cada um desses monstros. Quando você Invocar um monstro por Invocação-Normal ou por Invocação-Especial durante a sua Fase Principal: você pode enviar para o Cemitério este card com 2 ou mais Marcadores D; adicione à sua mão, do seu Deck e/ou do seu Cemitério, até 2 cards com o mesmo nome desse monstro."
- nome: "D - Fortune"
  texto: "When your opponent declares a direct attack: Banish 1 \"Destiny HERO\" monster from your Graveyard; end the Battle Phase."
  texto_pt: "Quando seu oponente declarar um ataque direto: bana 1 monstro \"HERÓI do Destino\" do seu Cemitério; encerre a Fase de Batalha."
- nome: "Destiny HERO - Departed"
  texto: "During your Standby Phase, if this card is in your Graveyard: Special Summon it in face-up Attack Position to your opponent's side of the field. If this card is destroyed by battle, banish it instead of sending it to the Graveyard. If a card effect would send this card to the Graveyard from the hand or Deck, banish it instead."
  texto_pt: "Durante a sua Fase de Apoio, se este card estiver no seu Cemitério: Invoque-o por Invocação-Especial com a face para cima em Posição de Ataque no lado do campo do seu oponente. Se este card for destruído em batalha, bana-o em vez de enviá-lo para o Cemitério. Se o efeito de um card fosse enviar este card da mão ou do Deck para o Cemitério, em vez disso, bana-o."
- nome: "Destiny HERO - Dunker"
  texto: "You can send 1 \"Destiny HERO\" card from your hand to the Graveyard; inflict 500 damage to your opponent."
  texto_pt: "Você pode enviar 1 card \"HERÓI do Destino\" da sua mão para o Cemitério; cause 500 de dano ao seu oponente."
- nome: "Destiny Mirage"
  texto: "When a \"Destiny HERO\" monster you control is destroyed and sent to the Graveyard by an opponent's card effect: Special Summon, to your side of the field, all \"Destiny HERO\" monsters that were destroyed and sent to either Graveyard this turn."
  texto_pt: "Quando um monstro \"HERÓI do Destino\" que você controla for destruído e enviado para o Cemitério pelo efeito de um card do oponente: Invoque por Invocação-Especial, no seu lado do campo, todos os monstros \"HERÓI do Destino\" que foram destruídos e enviados para qualquer Cemitério neste turno."
- nome: "Destruction of Destiny"
  texto: "Send 3 cards from the top of your Deck to the Graveyard, and take 1000 damage for each Spell or Trap Card sent to the Graveyard this way."
  texto_pt: "Envie os 3 cards do topo do seu Deck para o Cemitério e sofra 1000 de dano para cada Card de Magia ou de Armadilha enviado para o Cemitério dessa forma."
- nome: "Elemental HERO Phoenix Enforcer"
  texto: "\"Elemental HERO Avian\" + \"Elemental HERO Burstinatrix\"\nMust be Fusion Summoned and cannot be Special Summoned by other ways. This card cannot be destroyed by battle."
  texto_pt: "\"Aviário, o HERÓI do Elemento\" + \"Burstinatrix, o HERÓI do Elemento\"\nDeve ser Invocado por Invocação-Fusão e não pode ser Invocado por Invocação-Especial de outras formas. Este card não pode ser destruído em batalha."
- nome: "Elemental HERO Shining Phoenix Enforcer"
  texto: "\"Elemental HERO Phoenix Enforcer\" + \"Elemental HERO Sparkman\"\nMust be Fusion Summoned and cannot be Special Summoned by other ways. This card gains 300 ATK for each \"Elemental HERO\" card in your Graveyard. This card cannot be destroyed by battle."
  texto_pt: "\"Elemental HERO Phoenix Enforcer\" + \"Sparkman, o HERÓI do Elemento\"\nDeve ser Invocado por Invocação-Fusão e não pode ser Invocado por Invocação-Especial de outras formas. Este card ganha 300 de ATK para cada card \"HERÓI do Elemento\" no seu Cemitério. Este card não pode ser destruído em batalha."
- nome: "Flying Saucer Muusik'i"
  texto: "While this card is face-up on the field, you can select and add 1 \"Alien\" card from your Deck to your hand instead of conducting your normal draw during your Draw Phase."
  texto_pt: "Enquanto este card estiver com a face para cima no campo, durante a sua Fase de Compra, você pode escolher 1 card \"Alien\" do seu Deck e adicioná-lo à sua mão em vez de fazer a compra normal."
- nome: "Orbital Bombardment"
  texto: "Send 1 \"Alien\" monster from your side of the field to the Graveyard to activate this card. Destroy 1 Spell or Trap Card on the field."
  texto_pt: "Envie 1 monstro \"Alien\" do seu lado do campo para o Cemitério para ativar este card. Destrua 1 Card de Magia ou de Armadilha no campo."
- nome: "Volcanic Wall"
  texto: "Once per turn, you can send 3 cards from the top of your Deck to the Graveyard. For each Pyro-Type monster sent to the Graveyard by this effect, inflict 500 points of damage to your opponent. Your monsters cannot attack during this turn."
  texto_pt: "Uma vez por turno, você pode enviar os 3 cards do topo do seu Deck para o Cemitério. Para cada monstro do Tipo Piro enviado para o Cemitério por este efeito, cause 500 de dano ao seu oponente. Seus monstros não podem atacar neste turno."
- nome: "Snake Deity's Command"
  texto: "Activate by showing your opponent 1 \"Venom\" monster in your hand. Negate the activation and effect of an opponent's Spell Card, and destroy it."
  texto_pt: "Ative mostrando ao seu oponente 1 monstro \"Venom\" na sua mão. Negue a ativação e o efeito de um Card de Magia do oponente e destrua-o."
- nome: "Crystal Slicer"
  texto: "Send 1 \"Crystal Beast\" monster from your hand to the Graveyard. The original ATK of 1 face-up monster on your opponent's field is reduced by half. Your opponent draws 1 card."
  texto_pt: "Envie 1 monstro \"Fera Cristalina\" da sua mão para o Cemitério. O ATK original de 1 monstro com a face para cima no campo do seu oponente é reduzido à metade. Seu oponente compra 1 card."
- nome: "Flame Wall"
  texto: "As long as there is a Pyro-Type monster in your Graveyard, any damage you would receive from the effects of your opponent's cards becomes 0."
  texto_pt: "Enquanto houver um monstro do Tipo Piro no seu Cemitério, qualquer dano que você sofreria pelos efeitos dos cards do seu oponente passa a ser 0."
- nome: "Venom Swamp"
  texto: "During each player's End Phase: Place 1 Venom Counter on each face-up monster, except \"Venom\" monsters. Monsters lose 500 ATK for each Venom Counter on them. Destroy a monster if its ATK becomes 0 by this effect."
  texto_pt: "Durante a Fase Final de cada duelista: coloque 1 Marcador de Veneno em cada monstro com a face para cima, exceto monstros \"Venom\". Os monstros perdem 500 de ATK para cada Marcador de Veneno neles. Destrua um monstro se o ATK dele chegar a 0 por este efeito."
- nome: "Volcanic Slicer"
  texto: "Once per turn, you can inflict 500 damage to your opponent. If you activate this effect, this card cannot attack during this turn."
  texto_pt: "Uma vez por turno, você pode causar 500 de dano ao seu oponente. Se você ativar este efeito, este card não pode atacar neste turno."
- nome: "Ambush Fangs"
  texto: "Activate only when a face-up \"Venom\" monster you control is declared as an attack target. Negate the attack and end the Battle Phase. Then place 1 Venom Counter on the monster that attacked."
  texto_pt: "Ative somente quando um monstro \"Venom\" com a face para cima que você controla for declarado como alvo de um ataque. Negue o ataque e encerre a Fase de Batalha. Depois, coloque 1 Marcador de Veneno no monstro que atacou."
- nome: "Cloudian - Poison Cloud"
  texto: "When this card is destroyed by battle and sent to the Graveyard, if it was face-up at the start of the Damage Step: Destroy the monster that destroyed it, and if you do, inflict 800 damage to your opponent."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, se ele estava com a face para cima no início da Etapa de Dano: destrua o monstro que o destruiu e, se fizer isso, cause 800 de dano ao seu oponente."
- nome: "Last Resort"
  texto: "Activate only when your opponent's monster declares an attack. You can select 1 \"Ancient City - Rainbow Ruins\" from your Deck and activate it. If your opponent had an active Field Spell Card when this card was activated, they can draw 1 card."
  texto_pt: "Ative somente quando um monstro do seu oponente declarar um ataque. Você pode escolher 1 \"Cidade Antiga - Ruínas Arco-Íris\" do seu Deck e ativá-lo. Se seu oponente tinha um Card de Magia de Campo ativo quando este card foi ativado, ele pode comprar 1 card."
- nome: "Lucky Cloud"
  texto: "During the End Phase, if you Summoned 2 or more \"Cloudian\" monsters with the same name this turn, draw 2 cards."
  texto_pt: "Durante a Fase Final, se você Invocou neste turno 2 ou mais monstros \"Nuviano\" com o mesmo nome, compre 2 cards."
- nome: "Natural Disaster"
  texto: "Inflict 500 damage to your opponent each time a card(s) they control is destroyed and sent to the Graveyard by the effect of a \"Cloudian\" monster."
  texto_pt: "Cause 500 de dano ao seu oponente sempre que um ou mais cards que ele controla forem destruídos e enviados para o Cemitério pelo efeito de um monstro \"Nuviano\"."
- nome: "Rainbow Veil"
  texto: "If the equipped monster battles an opponent's monster, while that monster is on the field its effect(s) is negated during the Battle Phase only."
  texto_pt: "Se o monstro equipado batalhar com um monstro do oponente, enquanto esse monstro estiver no campo, os efeitos dele são negados, somente durante a Fase de Batalha."
- nome: "Release from Stone"
  texto: "Target 1 of your banished Rock monsters; Special Summon it. When this card leaves the field, destroy that monster. When that monster is destroyed, destroy this card."
  texto_pt: "Escolha 1 dos seus monstros Rocha banidos; Invoque-o por Invocação-Especial. Quando este card sair do campo, destrua esse monstro. Quando esse monstro for destruído, destrua este card."
- nome: "Snake Whistle"
  texto: "Activate only when a Reptile-Type monster you control is destroyed. Special Summon 1 Level 4 or lower Reptile-Type monster from your Deck."
  texto_pt: "Ative somente quando um monstro do Tipo Réptil que você controla for destruído. Invoque por Invocação-Especial 1 monstro do Tipo Réptil de Nível 4 ou menos do seu Deck."
- nome: "Soul of Fire"
  texto: "Your opponent draws 1 card. Select 1 Pyro-Type monster from your Deck and remove it from play. Inflict damage to your opponent equal to half the ATK of the removed monster. If you activate this card, you cannot declare an attack this turn."
  texto_pt: "Seu oponente compra 1 card. Escolha 1 monstro do Tipo Piro do seu Deck e bana-o. Cause ao seu oponente dano igual à metade do ATK do monstro banido. Se você ativar este card, não pode declarar ataques neste turno."
- nome: "Triggered Summon"
  texto: "Activate only when a monster is Special Summoned to your opponent's side of the field. Each player can Special Summon 1 Level 4 or lower monster from their hand."
  texto_pt: "Ative somente quando um monstro for Invocado por Invocação-Especial no lado do campo do seu oponente. Cada duelista pode Invocar por Invocação-Especial 1 monstro de Nível 4 ou menos da própria mão."
- nome: "Venom Boa"
  texto: "Once per turn, you can place 2 Venom Counters on 1 monster your opponent controls. If you activate this effect, this card cannot attack during this turn."
  texto_pt: "Uma vez por turno, você pode colocar 2 Marcadores de Veneno em 1 monstro que seu oponente controla. Se você ativar este efeito, este card não pode atacar neste turno."
- nome: "Venom Burn"
  texto: "Select 1 monster with a Venom Counter(s). Remove all Venom Counters from that card, and inflict 700 damage to your opponent for each Venom Counter removed."
  texto_pt: "Escolha 1 monstro com um ou mais Marcadores de Veneno. Remova todos os Marcadores de Veneno desse card e cause 700 de dano ao seu oponente para cada Marcador de Veneno removido."
- nome: "Venom Cobra"
  texto: "Hard scales cover all parts of this gigantic cobra. It hunts by shooting out massive amounts of venom, but because of its large size, its attack pattern is easily predicted."
  texto_pt: "Escamas duras cobrem cada parte desta naja gigantesca. Ela caça disparando enormes quantidades de veneno, mas, por causa do seu tamanho, é fácil prever o padrão dos seus ataques."
- nome: "Venom Serpent"
  texto: "Once per turn, you can place 1 Venom Counter on 1 monster your opponent controls."
  texto_pt: "Uma vez por turno, você pode colocar 1 Marcador de Veneno em 1 monstro que seu oponente controla."
- nome: "Venom Shot"
  texto: "Activate only while you control a face-up \"Venom\" monster, \"Vennominaga the Deity of Poisonous Snakes\", or \"Vennominon the King of Poisonous Snakes\". Send 1 Reptile-Type monster from your Deck to the Graveyard and place 2 Venom Counters on 1 face-up monster your opponent controls."
  texto_pt: "Ative somente enquanto você controlar um monstro \"Venom\", \"Vennominaga, a Divindade das Serpentes Venenosas\" ou \"Vennominon, o Rei das Serpentes Venenosas\" com a face para cima. Envie 1 monstro do Tipo Réptil do seu Deck para o Cemitério e coloque 2 Marcadores de Veneno em 1 monstro com a face para cima que seu oponente controla."
- nome: "Venom Snake"
  texto: "Once per turn, you can place 1 Venom Counter on 1 monster your opponent controls. If you activate this effect, this card cannot attack during this turn."
  texto_pt: "Uma vez por turno, você pode colocar 1 Marcador de Veneno em 1 monstro que seu oponente controla. Se você ativar este efeito, este card não pode atacar neste turno."
- nome: "Volcanic Recharge"
  texto: "Return up to 3 \"Volcanic\" Monster Cards from your Graveyard to your Deck."
  texto_pt: "Devolva até 3 Cards de Monstro \"Vulcânico(a)\" do seu Cemitério para o seu Deck."
- nome: "Necrovalley"
  texto: "Negate the effects of Spell, Trap, and Monster Cards that affect a card(s) in the Graveyard. Neither player can remove from play cards in the Graveyard. All \"Gravekeeper's\" monsters gain 500 ATK and DEF."
  texto_pt: "Negue os efeitos dos Cards de Magia, de Armadilha e de Monstro que afetem um ou mais cards no Cemitério. Nenhum duelista pode banir cards do Cemitério. Todos os monstros \"do Coveiro\" ganham 500 de ATK e DEF."
- nome: "Gravekeeper's Commandant"
  texto: "You can discard this card to the GY; add 1 \"Necrovalley\" from your Deck to your hand."
  texto_pt: "Você pode descartar este card para o Cemitério; adicione 1 \"Necro-Vale\" do seu Deck à sua mão."
- nome: "Dark Archetype"
  texto: "When this card is destroyed in battle and sent to the Graveyard, you can Special Summon 1 monster from your Deck with an ATK less than the Battle Damage you received."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, você pode Invocar por Invocação-Especial 1 monstro do seu Deck com ATK menor que o dano de batalha que você sofreu."
- nome: "Dark Psycho Eye"
  texto: "When this card is destroyed, you gain control of 1 face-up monster on your opponent's Field until the End Phase."
  texto_pt: "Quando este card for destruído, você assume o controle de 1 monstro com a face para cima no campo do seu oponente até a Fase Final."
- nome: "Toy Magician"
  texto: "You can Set this card from your hand to your Spell & Trap Zone as a Spell. During the End Phase, if this Set card in your Spell & Trap Zone was destroyed by an opponent's card effect and sent to the GY this turn: Special Summon this card. If this card is Flip Summoned: Destroy Spells and Traps on the field, equal to the number of \"Toy Magicians\" on the field."
  texto_pt: "Você pode Baixar este card da sua mão na sua Zona de Magias e Armadilhas como uma Magia. Durante a Fase Final, se este card Baixado na sua Zona de Magias e Armadilhas foi destruído pelo efeito de um card do oponente e enviado para o Cemitério neste turno: Invoque este card por Invocação-Especial. Se este card for Invocado por Invocação-Virar: destrua Magias e Armadilhas no campo em quantidade igual ao número de \"Toy Magician\" no campo."
- nome: "Card Ejector"
  texto: "Once per turn: You can target 1 card in your opponent's Graveyard; banish that target."
  texto_pt: "Uma vez por turno: você pode escolher 1 card no Cemitério do seu oponente; bana o alvo."
- nome: "Dark-Eyes Illusionist"
  texto: "FLIP: Target 1 monster on the field; it cannot attack while this card is face-up on the field."
  texto_pt: "VIRE: escolha 1 monstro no campo; ele não pode atacar enquanto este card estiver com a face para cima no campo."
- nome: "Gambler of Legend"
  texto: "Once per turn, you can toss a coin 3 times and apply the appropriate effect: ● 3 Heads: Destroy all monsters your opponent controls. ● 2 Heads: Discard 1 random card from your opponent's hand. ● 1 Head: Destroy 1 card you control. ● 3 Tails: Discard your entire hand."
  texto_pt: "Uma vez por turno, você pode jogar uma moeda 3 vezes e aplicar o efeito correspondente:\n● 3 Caras: destrua todos os monstros que seu oponente controla.\n● 2 Caras: descarte 1 card aleatório da mão do seu oponente.\n● 1 Cara: destrua 1 card que você controla.\n● 3 Coroas: descarte a sua mão inteira."
- nome: "Miracle Flipper"
  texto: "If you control a \"Miracle Flipper\", you cannot Summon this card. Your opponent cannot select another face-up monster as an attack target. If this card is destroyed by battle, Special Summon it to your opponent's side of the field at the end of the Battle Phase. If this card is destroyed by the effect of a Spell or Trap Card, destroy 1 monster your opponent controls."
  texto_pt: "Se você controlar um \"Miracle Flipper\", você não pode Invocar este card. Seu oponente não pode escolher outro monstro com a face para cima como alvo de ataque. Se este card for destruído em batalha, Invoque-o por Invocação-Especial no lado do campo do seu oponente no fim da Fase de Batalha. Se este card for destruído pelo efeito de um Card de Magia ou de Armadilha, destrua 1 monstro que seu oponente controla."
- nome: "Mutant Mindmaster"
  texto: "When this card declares an attack, you can take control of 1 face-up Attack Position monster your opponent controls, and attack with it instead of this monster. It cannot attack your opponent directly. Return it to your opponent at the end of the Battle Phase."
  texto_pt: "Quando este card declarar um ataque, você pode assumir o controle de 1 monstro em Posição de Ataque com a face para cima que seu oponente controla e atacar com ele no lugar deste monstro. Ele não pode atacar o seu oponente diretamente. Devolva-o ao seu oponente no fim da Fase de Batalha."
- nome: "Shadowpriestess of Ohm"
  texto: "You can Tribute 1 face-up DARK monster you control to inflict 800 damage to your opponent."
  texto_pt: "Você pode oferecer como Tributo 1 monstro de TREVAS com a face para cima que você controla para causar 800 de dano ao seu oponente."
- nome: "Witch Doctor of Sparta"
  texto: "Inflict 500 damage to your opponent each time a monster(s) is Special Summoned from either player's Deck."
  texto_pt: "Cause 500 de dano ao seu oponente sempre que um ou mais monstros forem Invocados por Invocação-Especial do Deck de qualquer duelista."
- nome: "Gaia Plate the Earth Giant"
  texto: "Once per turn, during your Standby Phase, banish 1 Rock monster from your GY or send this card to the GY. You can Special Summon this card (from your hand) by banishing 2 Rock monsters from your GY. If this card battles an opponent's monster, that monster's ATK/DEF become halved during damage calculation only."
  texto_pt: "Uma vez por turno, durante a sua Fase de Apoio, bana 1 monstro Rocha do seu Cemitério ou envie este card para o Cemitério. Você pode Invocar este card por Invocação-Especial (da sua mão) banindo 2 monstros Rocha do seu Cemitério. Se este card batalhar com um monstro do oponente, o ATK/DEF desse monstro é reduzido à metade, somente durante o cálculo de dano."
- nome: "Canyon"
  texto: "If a Rock-Type monster in Defense Position is attacked, double any Battle Damage to the controller of the attacking monster."
  texto_pt: "Se um monstro do Tipo Rocha em Posição de Defesa for atacado, dobre qualquer dano de batalha ao controlador do monstro atacante."
- nome: "Exxod, Master of The Guard"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except by Tributing 1 \"sphinx\" monster. Each time an EARTH monster is Flip Summoned while this card remains face-up on the field, inflict 1000 damage to your opponent."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto oferecendo como Tributo 1 monstro \"sphinx\". Sempre que um monstro de TERRA for Invocado por Invocação-Virar enquanto este card estiver com a face para cima no campo, cause 1000 de dano ao seu oponente."
- nome: "Ancient Jar"
  texto: "A very fragile jar that contains something ancient and dangerous."
  texto_pt: "Um jarro muito frágil que guarda algo antigo e perigoso."
- nome: "Clear Rage Golem"
  texto: "When this card is face-up on the field, do not treat its Attribute as DARK. When this card makes a direct attack and inflicts Battle Damage to your opponent, inflict 300 damage for each card in your opponent's hand."
  texto_pt: "Quando este card estiver com a face para cima no campo, o Atributo dele não é tratado como TREVAS. Quando este card fizer um ataque direto e causar dano de batalha ao seu oponente, cause 300 de dano para cada card na mão do seu oponente."
- nome: "Goggle Golem"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it be treated as an Effect Monster with this effect:\n● The original ATK of this card becomes 2100."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● O ATK original deste card passa a ser 2100."
- nome: "Pot the Trick"
  texto: "A not-so-powerful servant, he is an errand boy of a master sorcerer."
  texto_pt: "Um servo não muito poderoso; é o menino de recados de um grande feiticeiro."
- nome: "Swords of Concealing Light"
  texto: "When you activate this card, change all monsters on your opponent's side of the field to face-down Defense Position. Monsters on your opponent's side of the field cannot change their Battle Positions. Destroy this card during your 2nd Standby Phase after activation."
  texto_pt: "Quando você ativar este card, mude todos os monstros no lado do campo do seu oponente para Posição de Defesa com a face para baixo. Os monstros no lado do campo do seu oponente não podem mudar de posição de batalha. Destrua este card durante a sua 2ª Fase de Apoio depois da ativação."
- nome: "A Feint Plan"
  texto: "Monsters cannot attack face-down monsters this turn."
  texto_pt: "Neste turno, os monstros não podem atacar monstros com a face para baixo."
- nome: "Breath of Light"
  texto: "Destroy all face-up Rock-Type monsters on the field."
  texto_pt: "Destrua todos os monstros do Tipo Rocha com a face para cima no campo."
- nome: "Great Spirit"
  texto: "Once per turn, during your Main Phase, you can flip this card into face-down Defense Position. When this card is Flip Summoned, you can switch the original ATK and DEF of 1 face-up EARTH monster on the field until the end of this turn."
  texto_pt: "Uma vez por turno, durante a sua Fase Principal, você pode virar este card com a face para baixo em Posição de Defesa. Quando este card for Invocado por Invocação-Virar, você pode trocar o ATK e a DEF originais de 1 monstro de TERRA com a face para cima no campo até o fim deste turno."
- nome: "Minomushi Warrior"
  texto: "A rock warrior that wields a heavy blade carved from stone."
  texto_pt: "Um guerreiro de pedra que empunha uma lâmina pesada esculpida em rocha."
- nome: "Anteatereatingant"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except by sending 2 Spell or Trap Cards you control to the Graveyard. You can destroy 1 Spell or Trap Card your opponent controls. If you activate this effect, this card cannot attack during this turn."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto enviando para o Cemitério 2 Cards de Magia ou de Armadilha que você controla. Você pode destruir 1 Card de Magia ou de Armadilha que seu oponente controla. Se você ativar este efeito, este card não pode atacar neste turno."
- nome: "Swarm of Locusts"
  texto: "Once per turn: You can change this card to face-down Defense Position. If this card is Flip Summoned: Target 1 Spell/Trap your opponent controls; destroy that target."
  texto_pt: "Uma vez por turno: você pode mudar este card para Posição de Defesa com a face para baixo. Se este card for Invocado por Invocação-Virar: escolha 1 Magia/Armadilha que seu oponente controla; destrua o alvo."
  substitui: true
- nome: "Swarm of Scarabs"
  texto: "Once per turn: You can change this card to face-down Defense Position. If this card is Flip Summoned: Target 1 monster your opponent controls; destroy that target."
  texto_pt: "Uma vez por turno: você pode mudar este card para Posição de Defesa com a face para baixo. Se este card for Invocado por Invocação-Virar: escolha 1 monstro que seu oponente controla; destrua o alvo."
  substitui: true
- nome: "Grasschopper"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it be treated as an Effect Monster with this effect:\n● This card can attack all monsters your opponent controls once each."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● Este card pode atacar uma vez cada monstro que seu oponente controla."
- nome: "Phantom Cricket"
  texto: "FLIP: Return 1 face-down monster from the field to the top of its owner's Deck."
  texto_pt: "VIRE: devolva 1 monstro com a face para baixo do campo ao topo do Deck do dono."
- nome: "8-Claws Scorpion"
  texto: "Once per turn, you can flip this card into face-down Defense Position. When this card attacks an opponent's face-down Defense Position monster, this card's ATK becomes 2400 during damage calculation only."
  texto_pt: "Uma vez por turno, você pode virar este card com a face para baixo em Posição de Defesa. Quando este card atacar um monstro do oponente em Posição de Defesa com a face para baixo, o ATK deste card passa a ser 2400, somente durante o cálculo de dano."
- nome: "Saber Beetle"
  texto: "During battle between this attacking card and a Defense Position monster whose DEF is lower than the ATK of this card, inflict the difference as Battle Damage to your opponent."
  texto_pt: "Durante a batalha entre este card atacante e um monstro em Posição de Defesa cuja DEF seja menor que o ATK deste card, cause a diferença como dano de batalha ao seu oponente."
- nome: "Cockroach Knight"
  texto: "When this card is sent to the Graveyard, it is returned to the top of the Deck."
  texto_pt: "Quando este card for enviado para o Cemitério, ele volta para o topo do Deck."
- nome: "Giant Flea"
  texto: "A massive flea that feeds on the blood of its enemies."
  texto_pt: "Uma pulga enorme que se alimenta do sangue dos inimigos."
- nome: "Noisy Gnat"
  texto: "You can send this card from your hand to the Graveyard to target 1 face-up monster on the field; increase that target's Level by 1, until the End Phase."
  texto_pt: "Você pode enviar este card da sua mão para o Cemitério para escolher 1 monstro com a face para cima no campo; aumente o Nível do alvo em 1 até a Fase Final."
- nome: "Parasitic Ticky"
  texto: "The ATK and DEF of this card are each equal to the number of tokens on the field x 500."
  texto_pt: "O ATK e a DEF deste card são, cada um, iguais ao número de Fichas no campo x 500."
- nome: "Silent Strider"
  texto: "You can send this card from your hand to the Graveyard to reduce the Level of 1 monster on the field by 1, until the End Phase."
  texto_pt: "Você pode enviar este card da sua mão para o Cemitério para reduzir em 1 o Nível de 1 monstro no campo até a Fase Final."
- nome: "White-Horned Dragon"
  texto: "When this card is Normal or Special Summoned: Target up to 5 Spell Cards in your opponent's Graveyard; banish those target(s), and if you do, this card gains 300 ATK for each card banished by this effect."
  texto_pt: "Quando este card for Invocado por Invocação-Normal ou por Invocação-Especial: escolha até 5 Cards de Magia no Cemitério do seu oponente; bana os alvos e, se fizer isso, este card ganha 300 de ATK para cada card banido por este efeito."
- nome: "Clear Vice Dragon"
  texto: "While this card is face-up on the field, do not treat its Attribute as DARK. When this card attacks an opponent's monster, this card's ATK is double the ATK of the attacked monster during damage calculation. If this card attacks, change it to Defense Position after the Battle Phase. Additionally, by discarding 1 card from your hand during damage calculation, this card cannot be destroyed by battle."
  texto_pt: "Enquanto este card estiver com a face para cima no campo, o Atributo dele não é tratado como TREVAS. Quando este card atacar um monstro do oponente, o ATK deste card passa a ser o dobro do ATK do monstro atacado durante o cálculo de dano. Se este card atacar, mude-o para Posição de Defesa depois da Fase de Batalha. Além disso, descartando 1 card da sua mão durante o cálculo de dano, este card não pode ser destruído em batalha."
- nome: "Divine Dragon - Excelion"
  texto: "When this card is Normal Summoned, it gets 1 of the following effects for each \"Divine Dragon - Excelion\" in your Graveyard when this effect resolves (your choice). These effects cannot accumulate. ● This card gains 1000 ATK. ● If this card destroys an opponent's monster by battle, it can attack once again in a row. ● When this card destroys a monster by battle and sends it to the Graveyard, inflict damage to your opponent equal to the ATK of the destroyed monster."
  texto_pt: "Quando este card for Invocado por Invocação-Normal, ele recebe 1 dos efeitos a seguir para cada \"Divine Dragon - Excelion\" no seu Cemitério no momento em que este efeito for resolvido (à sua escolha). Estes efeitos não se acumulam.\n● Este card ganha 1000 de ATK.\n● Se este card destruir um monstro do oponente em batalha, ele pode atacar mais uma vez seguida.\n● Quando este card destruir um monstro em batalha e enviá-lo para o Cemitério, cause ao seu oponente dano igual ao ATK do monstro destruído."
- nome: "Handcuffs Dragon"
  texto: "When this card is destroyed by battle with an attacking monster your opponent controls and is sent to the Graveyard, you can equip this card to that monster. The equipped monster loses 1800 ATK. When it is destroyed and this card is sent to the Graveyard, you can Special Summon this card."
  texto_pt: "Quando este card for destruído em batalha com um monstro atacante que seu oponente controla e for enviado para o Cemitério, você pode equipar este card a esse monstro. O monstro equipado perde 1800 de ATK. Quando ele for destruído e este card for enviado para o Cemitério, você pode Invocar este card por Invocação-Especial."
- nome: "Light End Dragon"
  texto: "1 Tuner + 1 or more non-Tuner LIGHT monsters\nAt attack declaration, if this card battles another monster: You can have this card lose 500 ATK and DEF (permanently), and the monster this card is battling loses 1500 ATK and DEF until the End Phase."
  texto_pt: "1 Regulador + 1 ou mais monstros não-Reguladores de LUZ\nNa declaração de ataque, se este card batalhar com outro monstro: você pode fazer este card perder 500 de ATK e DEF (permanentemente), e o monstro com que este card está batalhando perde 1500 de ATK e DEF até a Fase Final."
- nome: "Lancer Dragonute"
  texto: "If this card attacks a Defense Position monster, inflict piercing battle damage to your opponent."
  texto_pt: "Se este card atacar um monstro em Posição de Defesa, cause dano de batalha perfurante ao seu oponente."
- nome: "Rare Metal Dragon"
  texto: "This card cannot be Normal Summoned or Set."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado."
  substitui: true
- nome: "Superalloy Beast Raptinus"
  texto: "1 Gemini Monster + 1 Gemini Monster\nAll Gemini Monsters on the field are treated as Effect Monsters, and gain their effects."
  texto_pt: "1 Monstro Gêmeos + 1 Monstro Gêmeos\nTodos os Monstros Gêmeos no campo são tratados como Monstros de Efeito e ganham os efeitos deles."
- nome: "Darkness Destroyer"
  texto: "Cannot be Special Summoned. This card can attack twice during each Battle Phase. If this card attacks a Defense Position monster, inflict piercing Battle Damage to your opponent."
  texto_pt: "Não pode ser Invocado por Invocação-Especial. Este card pode atacar duas vezes durante cada Fase de Batalha. Se este card atacar um monstro em Posição de Defesa, cause dano de batalha perfurante ao seu oponente."
- nome: "Sky Scourge Norleras"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except by removing from play 1 LIGHT Fairy-Type monster and 3 DARK Fiend-Type monsters in your Graveyard. You can pay 1000 Life Points to send all cards on the field and in both players' hands to the Graveyard, then you draw 1 card."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto banindo 1 monstro do Tipo Fada de LUZ e 3 monstros do Tipo Demônio de TREVAS do seu Cemitério. Você pode pagar 1000 PV para enviar para o Cemitério todos os cards no campo e nas mãos dos dois duelistas; depois, você compra 1 card."
- nome: "Clear Phantom"
  texto: "When this card is face-up on the field, do not treat its Attribute as DARK. When this card in face-up Attack Position is destroyed by battle and sent to the Graveyard, the monster that destroyed it is also destroyed, and the top 3 cards from your opponent's Deck are sent to the Graveyard."
  texto_pt: "Quando este card estiver com a face para cima no campo, o Atributo dele não é tratado como TREVAS. Quando este card em Posição de Ataque com a face para cima for destruído em batalha e enviado para o Cemitério, o monstro que o destruiu também é destruído, e os 3 cards do topo do Deck do seu oponente são enviados para o Cemitério."
- nome: "Dark Hunter"
  texto: "This card's effect changes depending on the number of DARK monsters in your Graveyard. ● 1 or fewer: This card loses 400 ATK. ● 2 to 4: This card gains 400 ATK. ● 5 or more: You can send this card to the Graveyard to destroy all face-down monsters your opponent controls."
  texto_pt: "O efeito deste card muda de acordo com o número de monstros de TREVAS no seu Cemitério.\n● 1 ou menos: este card perde 400 de ATK.\n● De 2 a 4: este card ganha 400 de ATK.\n● 5 ou mais: você pode enviar este card para o Cemitério para destruir todos os monstros com a face para baixo que seu oponente controla."
- nome: "Emperor Sem"
  texto: "Each time you Tribute Summon a monster, each player can select 1 card from their Graveyard and return it to the top of their Deck."
  texto_pt: "Sempre que você Invocar um monstro por Invocação-Tributo, cada duelista pode escolher 1 card do próprio Cemitério e devolvê-lo ao topo do próprio Deck."
- nome: "Grinder Golem"
  texto: "Cannot be Normal Summoned or Set. Must first be Special Summoned (from your hand) to your opponent's side of the field by Special Summoning 2 \"Grinder Tokens\" (Fiend-Type/DARK/Level 1/ATK 0/DEF 0) in face-up Attack Position on your side of the field. If you Special Summon this monster, you cannot Normal Summon or Set a monster during the same turn."
  texto_pt: "Não pode ser Invocado por Invocação-Normal nem Baixado. Deve primeiro ser Invocado por Invocação-Especial (da sua mão) no lado do campo do seu oponente, Invocando por Invocação-Especial 2 \"Fichas de Grinder\" (Demônio/TREVAS/Nível 1/ATK 0/DEF 0) com a face para cima em Posição de Ataque no seu lado do campo. Se você Invocar este monstro por Invocação-Especial, não pode Invocar por Invocação-Normal nem Baixar um monstro no mesmo turno."
- nome: "Infinity Dark"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it be treated as an Effect Monster with this effect:\n● When this card declares an attack, you can change the battle position of 1 face-up monster your opponent controls."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● Quando este card declarar um ataque, você pode mudar a posição de batalha de 1 monstro com a face para cima que seu oponente controla."
- nome: "Metabo Globster"
  texto: "When you Tribute this card for the Tribute Summon of a DARK monster, Special Summon 3 \"Metabo Tokens\" (Fiend-Type/DARK/Level 1/ATK 0/DEF 0) in Defense Position. These tokens cannot be Tributed for a Tribute Summon."
  texto_pt: "Quando você oferecer este card como Tributo para a Invocação-Tributo de um monstro de TREVAS, Invoque por Invocação-Especial 3 \"Fichas de Metabo\" (Demônio/TREVAS/Nível 1/ATK 0/DEF 0) em Posição de Defesa. Estas Fichas não podem ser oferecidas como Tributo para uma Invocação-Tributo."
- nome: "Sinister Sprocket"
  texto: "If this card is sent to the Graveyard for the Synchro Summon of a DARK Synchro Monster, you can destroy 1 face-up Spell or Trap Card."
  texto_pt: "Se este card for enviado para o Cemitério para a Invocação-Sincro de um Monstro Sincro de TREVAS, você pode destruir 1 Card de Magia ou de Armadilha com a face para cima."
- nome: "Skull Knight 2"
  texto: "If you Tribute Summon a Fiend-Type monster by Tributing this monster, Special Summon 1 \"Skull Knight #2\" from your Deck. Then shuffle your Deck."
  texto_pt: "Se você Invocar por Invocação-Tributo um monstro do Tipo Demônio oferecendo este monstro como Tributo, Invoque por Invocação-Especial 1 \"Skull Knight #2\" do seu Deck. Depois, embaralhe o seu Deck."
- nome: "Soul Demolition"
  texto: "If you control a Fiend monster: You can pay 500 LP, then each player targets 1 monster in their opponent's GY; banish those targets."
  texto_pt: "Se você controlar um monstro Demônio: você pode pagar 500 PV; depois, cada duelista escolhe 1 monstro no Cemitério do oponente; bana os alvos."
- nome: "Success Probability 0%"
  texto: "Send 2 random Fusion Monsters from your opponent's Extra Deck to the Graveyard."
  texto_pt: "Envie 2 Monstros de Fusão aleatórios do Deck Adicional do seu oponente para o Cemitério."
- nome: "The Puppet Magic of Dark Ruler"
  texto: "Target 1 Fiend monster in your GY; banish face-up monsters you control whose total Levels exactly equal the Level of that monster, then Special Summon it."
  texto_pt: "Escolha 1 monstro Demônio no seu Cemitério; bana monstros com a face para cima que você controla cuja soma dos Níveis seja exatamente igual ao Nível desse monstro e, depois, Invoque-o por Invocação-Especial."
- nome: "Winged Minion"
  texto: "Tribute this card, then target 1 Fiend monster on the field; it gains 700 ATK/DEF while face-up in the Monster Zone."
  texto_pt: "Ofereça este card como Tributo e, depois, escolha 1 monstro Demônio no campo; ele ganha 700 de ATK/DEF enquanto estiver com a face para cima na Zona de Monstros."
- nome: "Angel O7"
  texto: "If this card is Tribute Summoned, it gains this effect:\n● Neither player can activate monster effects."
  texto_pt: "Se este card for Invocado por Invocação-Tributo, ele ganha este efeito:\n● Nenhum duelista pode ativar efeitos de monstros."
- nome: "Sky Scourge Enrise"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except by removing from play 3 LIGHT Fairy-Type monsters and 1 DARK Fiend monster in your Graveyard. Once per turn, you can remove from play 1 face-up monster on the field. If you activate this effect, this card cannot attack during this turn."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto banindo 3 monstros do Tipo Fada de LUZ e 1 monstro Demônio de TREVAS do seu Cemitério. Uma vez por turno, você pode banir 1 monstro com a face para cima no campo. Se você ativar este efeito, este card não pode atacar neste turno."
- nome: "Sky Scourge Invicil"
  texto: "This card cannot be Special Summoned. If you Tribute Summon this card by Tributing 1 of the following monsters, this card gets the appropriate effect:\n● LIGHT Fairy-Type monster: Negate the effects of all Spell Cards.\n● DARK Fiend-Type monster: Negate the effects of all Trap Cards."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Se você Invocar este card por Invocação-Tributo oferecendo como Tributo 1 dos monstros a seguir, este card recebe o efeito correspondente:\n● Monstro do Tipo Fada de LUZ: negue os efeitos de todos os Cards de Magia.\n● Monstro do Tipo Demônio de TREVAS: negue os efeitos de todos os Cards de Armadilha."
- nome: "Zeta Reticulant"
  texto: "You can Tribute 1 \"Eva Token\" to Special Summon this card from your hand. While this card is in your Graveyard, each time a monster(s) your opponent controls is removed from play, Special Summon 1 \"Eva Token\" (Fiend-Type/DARK/Level 2/ATK 500/DEF 500)."
  texto_pt: "Você pode oferecer como Tributo 1 \"Ficha de Eva\" para Invocar este card da sua mão por Invocação-Especial. Enquanto este card estiver no seu Cemitério, sempre que um ou mais monstros que seu oponente controla forem banidos, Invoque por Invocação-Especial 1 \"Ficha de Eva\" (Demônio/TREVAS/Nível 2/ATK 500/DEF 500)."
- nome: "Darknight Parshath"
  texto: "If this card destroys an opponent's monster by battle: You can banish 1 DARK monster from your Graveyard; draw 1 card. This card gains 100 ATK for each DARK monster in your Graveyard."
  texto_pt: "Se este card destruir um monstro do oponente em batalha: você pode banir 1 monstro de TREVAS do seu Cemitério; compre 1 card. Este card ganha 100 de ATK para cada monstro de TREVAS no seu Cemitério."
- nome: "Dimensional Alchemist"
  texto: "Once per turn: You can activate this effect; banish the top card of your Deck, and if you do, until the end of this turn, this card gains 500 ATK. When this card you control is destroyed and sent to your GY: You can target 1 of your banished monsters; add it to your hand."
  texto_pt: "Uma vez por turno: você pode ativar este efeito; bana o card do topo do seu Deck e, se fizer isso, até o fim deste turno, este card ganha 500 de ATK. Quando este card que você controla for destruído e enviado para o seu Cemitério: você pode escolher 1 dos seus monstros banidos; adicione-o à sua mão."
- nome: "Fairy Guardian"
  texto: "Tribute this face-up card to return 1 Spell Card sent to your Graveyard by your opponent's card effect during this turn to the bottom of your Deck."
  texto_pt: "Ofereça este card com a face para cima como Tributo para devolver ao fundo do seu Deck 1 Card de Magia enviado para o seu Cemitério pelo efeito de um card do seu oponente neste turno."
- nome: "Goddess of Whim"
  texto: "Once per turn: You can toss a coin and call Heads or Tails. If you call it right, double this card's ATK during this turn. If you call it wrong, halve its ATK during this turn."
  texto_pt: "Uma vez por turno: você pode jogar uma moeda e escolher Cara ou Coroa. Se acertar, dobre o ATK deste card durante este turno. Se errar, reduza o ATK dele à metade durante este turno."
- nome: "Hourglass of Courage"
  texto: "If this card is Normal or Flip Summoned, its original ATK and DEF are halved until the End Phase of your next turn. After that, the original ATK and DEF are doubled."
  texto_pt: "Se este card for Invocado por Invocação-Normal ou por Invocação-Virar, o ATK e a DEF originais dele são reduzidos à metade até a Fase Final do seu próximo turno. Depois disso, o ATK e a DEF originais são dobrados."
- nome: "Izanagi"
  texto: "You can Special Summon this card from your hand by removing from play 1 Spirit monster from your hand. Spirit monsters you control do not have to have their effects that return them to the hand activated."
  texto_pt: "Você pode Invocar este card da sua mão por Invocação-Especial banindo 1 monstro Espírito da sua mão. Os monstros Espírito que você controla não precisam ativar os efeitos que os devolvem para a mão."
- nome: "Majestic Mech - Senku"
  texto: "When this card inflicts Battle Damage to your opponent by a direct attack: Draw 1 card. During the End Phase of the turn this card was Summoned: Send it to the Graveyard."
  texto_pt: "Quando este card causar dano de batalha ao seu oponente com um ataque direto: compre 1 card. Durante a Fase Final do turno em que este card foi Invocado: envie-o para o Cemitério."
- nome: "Moisture Creature"
  texto: "You can Tribute 3 monsters to Tribute Summon (but not Set) this card. If Summoned this way: Destroy all Spells and Traps your opponent controls."
  texto_pt: "Você pode oferecer 3 monstros como Tributo para Invocar este card por Invocação-Tributo (mas não Baixá-lo). Se for Invocado dessa forma: destrua todas as Magias e Armadilhas que seu oponente controla."
- nome: "Radiant Jeral"
  texto: "When this card is sent to the Graveyard (except if destroyed by battle), gain 1000 Life Points if \"The Sanctuary in the Sky\" is on the field."
  texto_pt: "Quando este card for enviado para o Cemitério (exceto se destruído em batalha), ganhe 1000 PV se \"O Santuário no Céu\" estiver no campo."
- nome: "Shining Abyss"
  texto: "This monster employs the powers of both Light and Darkness."
  texto_pt: "Este monstro usa os poderes da Luz e das Trevas."
- nome: "Tualatin"
  texto: "If it is your opponent's Battle Phase, a monster you controlled at the start of this Battle Phase was just destroyed, and all monsters you controlled at the start of this Battle Phase (min. 2) have now been destroyed by battle and sent to the GY: You can Special Summon this card from your hand. If Summoned this way: Choose an Attribute, and if you do, destroy all face-up monsters with that Attribute. Your opponent cannot Normal or Special Summon monsters with that Attribute."
  texto_pt: "Se for a Fase de Batalha do seu oponente, um monstro que você controlava no início desta Fase de Batalha tiver acabado de ser destruído, e todos os monstros que você controlava no início desta Fase de Batalha (no mínimo 2) tiverem sido destruídos em batalha e enviados para o Cemitério: você pode Invocar este card da sua mão por Invocação-Especial. Se for Invocado dessa forma: escolha um Atributo e, se fizer isso, destrua todos os monstros com a face para cima desse Atributo. Seu oponente não pode Invocar por Invocação-Normal nem por Invocação-Especial monstros desse Atributo."
- nome: "Watapon"
  texto: "If this card is added from your Deck to your hand by a card effect: You can Special Summon this card."
  texto_pt: "Se este card for adicionado do seu Deck à sua mão pelo efeito de um card: você pode Invocar este card por Invocação-Especial."
- nome: "Winged Kuriboh LV9"
  texto: "Activate only as Chain Link 3 or higher (Quick Effect): You can Special Summon this card from your hand. Spell Cards that have been activated are banished instead of being sent to the GY. The ATK/DEF of this card are each equal to the number of Spells in your opponent's GY x 500. You can only control 1 \"Winged Kuriboh LV9\"."
  texto_pt: "Ative somente como Elo de Corrente 3 ou superior (Efeito Rápido): você pode Invocar este card da sua mão por Invocação-Especial. Os Cards de Magia que forem ativados são banidos em vez de serem enviados para o Cemitério. O ATK/DEF deste card são, cada um, iguais ao número de Magias no Cemitério do seu oponente x 500. Você só pode controlar 1 \"Winged Kuriboh LV9\"."
- nome: "Temple of the Kings"
  texto: "The controller of this card can activate Trap Cards the same turn they are Set. If you control \"Mystical Beast of Serket\" and this card, you can send both to the Graveyard to Special Summon 1 monster from your hand, Deck, or Extra Deck."
  texto_pt: "O controlador deste card pode ativar Cards de Armadilha no mesmo turno em que forem Baixados. Se você controlar \"Besta Mística de Serket\" e este card, você pode enviar os dois para o Cemitério para Invocar por Invocação-Especial 1 monstro da sua mão, do seu Deck ou do seu Deck Adicional."
- nome: "Chaos Emperor Dragon - Envoy of the End"
  texto: "This card cannot be Normal Summoned or Set. This card can only be Special Summoned by removing from play 1 LIGHT and 1 DARK monster in your Graveyard. By paying 1000 Life Points, send all cards in both players' hands and on the field to the Graveyard. Inflict 300 points of damage to your opponent's Life Points for each card that is sent to the Graveyard by this effect."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card só pode ser Invocado por Invocação-Especial banindo 1 monstro de LUZ e 1 monstro de TREVAS do seu Cemitério. Pagando 1000 PV, envie para o Cemitério todos os cards nas mãos dos dois duelistas e no campo. Cause 300 de dano aos PV do seu oponente para cada card enviado para o Cemitério por este efeito."
- nome: "Exchange of the Spirit"
  texto: "Activate only while there are 15 or more cards in your Graveyard. Pay 1000 Life Points. Both players swap the card(s) in their Graveyard with the card(s) in their Deck. Then, both players shuffle their Decks."
  texto_pt: "Ative somente enquanto houver 15 ou mais cards no seu Cemitério. Pague 1000 PV. Os dois duelistas trocam os cards do próprio Cemitério pelos cards do próprio Deck. Depois, os dois duelistas embaralham os Decks."
- nome: "Imperial Order"
  texto: "Negate all Spell Card effects on the field. During each of your Standby Phases, destroy this card unless you pay 700 Life Points."
  texto_pt: "Negue todos os efeitos de Cards de Magia no campo. Durante cada uma das suas Fases de Apoio, destrua este card, a menos que você pague 700 PV."
- nome: "Last Turn"
  texto: "This card can only be activated during your opponent's turn when your Life Points are 1000 or less. Select 1 monster on your side of the field and send all other cards on the field and in their respective owners' hands to their respective Graveyards. After that, your opponent selects and Special Summons 1 monster from their Deck in face-up Attack Position and attacks your selected monster. (Any Battle Damage from this battle is treated as 0.) The player whose monster remains alone on the field at the End Phase of this turn wins the Duel. Any other case results in a DRAW."
  texto_pt: "Este card só pode ser ativado durante o turno do seu oponente, quando os seus PV forem 1000 ou menos. Escolha 1 monstro no seu lado do campo e envie todos os outros cards do campo e das mãos para os Cemitérios dos respectivos donos. Depois, seu oponente escolhe e Invoca por Invocação-Especial 1 monstro do Deck dele com a face para cima em Posição de Ataque, que ataca o monstro que você escolheu. (Qualquer dano de batalha dessa batalha é tratado como 0.) O duelista cujo monstro for o único que restar no campo na Fase Final deste turno vence o Duelo. Em qualquer outro caso, o resultado é EMPATE."
  substitui: true
- nome: "Makyura the Destructor"
  texto: "During the turn this card is sent to the Graveyard, the owner of this card can activate Trap Card(s) from his/her hand."
  texto_pt: "Durante o turno em que este card for enviado para o Cemitério, o dono dele pode ativar Cards de Armadilha da própria mão."
- nome: "Ring of Destruction"
  texto: "Destroy 1 face-up monster and inflict damage to both players equal to its ATK."
  texto_pt: "Destrua 1 monstro com a face para cima e cause aos dois duelistas dano igual ao ATK dele."
- nome: "Sinister Serpent"
  texto: "During your Standby Phase, if a \"Sinister Serpent\" exists in your Graveyard, you can return the \"Sinister Serpent\" to your hand."
  texto_pt: "Durante a sua Fase de Apoio, se houver um \"Serpente Sinistra\" no seu Cemitério, você pode devolver esse \"Serpente Sinistra\" para a sua mão."
- nome: "Victory Dragon"
  texto: "This card cannot be Special Summoned. To Tribute Summon this card, you must Tribute 3 Dragon-Type monsters. If this card attacks your opponent directly and reduces their Life Points to 0, you win the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Para Invocar este card por Invocação-Tributo, você deve oferecer como Tributo 3 monstros do Tipo Dragão. Se este card atacar o seu oponente diretamente e reduzir os PV dele a 0, você vence a Partida."
- nome: "Witch of the Black Forest"
  texto: "When this card is sent from the field to the Graveyard, add 1 monster with a DEF of 1500 or less from your Deck to your hand. Your Deck is then shuffled."
  texto_pt: "Quando este card for enviado do campo para o Cemitério, adicione 1 monstro com 1500 ou menos de DEF do seu Deck à sua mão. Depois, embaralhe o seu Deck."
- nome: "Ordeal of a Traveler"
  texto: "Once per battle, when an opponent's monster declares an attack: You can activate this effect; Your opponent chooses 1 random card in your hand and calls the card type (Monster, Spell, or Trap), and if they call it wrong, return the attacking monster to the hand."
  texto_pt: "Uma vez por batalha, quando um monstro do oponente declarar um ataque: você pode ativar este efeito; seu oponente escolhe 1 card aleatório da sua mão e declara o tipo do card (Monstro, Magia ou Armadilha) e, se errar, devolva o monstro atacante para a mão."
- nome: "Dice Armadillo"
  texto: "An armadillo monster that rolls up to form a dice-like shape."
  texto_pt: "Um monstro-tatu que se enrola até ficar com o formato de um dado."
- nome: "Fiend Comedian"
  texto: "Toss a coin and call it. If you call it right, all your opponent's cards in the Graveyard are removed from play immediately. If you call it wrong, send a number of cards equal to the cards in your opponent's Graveyard from your Deck to your Graveyard."
  texto_pt: "Jogue uma moeda e escolha um lado. Se acertar, todos os cards no Cemitério do seu oponente são banidos imediatamente. Se errar, envie do seu Deck para o seu Cemitério uma quantidade de cards igual à de cards no Cemitério do seu oponente."
- nome: "Kryuel"
  texto: "When this card is sent to the Graveyard as a result of battle, toss a coin and call it. If you call it right, destroy 1 monster on your opponent's side of the field."
  texto_pt: "Quando este card for enviado para o Cemitério em consequência de uma batalha, jogue uma moeda e escolha um lado. Se acertar, destrua 1 monstro no lado do campo do seu oponente."
- nome: "Call of Darkness"
  texto: "All monsters restored with \"Monster Reborn\" are sent to the Graveyard. \"Monster Reborn\" also cannot be played as long as this card remains on the field."
  texto_pt: "Todos os monstros restaurados com \"Reviver Monstro\" são enviados para o Cemitério. Além disso, \"Reviver Monstro\" não pode ser usado enquanto este card estiver no campo."
- nome: "Chain Strike"
  texto: "Activate only as Chain Link 2 or higher; inflict 400 damage to your opponent times the Chain Link number of this card. You cannot activate this card if multiple cards/effects with the same name are in that Chain."
  texto_pt: "Ative somente como Elo de Corrente 2 ou superior; cause ao seu oponente 400 de dano multiplicado pelo número do Elo de Corrente deste card. Você não pode ativar este card se houver vários cards/efeitos com o mesmo nome nessa Corrente."
- nome: "Accumulated Fortune"
  texto: "Activate only as Chain Link 4 or higher. Draw 2 cards. You cannot activate this card if multiple cards/effects with the same name are in that Chain."
  texto_pt: "Ative somente como Elo de Corrente 4 ou superior. Compre 2 cards. Você não pode ativar este card se houver vários cards/efeitos com o mesmo nome nessa Corrente."
- nome: "Forced Back"
  texto: "Negate the Normal Summon or Flip Summon of a monster and return it to its owner's hand."
  texto_pt: "Negue a Invocação-Normal ou a Invocação-Virar de um monstro e devolva-o para a mão do dono."
- nome: "Voltanis the Adjudicator"
  texto: "After 1 of your Counter Trap Cards has been activated and has resolved, you can Tribute all monsters you control to Special Summon this card. If this card is Special Summoned in this way, you can destroy cards your opponent controls up to the number of Fairy-Type monsters you Tributed."
  texto_pt: "Depois que 1 dos seus Cards de Armadilha de Resposta tiver sido ativado e resolvido, você pode oferecer como Tributo todos os monstros que você controla para Invocar este card por Invocação-Especial. Se este card for Invocado por Invocação-Especial dessa forma, você pode destruir cards que seu oponente controla, até a quantidade de monstros do Tipo Fada que você ofereceu como Tributo."
- nome: "Curse of Royal"
  texto: "Negate the activation and the effect of a Spell or Trap Card that includes the effect of destroying 1 Spell or Trap Card and destroy it."
  texto_pt: "Negue a ativação e o efeito de um Card de Magia ou de Armadilha que inclua o efeito de destruir 1 Card de Magia ou de Armadilha e destrua-o."
  substitui: true
- nome: "Miraculous Rebirth"
  texto: "Activate only as Chain Link 4 or higher. Select 1 monster from either player's Graveyard and Special Summon it. You cannot activate this card if multiple cards/effects with the same name are in that Chain."
  texto_pt: "Ative somente como Elo de Corrente 4 ou superior. Escolha 1 monstro no Cemitério de qualquer duelista e Invoque-o por Invocação-Especial. Você não pode ativar este card se houver vários cards/efeitos com o mesmo nome nessa Corrente."
- nome: "Spell Reclamation"
  texto: "Discard 1 card and chain this card to a Spell Card you activated. Whenever that Spell Card is sent to the Graveyard, return it to its owner's hand."
  texto_pt: "Descarte 1 card e encadeie este card a um Card de Magia que você ativou. Quando esse Card de Magia for enviado para o Cemitério, devolva-o para a mão do dono."
- nome: "Trap Reclamation"
  texto: "Discard 1 card and chain this card to a Trap Card you activated. Whenever that Trap Card is sent to the Graveyard, return it to its owner's hand."
  texto_pt: "Descarte 1 card e encadeie este card a um Card de Armadilha que você ativou. Quando esse Card de Armadilha for enviado para o Cemitério, devolva-o para a mão do dono."
- nome: "Battle Tuned"
  texto: "Remove from play 1 Tuner monster from your Graveyard. Target face-up monster you control gains ATK equal to the removed monster's ATK."
  texto_pt: "Bana 1 monstro Regulador do seu Cemitério. O monstro com a face para cima que você controla escolhido como alvo ganha ATK igual ao ATK do monstro banido."
- nome: "Blast Asmodian"
  texto: "If any Spell or Trap Card(s) are Chained, inflict 500 damage to your opponent."
  texto_pt: "Se algum Card de Magia ou de Armadilha for encadeado, cause 500 de dano ao seu oponente."
- nome: "Chain Detonation"
  texto: "Inflict 500 damage to your opponent. If this card was activated as Chain Link 2 or 3, add this card to the Deck and shuffle it. If this card was activated as Chain Link 4 or higher, return this card to the hand."
  texto_pt: "Cause 500 de dano ao seu oponente. Se este card foi ativado como Elo de Corrente 2 ou 3, coloque este card no Deck e embaralhe-o. Se este card foi ativado como Elo de Corrente 4 ou superior, devolva este card para a mão."
- nome: "Chain Healing"
  texto: "Gain 500 Life Points. If this card was activated as Chain Link 2 or 3, add this card to the Deck and shuffle it. If this card was activated as Chain Link 4 or higher, return this card to the hand."
  texto_pt: "Ganhe 500 PV. Se este card foi ativado como Elo de Corrente 2 ou 3, coloque este card no Deck e embaralhe-o. Se este card foi ativado como Elo de Corrente 4 ou superior, devolva este card para a mão."
- nome: "Combo Fighter"
  texto: "If a Chain (of 2 or more Links) occurred in your Main Phase 1, this card can attack twice during the Battle Phase this turn."
  texto_pt: "Se uma Corrente (de 2 ou mais Elos) tiver ocorrido na sua Fase Principal 1, este card pode atacar duas vezes durante a Fase de Batalha deste turno."
- nome: "Combo Master"
  texto: "If a Chain (of 2 or more Links) occurred in your Main Phase 1, this card can attack twice during the Battle Phase this turn."
  texto_pt: "Se uma Corrente (de 2 ou mais Elos) tiver ocorrido na sua Fase Principal 1, este card pode atacar duas vezes durante a Fase de Batalha deste turno."
- nome: "Cunning of the Six Samurai"
  texto: "Send 1 face-up \"Six Samurai\" monster you control to the Graveyard, then target 1 \"Six Samurai\" monster in either player's Graveyard; Special Summon that target."
  texto_pt: "Envie para o Cemitério 1 monstro \"Seis Samurai\" com a face para cima que você controla e, depois, escolha 1 monstro \"Seis Samurai\" no Cemitério de qualquer duelista; Invoque o alvo por Invocação-Especial."
- nome: "Destruction Jammer"
  texto: "Discard 1 card. Negate the activation of a Spell Card, Trap Card, or Effect Monster's effect that destroys a monster(s) on the field, and destroy that card."
  texto_pt: "Descarte 1 card. Negue a ativação de um Card de Magia, Card de Armadilha ou efeito de Monstro de Efeito que destrua um ou mais monstros no campo e destrua esse card."
- nome: "Factory of 100 Machines"
  texto: "Remove from play all \"Morphtronic\" monsters from your Graveyard. Target face-up Machine-Type monster you control gains 200 ATK for each card removed, until the End Phase."
  texto_pt: "Bana todos os monstros \"Morfotrônico(a)\" do seu Cemitério. O monstro do Tipo Máquina com a face para cima que você controla escolhido como alvo ganha 200 de ATK para cada card banido, até a Fase Final."
- nome: "Goblin Out of the Frying Pan"
  texto: "Pay 500 Life Points. Negate the activation of a Spell Card and return it to the owner's hand."
  texto_pt: "Pague 500 PV. Negue a ativação de um Card de Magia e devolva-o para a mão do dono."
- nome: "Intercept"
  texto: "Activate only when a monster is Tribute Summoned with 1 Tribute. Take control of that monster."
  texto_pt: "Ative somente quando um monstro for Invocado por Invocação-Tributo com 1 Tributo. Assuma o controle desse monstro."
- nome: "Iris, the Earth Mother"
  texto: "After a Chain with 3 or more Links resolves, draw 1 card. This effect cannot activate if multiple cards/effects with the same name were activated in that Chain."
  texto_pt: "Depois que uma Corrente com 3 ou mais Elos for resolvida, compre 1 card. Este efeito não pode ser ativado se vários cards/efeitos com o mesmo nome tiverem sido ativados nessa Corrente."
- nome: "Lightning Punisher"
  texto: "After a Chain with 3 or more Links resolves, destroy 1 card on your opponent's side of the field. This effect cannot activate if multiple cards/effects with the same name were activated in that Chain."
  texto_pt: "Depois que uma Corrente com 3 ou mais Elos for resolvida, destrua 1 card no lado do campo do seu oponente. Este efeito não pode ser ativado se vários cards/efeitos com o mesmo nome tiverem sido ativados nessa Corrente."
- nome: "Malfunction"
  texto: "Pay 500 Life Points. Negate the activation of a Trap Card and return it to its original position."
  texto_pt: "Pague 500 PV. Negue a ativação de um Card de Armadilha e devolva-o à posição original."
- nome: "Man Beast of Ares"
  texto: "After a Chain (of 2 or more Links) resolves, this card gains 500 ATK."
  texto_pt: "Depois que uma Corrente (de 2 ou mais Elos) for resolvida, este card ganha 500 de ATK."
- nome: "Mystical Wind Typhoon"
  texto: "Activate only as Chain Link 3 or higher. Destroy 1 Spell or Trap Card on the field. You cannot activate this card if multiple cards/effects with the same name are in that Chain."
  texto_pt: "Ative somente como Elo de Corrente 3 ou superior. Destrua 1 Card de Magia ou de Armadilha no campo. Você não pode ativar este card se houver vários cards/efeitos com o mesmo nome nessa Corrente."
- nome: "Pyramid Energy"
  texto: "You can select and activate 1 of the following effects:\n● Increase the ATK of all face-up monsters on your side of the field by 200 points until the End Phase of the turn this card is activated.\n● Increase the DEF of all face-up monsters on your side of the field by 500 points until the End Phase of the turn this card is activated."
  texto_pt: "Você pode escolher e ativar 1 dos efeitos a seguir:\n● Aumente em 200 o ATK de todos os monstros com a face para cima no seu lado do campo até a Fase Final do turno em que este card for ativado.\n● Aumente em 500 a DEF de todos os monstros com a face para cima no seu lado do campo até a Fase Final do turno em que este card for ativado."
- nome: "Quick Charger"
  texto: "Add 2 Level 4 or lower \"Batteryman\" monsters from your Graveyard to your hand."
  texto_pt: "Adicione 2 monstros \"Homem-Bateria\" de Nível 4 ou menos do seu Cemitério à sua mão."
- nome: "Seed of Deception"
  texto: "Special Summon 1 Level 2 or lower Plant-Type monster from your hand."
  texto_pt: "Invoque por Invocação-Especial 1 monstro do Tipo Planta de Nível 2 ou menos da sua mão."
- nome: "Spell Gear"
  texto: "Send 3 \"Ancient Gear\" cards you control to the Graveyard. You can Special Summon up to 1 \"Ancient Gear Golem\" from your hand and 1 from your Deck, ignoring the Summoning conditions. Then, destroy all monsters you control except \"Ancient Gear Golems\". You cannot Normal Summon or Set until the end of your next turn."
  texto_pt: "Envie para o Cemitério 3 cards \"Mecanismo Antigo\" que você controla. Você pode Invocar por Invocação-Especial até 1 \"Golem do Mecanismo Antigo\" da sua mão e 1 do seu Deck, ignorando as condições de Invocação. Depois, destrua todos os monstros que você controla, exceto \"Golem do Mecanismo Antigo\". Você não pode Invocar por Invocação-Normal nem Baixar até o fim do seu próximo turno."
- nome: "Super Double Summon"
  texto: "Select 1 Gemini monster you control and Normal Summon it. During the End Phase of this turn, return it to your hand."
  texto_pt: "Escolha 1 monstro Gêmeos que você controla e Invoque-o por Invocação-Normal. Durante a Fase Final deste turno, devolva-o para a sua mão."
- nome: "The Selection"
  texto: "Pay 1000 Life Points. Negate the Summon of a monster that has the same Type as a monster on the field, and destroy it."
  texto_pt: "Pague 1000 PV. Negue a Invocação de um monstro que tenha o mesmo Tipo de um monstro no campo e destrua-o."
- nome: "Tornado"
  texto: "Activate only when there are 3 or more cards in your opponent's Spell & Trap Card Zone. Destroy 1 card in your opponent's Spell & Trap Card Zone."
  texto_pt: "Ative somente quando houver 3 ou mais cards na Zona de Magias e Armadilhas do seu oponente. Destrua 1 card na Zona de Magias e Armadilhas do seu oponente."
- nome: "Unleash Your Power!"
  texto: "All Gemini monsters that were on your side of the field when this card was activated are treated as Effect Monsters, and gain their effect(s). During the End Phase of this turn, Set all monsters affected by this card's effect."
  texto_pt: "Todos os monstros Gêmeos que estavam no seu lado do campo quando este card foi ativado são tratados como Monstros de Efeito e ganham os efeitos deles. Durante a Fase Final deste turno, Baixe todos os monstros afetados pelo efeito deste card."
- nome: "Vanity's Call"
  texto: "Activate only as Chain Link 4 or higher. Pay half your Life Points. Negate the activation and effects of all other cards in the same Chain, and destroy them."
  texto_pt: "Ative somente como Elo de Corrente 4 ou superior. Pague metade dos seus PV. Negue a ativação e os efeitos de todos os outros cards da mesma Corrente e destrua-os."
- nome: "Breakthrough!"
  texto: "Select 1 \"Six Samurai\" monster you control. If the selected monster destroys an opponent's monster by battle, \"Great Shogun Shien\" and all \"Six Samurai\" monsters you control can attack your opponent directly during the Battle Phase of this turn."
  texto_pt: "Escolha 1 monstro \"Seis Samurai\" que você controla. Se o monstro escolhido destruir um monstro do oponente em batalha, \"Grande Shogun Shien\" e todos os monstros \"Seis Samurai\" que você controla podem atacar o seu oponente diretamente durante a Fase de Batalha deste turno."
- nome: "Legendary Ebon Steed"
  texto: "Equip only to a \"Six Samurai\" monster. It gains 200 ATK and DEF. If it would be destroyed, destroy this card instead."
  texto_pt: "Equipe somente a um monstro \"Seis Samurai\". Ele ganha 200 de ATK e DEF. Se ele fosse ser destruído, em vez disso, destrua este card."
- nome: "The Six Samurai - Irou"
  texto: "At the start of the Damage Step, if this card attacked a face-down Defense Position monster: Destroy that monster. You must control a face-up \"Six Samurai\" monster with a different name to activate and to resolve this effect. If this card would be destroyed, you can destroy another face-up \"Six Samurai\" monster you control instead."
  texto_pt: "No início da Etapa de Dano, se este card atacou um monstro em Posição de Defesa com a face para baixo: destrua esse monstro. Você precisa controlar um monstro \"Seis Samurai\" com a face para cima com nome diferente para ativar e resolver este efeito. Se este card fosse ser destruído, em vez disso, você pode destruir outro monstro \"Seis Samurai\" com a face para cima que você controla."
- nome: "The Six Samurai - Yaichi"
  texto: "Once per turn: You can target 1 Set Spell/Trap Card; destroy that target. You must control a face-up \"Six Samurai\" monster with a different name to activate and to resolve this effect. This card cannot declare an attack during the turn this effect is activated. If this card would be destroyed, you can destroy another face-up \"Six Samurai\" monster you control instead."
  texto_pt: "Uma vez por turno: você pode escolher 1 Card de Magia/Armadilha Baixado; destrua o alvo. Você precisa controlar um monstro \"Seis Samurai\" com a face para cima com nome diferente para ativar e resolver este efeito. Este card não pode declarar ataques no turno em que este efeito for ativado. Se este card fosse ser destruído, em vez disso, você pode destruir outro monstro \"Seis Samurai\" com a face para cima que você controla."
- nome: "Clear Vicious Knight"
  texto: "When this card is face-up on the field, do not treat its Attribute as DARK. When there are monsters on your opponent's field, you can Summon this card with 1 Tribute. If there are no other cards in your hand or control, this card gains ATK equal to the original ATK of the face-up monster with the highest original ATK on your opponent's field."
  texto_pt: "Quando este card estiver com a face para cima no campo, o Atributo dele não é tratado como TREVAS. Quando houver monstros no campo do seu oponente, você pode Invocar este card com 1 Tributo. Se não houver outros cards na sua mão nem sob o seu controle, este card ganha ATK igual ao ATK original do monstro com a face para cima com o maior ATK original no campo do seu oponente."
- nome: "Shien's Castle of Mist"
  texto: "When a \"Six Samurai\" monster is attacked, the attacking monster loses 500 ATK during damage calculation only."
  texto_pt: "Quando um monstro \"Seis Samurai\" for atacado, o monstro atacante perde 500 de ATK, somente durante o cálculo de dano."
- nome: "Shien's Footsoldier"
  texto: "When this card is destroyed by battle and sent to the Graveyard: You can Special Summon 1 Level 3 or lower \"Six Samurai\" monster from your Deck."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério: você pode Invocar por Invocação-Especial 1 monstro \"Seis Samurai\" de Nível 3 ou menos do seu Deck."
- nome: "Tenkabito Shien"
  texto: "This card is unaffected by the effects of Trap Cards."
  texto_pt: "Este card não é afetado pelos efeitos de Cards de Armadilha."
- nome: "The Six Samurai - Kamon"
  texto: "Once per turn: You can target 1 face-up Spell/Trap Card; destroy that target. You must control a face-up \"Six Samurai\" monster with a different name to activate and to resolve this effect. This card cannot declare an attack during the turn this effect is activated. If this card would be destroyed, you can destroy another face-up \"Six Samurai\" monster you control instead."
  texto_pt: "Uma vez por turno: você pode escolher 1 Card de Magia/Armadilha com a face para cima; destrua o alvo. Você precisa controlar um monstro \"Seis Samurai\" com a face para cima com nome diferente para ativar e resolver este efeito. Este card não pode declarar ataques no turno em que este efeito for ativado. Se este card fosse ser destruído, em vez disso, você pode destruir outro monstro \"Seis Samurai\" com a face para cima que você controla."
- nome: "The Six Samurai - Nisashi"
  texto: "While you control a face-up \"Six Samurai\" monster with a different name, this card can attack twice during each Battle Phase. If this card would be destroyed, you can destroy another face-up \"Six Samurai\" monster you control instead."
  texto_pt: "Enquanto você controlar um monstro \"Seis Samurai\" com a face para cima com nome diferente, este card pode atacar duas vezes durante cada Fase de Batalha. Se este card fosse ser destruído, em vez disso, você pode destruir outro monstro \"Seis Samurai\" com a face para cima que você controla."
- nome: "The Six Samurai - Yariza"
  texto: "While you control a face-up \"Six Samurai\" monster with a different name, this card can attack your opponent directly. If this card would be destroyed, you can destroy another face-up \"Six Samurai\" monster you control instead."
  texto_pt: "Enquanto você controlar um monstro \"Seis Samurai\" com a face para cima com nome diferente, este card pode atacar o seu oponente diretamente. Se este card fosse ser destruído, em vez disso, você pode destruir outro monstro \"Seis Samurai\" com a face para cima que você controla."
- nome: "Beautiful Headhuntress"
  texto: "A vicious creature that has decapitated numerous enemy monsters."
  texto_pt: "Uma criatura cruel que já decapitou inúmeros monstros inimigos."
- nome: "Cross Porter"
  texto: "You can target 1 monster you control; send that target to the GY, and if you do, Special Summon 1 \"Neo-Spacian\" monster from your hand. When this card is sent to the GY: You can add 1 \"Neo-Spacian\" monster from your Deck to your hand."
  texto_pt: "Você pode escolher 1 monstro que você controla; envie o alvo para o Cemitério e, se fizer isso, Invoque por Invocação-Especial 1 monstro \"Neoespacial\" da sua mão. Quando este card for enviado para o Cemitério: você pode adicionar 1 monstro \"Neoespacial\" do seu Deck à sua mão."
- nome: "D.D. Guide"
  texto: "When this card is Normal Summoned, give control of it to your opponent. During each player's End Phase, your opponent selects 1 card from the Graveyard of this card's controller and removes it from play."
  texto_pt: "Quando este card for Invocado por Invocação-Normal, entregue o controle dele ao seu oponente. Durante a Fase Final de cada duelista, seu oponente escolhe 1 card do Cemitério do controlador deste card e o bane."
- nome: "Dark Scorpion Burglars"
  texto: "When this card inflicts Battle Damage to your opponent: Your opponent sends 1 Spell Card from their Deck to the Graveyard."
  texto_pt: "Quando este card causar dano de batalha ao seu oponente: seu oponente envia 1 Card de Magia do Deck dele para o Cemitério."
- nome: "Disciple of the Forbidden Spell"
  texto: "When this card is Summoned, declare different Monster Card Attributes equal to the number of \"Disciple of the Forbidden Spell\"(s) in your Graveyard. If this card attacks a monster that has a declared Attribute, destroy the monster with this card's effect without applying damage calculation."
  texto_pt: "Quando este card for Invocado, declare Atributos de Cards de Monstro diferentes, em quantidade igual ao número de \"Disciple of the Forbidden Spell\" no seu Cemitério. Se este card atacar um monstro que tenha um Atributo declarado, destrua esse monstro com o efeito deste card sem aplicar o cálculo de dano."
- nome: "Dragonic Attack"
  texto: "This card can only be used to equip Warrior-Type monsters. The equipped monster is treated as Dragon-Type and increases the ATK and DEF of the equipped monster by 500 points."
  texto_pt: "Este card só pode equipar monstros do Tipo Guerreiro. O monstro equipado é tratado como do Tipo Dragão e tem o ATK e a DEF aumentados em 500."
- nome: "Field-Commander Rahz"
  texto: "When this card is Normal or Special Summoned: Choose 1 Level 4 or lower Warrior-Type monster from your Deck, except \"Field-Commander Rahz\", and place it on top of your Deck."
  texto_pt: "Quando este card for Invocado por Invocação-Normal ou por Invocação-Especial: escolha 1 monstro do Tipo Guerreiro de Nível 4 ou menos do seu Deck, exceto \"Field-Commander Rahz\", e coloque-o no topo do seu Deck."
- nome: "Future Samurai"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it become an Effect Monster with this effect.\n● Once per turn: You can banish 1 monster from your Graveyard to target 1 face-up monster on the field; destroy that target."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● Uma vez por turno: você pode banir 1 monstro do seu Cemitério para escolher 1 monstro com a face para cima no campo; destrua o alvo."
- nome: "Goblin Recon Squad"
  texto: "If this card successfully attacks directly, you can look at 1 random card in your opponent's hand. If it is a Spell Card, send it to the Graveyard. If this card attacks, it is changed to Defense Position at the end of the Battle Phase. This card's battle position cannot be changed until the end of your next turn, except with a card effect."
  texto_pt: "Se este card atacar diretamente com sucesso, você pode olhar 1 card aleatório da mão do seu oponente. Se for um Card de Magia, envie-o para o Cemitério. Se este card atacar, ele muda para Posição de Defesa no fim da Fase de Batalha. A posição de batalha deste card não pode mudar até o fim do seu próximo turno, exceto pelo efeito de um card."
- nome: "Iron Chain Blaster"
  texto: "Once per turn, you can send 1 \"Iron Chain\" monster you control to the Graveyard to inflict 800 damage to your opponent."
  texto_pt: "Uma vez por turno, você pode enviar 1 monstro \"Corrente de Ferro\" que você controla para o Cemitério para causar 800 de dano ao seu oponente."
- nome: "Iron Chain Repairman"
  texto: "When this card destroys a monster by battle and sends it to the Graveyard, inflict 300 damage to your opponent. Once per turn, you can Special Summon 1 Level 4 or lower \"Iron Chain\" monster from your Graveyard, except \"Iron Chain Repairman\". This card cannot attack the turn you activate this effect."
  texto_pt: "Quando este card destruir um monstro em batalha e enviá-lo para o Cemitério, cause 300 de dano ao seu oponente. Uma vez por turno, você pode Invocar por Invocação-Especial 1 monstro \"Corrente de Ferro\" de Nível 4 ou menos do seu Cemitério, exceto \"Iron Chain Repairman\". Este card não pode atacar no turno em que você ativar este efeito."
- nome: "Samsara Kaiser"
  texto: "When you Tribute Summon a monster by Tributing this card, return this card to your hand."
  texto_pt: "Quando você Invocar um monstro por Invocação-Tributo oferecendo este card como Tributo, devolva este card para a sua mão."
- nome: "Search Striker"
  texto: "If this card attacks a face-down Defense Position monster, you can destroy the monster immediately with this card's effect without flipping it face-up or applying damage calculation. If you do, this card is changed to Defense Position at the end of the Battle Phase. This card's battle position cannot be changed until the end of your next turn, except with a card effect."
  texto_pt: "Se este card atacar um monstro em Posição de Defesa com a face para baixo, você pode destruir esse monstro imediatamente com o efeito deste card, sem virá-lo com a face para cima nem aplicar o cálculo de dano. Se fizer isso, este card muda para Posição de Defesa no fim da Fase de Batalha. A posição de batalha deste card não pode mudar até o fim do seu próximo turno, exceto pelo efeito de um card."
- nome: "Spirit of the Six Samurai"
  texto: "Once per turn, you can either: Target 1 face-up \"Six Samurai\" monster you control; equip this card to that target, OR: Unequip this card and Special Summon it in face-up Attack Position. While equipped by this effect, the equipped monster gains 500 ATK and DEF. If the equipped monster destroys an opponent's monster by battle: Draw 1 card. (A monster can only be equipped with 1 Union Monster at a time. If the equipped monster would be destroyed, destroy this card instead.)"
  texto_pt: "Uma vez por turno, você pode: escolher 1 monstro \"Seis Samurai\" com a face para cima que você controla e equipar este card ao alvo, OU desequipar este card e Invocá-lo por Invocação-Especial com a face para cima em Posição de Ataque. Enquanto estiver equipado por este efeito, o monstro equipado ganha 500 de ATK e DEF. Se o monstro equipado destruir um monstro do oponente em batalha: compre 1 card. (Um monstro só pode estar equipado com 1 Monstro União por vez. Se o monstro equipado fosse ser destruído, em vez disso, destrua este card.)"
- nome: "Swift Samurai Storm!"
  texto: "Each turn, after the first time a \"Six Samurai\" monster you control battles, all \"Six Samurai\" monsters you control gain 300 ATK until the end of this turn."
  texto_pt: "A cada turno, depois da primeira vez em que um monstro \"Seis Samurai\" que você controla batalhar, todos os monstros \"Seis Samurai\" que você controla ganham 300 de ATK até o fim deste turno."
- nome: "The Hunter with 7 Weapons"
  texto: "When this card is Normal Summoned, declare 1 Type of monster. When battling that Type of monster, increase the ATK of this card by 1000 points during Damage Calculation."
  texto_pt: "Quando este card for Invocado por Invocação-Normal, declare 1 Tipo de monstro. Ao batalhar com um monstro desse Tipo, aumente o ATK deste card em 1000 durante o cálculo de dano."
- nome: "Throwstone Unit"
  texto: "Tribute 1 Warrior-Type monster on your side of the field to destroy 1 face-up monster on the field whose DEF is equal to or less than the ATK of \"Throwstone Unit\"."
  texto_pt: "Ofereça como Tributo 1 monstro do Tipo Guerreiro no seu lado do campo para destruir 1 monstro com a face para cima no campo cuja DEF seja igual ou menor que o ATK de \"Throwstone Unit\"."
- nome: "Total Defense Shogun"
  texto: "If this card is Normal or Flip Summoned: Change it to Defense Position. This card can attack while in face-up Defense Position. If it does, apply its ATK for damage calculation."
  texto_pt: "Se este card for Invocado por Invocação-Normal ou por Invocação-Virar: mude-o para Posição de Defesa. Este card pode atacar enquanto estiver em Posição de Defesa com a face para cima. Se fizer isso, use o ATK dele no cálculo de dano."
- nome: "Twin-Shield Defender"
  texto: "When this card you control is destroyed by battle and sent to your Graveyard, you can halve the current ATK of 1 face-up monster your opponent controls, until the End Phase."
  texto_pt: "Quando este card que você controla for destruído em batalha e enviado para o seu Cemitério, você pode reduzir à metade o ATK atual de 1 monstro com a face para cima que seu oponente controla, até a Fase Final."
- nome: "Yamato-no-Kami"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except by removing from play 1 Spirit monster from your Graveyard. This card returns to its owner's hand during the End Phase of the turn it is Special Summoned. If this card destroys an opponent's monster by battle, you can destroy 1 Spell or Trap Card your opponent controls."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto banindo 1 monstro Espírito do seu Cemitério. Este card volta para a mão do dono durante a Fase Final do turno em que for Invocado por Invocação-Especial. Se este card destruir um monstro do oponente em batalha, você pode destruir 1 Card de Magia ou de Armadilha que seu oponente controla."
- nome: "Zanki"
  texto: "His swiftly drawn blade delivers quick and fatal damage."
  texto_pt: "Sua lâmina, sacada num piscar de olhos, causa um dano rápido e fatal."
- nome: "Dark Magician of Chaos"
  texto: "When this card is Normal or Special Summoned, you can select and add 1 Spell Card from your Graveyard to your hand. Monsters this card destroys by battle are removed from play instead of going to the Graveyard. If this face-up card is destroyed or removed from the field, it is removed from play."
  texto_pt: "Quando este card for Invocado por Invocação-Normal ou por Invocação-Especial, você pode escolher 1 Card de Magia do seu Cemitério e adicioná-lo à sua mão. Monstros destruídos em batalha por este card são banidos em vez de irem para o Cemitério. Se este card com a face para cima for destruído ou sair do campo, ele é banido."
- nome: "Rapid-Fire Magician"
  texto: "Inflict 400 damage to your opponent each time you activate a Normal Spell Card."
  texto_pt: "Cause 400 de dano ao seu oponente sempre que você ativar um Card de Magia Normal."
- nome: "Cell Explosion Virus"
  texto: "Activate only when an opponent's monster with an A-Counter declares an attack. Destroy all Attack Position monsters your opponent controls."
  texto_pt: "Ative somente quando um monstro do oponente com um Marcador A declarar um ataque. Destrua todos os monstros em Posição de Ataque que seu oponente controla."
- nome: "Cold Enchanter"
  texto: "You can discard 1 card to target 1 face-up monster on the field; place an Ice Counter on that target. This card gains 300 ATK for each Ice Counter on the field."
  texto_pt: "Você pode descartar 1 card para escolher 1 monstro com a face para cima no campo; coloque um Marcador de Gelo no alvo. Este card ganha 300 de ATK para cada Marcador de Gelo no campo."
- nome: "Dark Magician Knight"
  texto: "Cannot be Normal Summoned/Set. Must be Special Summoned with \"Knight's Title\" and cannot be Special Summoned by other ways. When this card is Special Summoned: Target 1 card on the field; destroy that target."
  texto_pt: "Não pode ser Invocado por Invocação-Normal/Baixado. Deve ser Invocado por Invocação-Especial com \"Título de Cavaleiro\" e não pode ser Invocado por Invocação-Especial de outras formas. Quando este card for Invocado por Invocação-Especial: escolha 1 card no campo; destrua o alvo."
- nome: "Detonator Circle \"A\""
  texto: "Destroy 1 face-up monster with an A-Counter(s), and then inflict 1000 damage to each player."
  texto_pt: "Destrua 1 monstro com a face para cima com um ou mais Marcadores A e, depois, cause 1000 de dano a cada duelista."
- nome: "Knight's Title"
  texto: "Tribute 1 face-up \"Dark Magician\"; Special Summon 1 \"Dark Magician Knight\" from your hand, Deck or Graveyard."
  texto_pt: "Ofereça como Tributo 1 \"Mago Negro\" com a face para cima; Invoque por Invocação-Especial 1 \"Dark Magician Knight\" da sua mão, do seu Deck ou do seu Cemitério."
- nome: "Sorcerer of Dark Magic"
  texto: "Cannot be Normal Summoned/Set. Must be Special Summoned (from your hand) by Tributing 2 Level 6 or higher Spellcaster-Type monsters, and cannot be Special Summoned by other ways. During either player's turn, when a Trap Card is activated: You can negate the activation, and if you do, destroy it. This card must be face-up on the field to activate and to resolve this effect."
  texto_pt: "Não pode ser Invocado por Invocação-Normal/Baixado. Deve ser Invocado por Invocação-Especial (da sua mão) oferecendo como Tributo 2 monstros do Tipo Mago de Nível 6 ou mais, e não pode ser Invocado por Invocação-Especial de outras formas. Durante o turno de qualquer duelista, quando um Card de Armadilha for ativado: você pode negar a ativação e, se fizer isso, destruí-lo. Este card deve estar com a face para cima no campo para ativar e resolver este efeito."
  substitui: true
- nome: "Ally Salvo"
  texto: "When this card is destroyed by battle with a LIGHT monster and sent to the Graveyard, select 2 cards on the field and destroy them."
  texto_pt: "Quando este card for destruído em batalha com um monstro de LUZ e enviado para o Cemitério, escolha 2 cards no campo e destrua-os."
- nome: "Chaos-End Master"
  texto: "When this card destroys an opponent's monster by battle and sends it to the Graveyard, you can Special Summon 1 Level 5 or higher monster with 1600 or less ATK from your Deck."
  texto_pt: "Quando este card destruir um monstro do oponente em batalha e enviá-lo para o Cemitério, você pode Invocar por Invocação-Especial 1 monstro de Nível 5 ou mais com 1600 ou menos de ATK do seu Deck."
- nome: "Flamvell Archer"
  texto: "Once per turn, you can Tribute 1 face-up Pyro-Type monster you control to have all \"Flamvell\" monsters on the field gain 800 ATK until the End Phase."
  texto_pt: "Uma vez por turno, você pode oferecer como Tributo 1 monstro do Tipo Piro com a face para cima que você controla para que todos os monstros \"Flamvell\" no campo ganhem 800 de ATK até a Fase Final."
- nome: "Frequency Magician"
  texto: "When this card is Normal Summoned, place 1 Spell Counter on it (max. 1). You can remove 1 Spell Counter from this card to have 1 face-up monster you control gain 500 ATK, until the End Phase."
  texto_pt: "Quando este card for Invocado por Invocação-Normal, coloque 1 Marcador de Magia nele (máx. 1). Você pode remover 1 Marcador de Magia deste card para que 1 monstro com a face para cima que você controla ganhe 500 de ATK até a Fase Final."
- nome: "Genex Worker"
  texto: "You can Tribute this card to Special Summon 1 \"Genex\" monster from your hand."
  texto_pt: "Você pode oferecer este card como Tributo para Invocar por Invocação-Especial 1 monstro \"Genex\" da sua mão."
- nome: "Ghost Gardna"
  texto: "When a face-up monster you control is selected as an attack target, you can change the target to this card. When this card is destroyed and sent to the Graveyard, 1 face-up monster your opponent controls loses 1000 ATK, until the End Phase."
  texto_pt: "Quando um monstro com a face para cima que você controla for escolhido como alvo de ataque, você pode mudar o alvo para este card. Quando este card for destruído e enviado para o Cemitério, 1 monstro com a face para cima que seu oponente controla perde 1000 de ATK até a Fase Final."
- nome: "Goyo Guardian"
  texto: "1 Tuner + 1 or more non-Tuner monsters\nWhen this card destroys an opponent's monster by battle and sends it to the Graveyard, you can Special Summon that monster to your side of the field in face-up Defense Position."
  texto_pt: "1 Regulador + 1 ou mais monstros não-Reguladores\nQuando este card destruir um monstro do oponente em batalha e enviá-lo para o Cemitério, você pode Invocar esse monstro por Invocação-Especial no seu lado do campo com a face para cima em Posição de Defesa."
- nome: "Hydro Genex"
  texto: "\"Genex Controller\" + 1 or more non-Tuner WATER monsters\nWhen this card destroys an opponent's monster by battle and sends it to the Graveyard, gain Life Points equal to the ATK of the destroyed monster."
  texto_pt: "\"Controlador Genex\" + 1 ou mais monstros não-Reguladores de ÁGUA\nQuando este card destruir um monstro do oponente em batalha e enviá-lo para o Cemitério, ganhe PV iguais ao ATK do monstro destruído."
- nome: "Numbing Grub in the Ice Barrier"
  texto: "When this card is Normal Summoned, select 1 unused Main Monster Zone. While this card is face-up on the field, that selected Main Monster Zone cannot be used."
  texto_pt: "Quando este card for Invocado por Invocação-Normal, escolha 1 Zona de Monstros Principal que não esteja em uso. Enquanto este card estiver com a face para cima no campo, a Zona de Monstros Principal escolhida não pode ser usada."
- nome: "Iron Chain Coil"
  texto: "Once per turn, you can select 1 \"Iron Chain\" monster you control to have it gain 300 ATK and DEF as long as this card is face-up on the field."
  texto_pt: "Uma vez por turno, você pode escolher 1 monstro \"Corrente de Ferro\" que você controla para que ele ganhe 300 de ATK e DEF enquanto este card estiver com a face para cima no campo."
- nome: "Jutte Fighter"
  texto: "Once per turn, you can change 1 face-up Attack Position monster your opponent controls to face-up Defense Position."
  texto_pt: "Uma vez por turno, você pode mudar 1 monstro em Posição de Ataque com a face para cima que seu oponente controla para Posição de Defesa com a face para cima."
- nome: "Tune Warrior"
  texto: "The warrior's antenna can attune it to any energy wave. It can monitor transmissions from miles away but always suffers from bad reception."
  texto_pt: "A antena deste guerreiro consegue sintonizá-lo em qualquer onda de energia. Ele monitora transmissões a quilômetros de distância, mas sempre sofre com a recepção ruim."
- nome: "Turbo Booster"
  texto: "If you have Normal Summoned a monster this turn, you can Special Summon this card from your hand. You can Tribute this card to destroy 1 monster your opponent controls that battled one of your monsters this turn."
  texto_pt: "Se você Invocou um monstro por Invocação-Normal neste turno, você pode Invocar este card da sua mão por Invocação-Especial. Você pode oferecer este card como Tributo para destruir 1 monstro que seu oponente controla que tenha batalhado com um dos seus monstros neste turno."
- nome: "Mist Valley Watcher"
  texto: "Descendant of a family that has served as Mist Valley watchman over the generations. Never missed a single thing that happened in the valley, no matter how minute."
  texto_pt: "Descendente de uma família que serve como vigia do Vale da Névoa há gerações. Nunca deixou passar nada do que aconteceu no vale, por menor que fosse."
- nome: "X-Saber Galahad"
  texto: "If this card attacks an opponent's monster, this card gains 300 ATK during the Damage Step only. If this card is attacked by an opponent's monster, this card loses 500 ATK during the Damage Step only. When this card is selected as an attack target, you can Tribute another \"Saber\" monster to negate the attack."
  texto_pt: "Se este card atacar um monstro do oponente, ele ganha 300 de ATK, somente durante a Etapa de Dano. Se este card for atacado por um monstro do oponente, ele perde 500 de ATK, somente durante a Etapa de Dano. Quando este card for escolhido como alvo de ataque, você pode oferecer como Tributo outro monstro \"Sabre\" para negar o ataque."
- nome: "X-Saber Wayne"
  texto: "1 Tuner + 1 or more non-Tuner monsters\nWhen this card is Synchro Summoned, you can Special Summon 1 Level 4 or lower Warrior-Type monster from your hand."
  texto_pt: "1 Regulador + 1 ou mais monstros não-Reguladores\nQuando este card for Invocado por Invocação-Sincro, você pode Invocar por Invocação-Especial 1 monstro do Tipo Guerreiro de Nível 4 ou menos da sua mão."
- nome: "Burst Impact"
  texto: "You can activate this card when a \"Elemental Hero Burstinatrix\" is face-up on your side of the field. All cards on the field except \"Elemental Hero Burstinatrix\" are destroyed, and the destroyed monster's controller receives damage equal to the number of monsters destroyed x 300."
  texto_pt: "Você pode ativar este card quando houver um \"Elemental Hero Burstinatrix\" com a face para cima no seu lado do campo. Todos os cards no campo, exceto \"Elemental Hero Burstinatrix\", são destruídos, e o controlador dos monstros destruídos sofre dano igual ao número de monstros destruídos x 300."
- nome: "Elemental HERO Wildedge"
  texto: "\"Elemental HERO Wildheart\" + \"Elemental HERO Bladedge\"\nMust be Fusion Summoned. This card can attack all monsters your opponent controls, once each."
  texto_pt: "\"Coração Selvagem, o HERÓI do Elemento\" + \"Lâmina Afiada, o HERÓI do Elemento\"\nDeve ser Invocado por Invocação-Fusão. Este card pode atacar uma vez cada monstro que seu oponente controla."
- nome: "Edge Hammer"
  texto: "Tribute 1 \"Elemental HERO Bladedge\" to target 1 monster your opponent controls; destroy that target and inflict damage to your opponent equal to that target's original ATK."
  texto_pt: "Ofereça como Tributo 1 \"Lâmina Afiada, o HERÓI do Elemento\" para escolher 1 monstro que seu oponente controla; destrua o alvo e cause ao seu oponente dano igual ao ATK original do alvo."
- nome: "Elemental HERO Captain Gold"
  texto: "You can discard this card to the Graveyard; add 1 \"Skyscraper\" from your Deck to your hand. If \"Skyscraper\" is not face-up on the field, destroy this card."
  texto_pt: "Você pode descartar este card para o Cemitério; adicione 1 \"Arranha-Céu\" do seu Deck à sua mão. Se \"Arranha-Céu\" não estiver com a face para cima no campo, destrua este card."
- nome: "Elemental HERO Terra Firma"
  texto: "\"Elemental HERO Ocean\" + \"Elemental HERO Woodsman\"\nMust be Fusion Summoned and cannot be Special Summoned by other ways. You can Tribute 1 face-up \"Elemental HERO\" monster; this card gains ATK equal to the Tributed monster's ATK, until the End Phase."
  texto_pt: "\"Oceano, o HERÓI do Elemento\" + \"Lenhador, o HERÓI do Elemento\"\nDeve ser Invocado por Invocação-Fusão e não pode ser Invocado por Invocação-Especial de outras formas. Você pode oferecer como Tributo 1 monstro \"HERÓI do Elemento\" com a face para cima; este card ganha ATK igual ao ATK do monstro oferecido como Tributo, até a Fase Final."
- nome: "Feather Wind"
  texto: "When a Spell/Trap Card is activated while you control a face-up \"Elemental HERO Avian\": Negate the activation and destroy it."
  texto_pt: "Quando um Card de Magia/Armadilha for ativado enquanto você controlar um \"Aviário, o HERÓI do Elemento\" com a face para cima: negue a ativação e destrua-o."
- nome: "Mirror Gate"
  texto: "When an opponent's monster declares an attack targeting a face-up \"Elemental HERO\" monster you control: Switch control of the opponent's attacking monster with the targeted monster you control, then calculate damage. Control of both monsters switches back during the End Phase."
  texto_pt: "Quando um monstro do oponente declarar um ataque contra um monstro \"HERÓI do Elemento\" com a face para cima que você controla: troque o controle do monstro atacante do oponente pelo do monstro que você controla escolhido como alvo e, depois, calcule o dano. Durante a Fase Final, o controle dos dois monstros volta ao normal."
- nome: "Bubble Blaster"
  texto: "You can only equip this card to \"Elemental Hero Bubbleman\". Increase the ATK of the equipped monster by 800 points. If the equipped monster would be destroyed as a result of battle, destroy this card instead, and make the Battle Damage to the controller of the equipped monster 0."
  texto_pt: "Você só pode equipar este card a \"Elemental Hero Bubbleman\". Aumente o ATK do monstro equipado em 800. Se o monstro equipado fosse ser destruído em batalha, em vez disso, destrua este card, e o dano de batalha ao controlador do monstro equipado passa a ser 0."
- nome: "Bubble Illusion"
  texto: "You can only activate this card while there is a face-up \"Elemental Hero Bubbleman\" on your side of the field. During this turn, you can activate 1 Trap Card from your hand."
  texto_pt: "Você só pode ativar este card enquanto houver um \"Elemental Hero Bubbleman\" com a face para cima no seu lado do campo. Durante este turno, você pode ativar 1 Card de Armadilha da sua mão."
- nome: "Burst Return"
  texto: "If you control a face-up \"Elemental HERO Burstinatrix\": Return all face-up \"Elemental HERO\" monsters on the field to the hand, except \"Elemental HERO Burstinatrix\"."
  texto_pt: "Se você controlar um \"Burstinatrix, o HERÓI do Elemento\" com a face para cima: devolva para a mão todos os monstros \"HERÓI do Elemento\" com a face para cima no campo, exceto \"Burstinatrix, o HERÓI do Elemento\"."
- nome: "Change of Hero - Reflector Ray"
  texto: "When an \"Elemental HERO\" Fusion Monster you control is destroyed by battle and sent to the Graveyard: Inflict damage to your opponent equal to its original Level x 300."
  texto_pt: "Quando um Monstro de Fusão \"HERÓI do Elemento\" que você controla for destruído em batalha e enviado para o Cemitério: cause ao seu oponente dano igual ao Nível original dele x 300."
- nome: "Clay Charge"
  texto: "When an \"Elemental HERO Clayman\" you control is targeted for an attack (even if it is face-down, but reveal it to your opponent in that case): Destroy the attacking monster and that \"Elemental HERO Clayman\", and inflict 800 damage to your opponent."
  texto_pt: "Quando um \"Clayman, o HERÓI do Elemento\" que você controla for escolhido como alvo de um ataque (mesmo que esteja com a face para baixo; nesse caso, revele-o ao seu oponente): destrua o monstro atacante e esse \"Clayman, o HERÓI do Elemento\" e cause 800 de dano ao seu oponente."
- nome: "Cyclone Boomerang"
  texto: "Equip only to \"Elemental HERO Wildheart\". It gains 500 ATK. When the equipped monster is destroyed by a card effect and sent to the Graveyard: Destroy all Spell and Trap Cards on the field, then inflict 100 damage to your opponent for each Spell/Trap Card destroyed by this effect."
  texto_pt: "Equipe somente a \"Coração Selvagem, o HERÓI do Elemento\". Ele ganha 500 de ATK. Quando o monstro equipado for destruído pelo efeito de um card e enviado para o Cemitério: destrua todos os Cards de Magia e de Armadilha no campo e, depois, cause 100 de dano ao seu oponente para cada Card de Magia/Armadilha destruído por este efeito."
- nome: "Elemental HERO Inferno"
  texto: "\"Elemental HERO Heat\" + \"Elemental HERO Lady Heat\"\nMust be Fusion Summoned and cannot be Special Summoned by other ways. If this card battles a WATER monster, this card gains 1000 ATK during the Damage Step only."
  texto_pt: "\"Calor, o HERÓI do Elemento\" + \"Elemental HERO Lady Heat\"\nDeve ser Invocado por Invocação-Fusão e não pode ser Invocado por Invocação-Especial de outras formas. Se este card batalhar com um monstro de ÁGUA, este card ganha 1000 de ATK, somente durante a Etapa de Dano."
- nome: "Elemental HERO Knospe"
  texto: "Each time this card inflicts Battle Damage to your opponent: It gains 100 ATK and loses 100 DEF. While you control another face-up \"Elemental HERO\" monster, your opponent cannot target this card for an attack, and this card can attack your opponent directly."
  texto_pt: "Sempre que este card causar dano de batalha ao seu oponente: ele ganha 100 de ATK e perde 100 de DEF. Enquanto você controlar outro monstro \"HERÓI do Elemento\" com a face para cima, seu oponente não pode escolher este card como alvo de ataque, e este card pode atacar o seu oponente diretamente."
- nome: "Elemental HERO Lady Heat"
  texto: "During each of your End Phases: Inflict 200 damage to your opponent for each face-up \"Elemental HERO\" monster you control."
  texto_pt: "Durante cada uma das suas Fases Finais: cause 200 de dano ao seu oponente para cada monstro \"HERÓI do Elemento\" com a face para cima que você controla."
- nome: "Elemental HERO Mudballman"
  texto: "\"Elemental HERO Bubbleman\" + \"Elemental HERO Clayman\"\nMust be Fusion Summoned and cannot be Special Summoned by other ways."
  texto_pt: "\"Homem Bolha, o HERÓI do Elemento\" + \"Clayman, o HERÓI do Elemento\"\nDeve ser Invocado por Invocação-Fusão e não pode ser Invocado por Invocação-Especial de outras formas."
- nome: "Elemental HERO Neo Bubbleman"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except by sending an \"Elemental Hero Bubbleman\" you control and \"Metamorphosis\" in your hand to the Graveyard. This card's name is treated as \"Elemental Hero Bubbleman\" while it is face-up on the field. Destroy an opponent's monster that battles this card at the end of the Damage Step."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto enviando para o Cemitério um \"Elemental Hero Bubbleman\" que você controla e um \"Metamorfose\" da sua mão. O nome deste card é tratado como \"Elemental Hero Bubbleman\" enquanto ele estiver com a face para cima no campo. Destrua um monstro do oponente que batalhar com este card no fim da Etapa de Dano."
- nome: "Elemental HERO Poison Rose"
  texto: "Cannot be Normal Summoned or Set. Must be Special Summoned with \"Rose Bud\" and cannot be Special Summoned by other ways. Each time this card inflicts Battle Damage to your opponent: It gains 200 ATK and loses 200 DEF. Your opponent can only target \"Elemental HERO Poison Rose\" for attacks."
  texto_pt: "Não pode ser Invocado por Invocação-Normal nem Baixado. Deve ser Invocado por Invocação-Especial com \"Botão de Rosa\" e não pode ser Invocado por Invocação-Especial de outras formas. Sempre que este card causar dano de batalha ao seu oponente: ele ganha 200 de ATK e perde 200 de DEF. Seu oponente só pode escolher \"Elemental HERO Poison Rose\" como alvo de ataques."
- nome: "Elemental HERO Storm Neos"
  texto: "\"Elemental HERO Neos\" + \"Neo-Spacian Air Hummingbird\" + \"Neo-Spacian Aqua Dolphin\"\nMust first be Special Summoned (from your Extra Deck) by shuffling the above cards you control into the Deck. Once per turn: You can destroy all Spells and Traps on the field. Once per turn, during the End Phase: Return this card to the Extra Deck. If this card is returned into the Extra Deck this way: Shuffle all cards on the field into the Deck."
  texto_pt: "\"Neos, o HERÓI do Elemento\" + \"Beija-flor do Ar Neoespacial\" + \"Golfinho Aqua Neoespacial\"\nDeve primeiro ser Invocado por Invocação-Especial (do seu Deck Adicional) embaralhando no Deck os cards acima que você controla. Uma vez por turno: você pode destruir todas as Magias e Armadilhas no campo. Uma vez por turno, durante a Fase Final: devolva este card para o Deck Adicional. Se este card for devolvido para o Deck Adicional dessa forma: embaralhe no Deck todos os cards no campo."
- nome: "Elemental Recharge"
  texto: "Gain 1000 Life Points for each face-up \"Elemental HERO\" monster you control."
  texto_pt: "Ganhe 1000 PV para cada monstro \"HERÓI do Elemento\" com a face para cima que você controla."
- nome: "Feather Shot"
  texto: "Target 1 face-up \"Elemental HERO Avian\" you control; during this turn, that target can attack a number of times equal to the number of monsters you control when this card resolves, but cannot attack directly, and other monsters you control cannot attack this turn."
  texto_pt: "Escolha 1 \"Aviário, o HERÓI do Elemento\" com a face para cima que você controla; durante este turno, o alvo pode atacar um número de vezes igual ao número de monstros que você controla quando este card for resolvido, mas não pode atacar diretamente, e os outros monstros que você controla não podem atacar neste turno."
- nome: "Hero Barrier"
  texto: "Negate 1 attack from an opponent's monster. You must control a face-up \"Elemental HERO\" monster to resolve this effect."
  texto_pt: "Negue 1 ataque de um monstro do oponente. Você precisa controlar um monstro \"HERÓI do Elemento\" com a face para cima para resolver este efeito."
- nome: "Hero Heart"
  texto: "Target 1 face-up \"Elemental HERO\" monster you control; halve its ATK until the end of this turn, but it can attack twice during this turn's Battle Phase."
  texto_pt: "Escolha 1 monstro \"HERÓI do Elemento\" com a face para cima que você controla; reduza o ATK dele à metade até o fim deste turno, mas ele pode atacar duas vezes durante a Fase de Batalha deste turno."
- nome: "Hero Spirit"
  texto: "During the Battle Phase, if an \"Elemental HERO\" monster you controlled was destroyed by battle this turn: Make the Battle Damage from 1 of your opponent's monsters 0."
  texto_pt: "Durante a Fase de Batalha, se um monstro \"HERÓI do Elemento\" que você controlava foi destruído em batalha neste turno: o dano de batalha de 1 dos monstros do seu oponente passa a ser 0."
- nome: "Light Laser"
  texto: "Equip only to a LIGHT Warrior-Type monster. Remove from play any monsters that battle with it at the end of Damage Step."
  texto_pt: "Equipe somente a um monstro do Tipo Guerreiro de LUZ. Bana qualquer monstro que batalhar com ele no fim da Etapa de Dano."
- nome: "Rose Bud"
  texto: "Tribute 1 \"Elemental HERO Knospe\"; Special Summon 1 \"Elemental HERO Poison Rose\" from your hand or Deck."
  texto_pt: "Ofereça como Tributo 1 \"Elemental HERO Knospe\"; Invoque por Invocação-Especial 1 \"Elemental HERO Poison Rose\" da sua mão ou do seu Deck."
- nome: "Terra Firma Gravity"
  texto: "During your opponent's Battle Phase, if you control \"Elemental HERO Terra Firma\": This turn, all Level 4 or lower monsters your opponent controls that can attack a face-up \"Elemental HERO Terra Firma\" you control must attack it, and cannot otherwise attack."
  texto_pt: "Durante a Fase de Batalha do seu oponente, se você controlar \"Elemental HERO Terra Firma\": neste turno, todos os monstros de Nível 4 ou menos que seu oponente controla que puderem atacar um \"Elemental HERO Terra Firma\" com a face para cima que você controla devem atacá-lo e não podem atacar de outra forma."
- nome: "Fatal Abacus"
  texto: "Each time 1 monster is sent from the field to the Graveyard, inflict 500 points of damage per card to the respective card owner's Life Points."
  texto_pt: "Sempre que 1 monstro for enviado do campo para o Cemitério, cause 500 de dano por card aos PV do respectivo dono."
- nome: "Magical Thorn"
  texto: "When your opponent's card(s) in their hand are discarded to the Graveyard, inflict 500 points of damage to their Life Points for each card that was discarded."
  texto_pt: "Quando um ou mais cards da mão do seu oponente forem descartados para o Cemitério, cause 500 de dano aos PV dele para cada card descartado."
- nome: "Ominous Fortunetelling"
  texto: "During your Standby Phase, select 1 random card from your opponent's hand. Call the type of card (Monster, Spell, or Trap). If you call it right, inflict 700 points of damage to your opponent's Life Points. You can use this effect only once per turn."
  texto_pt: "Durante a sua Fase de Apoio, escolha 1 card aleatório da mão do seu oponente. Declare o tipo do card (Monstro, Magia ou Armadilha). Se acertar, cause 700 de dano aos PV do seu oponente. Você só pode usar este efeito uma vez por turno."
- nome: "Castle Gate"
  texto: "This card cannot be destroyed by battle. Once per turn, if this card is in face-up Attack Position, you can Tribute 1 Level 5 or lower monster to inflict damage to your opponent equal to that monster's original ATK."
  texto_pt: "Este card não pode ser destruído em batalha. Uma vez por turno, se este card estiver em Posição de Ataque com a face para cima, você pode oferecer como Tributo 1 monstro de Nível 5 ou menos para causar ao seu oponente dano igual ao ATK original desse monstro."
- nome: "Catapult Turtle"
  texto: "You can Tribute 1 monster to inflict damage equal to half of its ATK to your opponent."
  texto_pt: "Você pode oferecer 1 monstro como Tributo para causar ao seu oponente dano igual à metade do ATK dele."
- nome: "Evil Blast"
  texto: "Activate only when a monster is Special Summoned to your opponent's side of the field. Equip this card to that monster. It gains 500 ATK. During each of your opponent's Standby Phases, inflict 500 damage to your opponent."
  texto_pt: "Ative somente quando um monstro for Invocado por Invocação-Especial no lado do campo do seu oponente. Equipe este card a esse monstro. Ele ganha 500 de ATK. Durante cada uma das Fases de Apoio do seu oponente, cause 500 de dano ao seu oponente."
- nome: "Full Salvo"
  texto: "Send your entire hand to the GY, and if you do, inflict 200 damage to your opponent for each card sent to the GY by this effect."
  texto_pt: "Envie a sua mão inteira para o Cemitério e, se fizer isso, cause 200 de dano ao seu oponente para cada card enviado para o Cemitério por este efeito."
- nome: "Graverobber's Retribution"
  texto: "During each of your Standby Phases, inflict 100 points of damage to your opponent's Life Points for each of your opponent's monsters that have been removed from play."
  texto_pt: "Durante cada uma das suas Fases de Apoio, cause 100 de dano aos PV do seu oponente para cada monstro do seu oponente que tenha sido banido."
- nome: "Linear Accelerator Cannon"
  texto: "Tribute 1 monster and inflict damage to your opponent equal to half that monster's original ATK. If you activate this card, you cannot activate any other Spell Cards this turn."
  texto_pt: "Ofereça 1 monstro como Tributo e cause ao seu oponente dano igual à metade do ATK original desse monstro. Se você ativar este card, não pode ativar nenhum outro Card de Magia neste turno."
- nome: "Mecha Bunny"
  texto: "When this card is flipped face-up, select 1 card on the field and inflict 500 damage to its controller. When this card is destroyed by battle and sent to the Graveyard, you can Special Summon 1 \"Mecha Bunny\" from your Deck in face-down Defense Position."
  texto_pt: "Quando este card for virado com a face para cima, escolha 1 card no campo e cause 500 de dano ao controlador dele. Quando este card for destruído em batalha e enviado para o Cemitério, você pode Invocar por Invocação-Especial 1 \"Mecha Bunny\" do seu Deck em Posição de Defesa com a face para baixo."
- nome: "Mirage Tube"
  texto: "This card cannot be activated from your hand. Activate only when a face-up monster you control is selected as an attack target. Inflict 1000 damage to your opponent."
  texto_pt: "Este card não pode ser ativado da sua mão. Ative somente quando um monstro com a face para cima que você controla for escolhido como alvo de ataque. Cause 1000 de dano ao seu oponente."
- nome: "Poison Mummy"
  texto: "FLIP: Inflict 500 damage to your opponent."
  texto_pt: "VIRE: cause 500 de dano ao seu oponente."
- nome: "Pursuit Chaser"
  texto: "When a Defense Position monster is destroyed by battle and sent to the Graveyard, inflict 500 damage to your opponent."
  texto_pt: "Quando um monstro em Posição de Defesa for destruído em batalha e enviado para o Cemitério, cause 500 de dano ao seu oponente."
- nome: "Raimei"
  texto: "Decrease your opponent's Life Points by 300 points."
  texto_pt: "Reduza os PV do seu oponente em 300."
- nome: "Bad Reaction to Simochi"
  texto: "As long as this card remains face-up on the field, any effect of increasing your opponent's Life Points is changed to inflict the same amount of points in damage to your opponent's Life Points."
  texto_pt: "Enquanto este card estiver com a face para cima no campo, qualquer efeito que aumente os PV do seu oponente passa a causar a mesma quantidade em dano aos PV do seu oponente."
- nome: "Fire Princess"
  texto: "Each time you gain Life Points, inflict 500 damage to your opponent."
  texto_pt: "Sempre que você ganhar PV, cause 500 de dano ao seu oponente."
- nome: "Gift Card"
  texto: "Your opponent gains 3000 Life Points."
  texto_pt: "Seu oponente ganha 3000 PV."
- nome: "Life Absorbing Machine"
  texto: "During your Standby Phase, gain Life Points equal to half of the total Life Points you paid during your last turn."
  texto_pt: "Durante a sua Fase de Apoio, ganhe PV iguais à metade do total de PV que você pagou durante o seu último turno."
- nome: "Blue Medicine"
  texto: "Increase your Life Points by 400 points."
  texto_pt: "Aumente os seus PV em 400."
- nome: "Cure Mermaid"
  texto: "As long as this card remains face-up on your side of the field, increase your Life Points by 800 points during each of your Standby Phases."
  texto_pt: "Enquanto este card estiver com a face para cima no seu lado do campo, aumente os seus PV em 800 durante cada uma das suas Fases de Apoio."
- nome: "Dancing Fairy"
  texto: "As long as this card remains in face-up Defense Position on your side of the field, increase your Life Points by 1000 points during each of your Standby Phases."
  texto_pt: "Enquanto este card estiver em Posição de Defesa com a face para cima no seu lado do campo, aumente os seus PV em 1000 durante cada uma das suas Fases de Apoio."
- nome: "Healing Wave Generator"
  texto: "Once per turn, you can select another face-up monster you control to gain Life Points equal to that monster's Level x 100."
  texto_pt: "Uma vez por turno, você pode escolher outro monstro com a face para cima que você controla para ganhar PV iguais ao Nível desse monstro x 100."
- nome: "Hysteric Fairy"
  texto: "Tribute 2 monsters on your side of the field to increase your Life Points by 1000 points."
  texto_pt: "Ofereça como Tributo 2 monstros no seu lado do campo para aumentar os seus PV em 1000."
- nome: "Mooyan Curry"
  texto: "Choose 1 player; that player gains 200 Life Points."
  texto_pt: "Escolha 1 duelista; esse duelista ganha 200 PV."
- nome: "Royal Knight"
  texto: "When this card destroys a monster by battle and sends it to the Graveyard, gain Life Points equal to the DEF of the destroyed monster."
  texto_pt: "Quando este card destruir um monstro em batalha e enviá-lo para o Cemitério, ganhe PV iguais à DEF do monstro destruído."
- nome: "Soul of the Pure"
  texto: "Increase your Life Points by 800 points."
  texto_pt: "Aumente os seus PV em 800."
- nome: "Spirit of the Breeze"
  texto: "As long as this card remains in face-up Attack Position on your side of the field, increase your Life Points by 1000 points during each of your Standby Phases."
  texto_pt: "Enquanto este card estiver em Posição de Ataque com a face para cima no seu lado do campo, aumente os seus PV em 1000 durante cada uma das suas Fases de Apoio."
- nome: "Spring of Rebirth"
  texto: "Increase your Life Points by 500 points every time monsters return from the field to the owner's hand."
  texto_pt: "Aumente os seus PV em 500 sempre que monstros voltarem do campo para a mão do dono."
- nome: "Stray Asmodian"
  texto: "When this card is destroyed and sent to the Graveyard by battle, both players gain 800 Life Points."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, os dois duelistas ganham 800 PV."
- nome: "Tongue Twister"
  texto: "If this card was Tribute Summoned, when it is sent from the field to the Graveyard, draw 2 cards and remove this card from play."
  texto_pt: "Se este card foi Invocado por Invocação-Tributo, quando ele for enviado do campo para o Cemitério, compre 2 cards e bana este card."
- nome: "Crush Card Virus"
  texto: "Tribute 1 DARK monster with 1000 or less ATK. Check all monsters on your opponent's side of the field, your opponent's hand, and all cards they draw (until the end of your opponent's 3rd turn after this card's activation), and destroy all monsters with 1500 or more ATK."
  texto_pt: "Ofereça como Tributo 1 monstro de TREVAS com 1000 ou menos de ATK. Verifique todos os monstros no lado do campo do seu oponente, na mão dele e todos os cards que ele comprar (até o fim do 3º turno do seu oponente depois da ativação deste card) e destrua todos os monstros com 1500 ou mais de ATK."
- nome: "Defense Draw"
  texto: "During your opponent's turn, at damage calculation: Make the battle damage you take from this battle 0, and if you do, draw 1 card."
  texto_pt: "Durante o turno do seu oponente, no cálculo de dano: o dano de batalha que você sofreria nesta batalha passa a ser 0 e, se isso acontecer, compre 1 card."
- nome: "Destructive Draw"
  texto: "If either player has no cards in their hand at the start of their Draw Phase, they can draw 1 more card in addition to their normal draw. This card's controller loses 700 Life Points during their End Phase. (If less than 700, they become 0 instead.) When this face-up card is removed from the field, inflict 3000 damage to the player who controlled it."
  texto_pt: "Se um duelista não tiver cards na mão no início da Fase de Compra dele, ele pode comprar 1 card a mais além da compra normal. O controlador deste card perde 700 PV durante a Fase Final dele. (Se tiver menos de 700, os PV dele passam a ser 0.) Quando este card com a face para cima sair do campo, cause 3000 de dano ao duelista que o controlava."
- nome: "DNA Checkup"
  texto: "Select 1 face-down monster you control. Your opponent declares 2 Attributes. Reveal the selected monster. If its Attribute is one of the declared Attributes, your opponent draws 2 cards. If not, you draw 2 cards."
  texto_pt: "Escolha 1 monstro com a face para baixo que você controla. Seu oponente declara 2 Atributos. Revele o monstro escolhido. Se o Atributo dele for um dos declarados, seu oponente compra 2 cards. Caso contrário, você compra 2 cards."
- nome: "Goblin Decoy Squad"
  texto: "When this card inflicts Battle Damage to your opponent, you can draw 1 card. If this card attacks, it is changed to Defense Position at the end of the Battle Phase. This card's battle position cannot be changed until the end of your next turn, except with a card effect."
  texto_pt: "Quando este card causar dano de batalha ao seu oponente, você pode comprar 1 card. Se este card atacar, ele muda para Posição de Defesa no fim da Fase de Batalha. A posição de batalha deste card não pode mudar até o fim do seu próximo turno, exceto pelo efeito de um card."
- nome: "Hino-Kagu-Tsuchi"
  texto: "Cannot be Special Summoned. During the End Phase of the turn this card is Normal Summoned or flipped face-up: Return it to the hand. If this card inflicts battle damage to your opponent: They discard their entire hand during the Draw Phase of the next turn, before the turn player draws."
  texto_pt: "Não pode ser Invocado por Invocação-Especial. Durante a Fase Final do turno em que este card for Invocado por Invocação-Normal ou virado com a face para cima: devolva-o para a mão. Se este card causar dano de batalha ao seu oponente: ele descarta a mão inteira durante a Fase de Compra do próximo turno, antes de o duelista do turno comprar."
- nome: "Legacy of Yata-Garasu"
  texto: "Activate 1 of these effects:\n● Draw 1 card.\n● Activate only if your opponent controls a face-up Spirit monster. Draw 2 cards."
  texto_pt: "Ative 1 destes efeitos:\n● Compre 1 card.\n● Ative somente se seu oponente controlar um monstro Espírito com a face para cima. Compre 2 cards."
- nome: "Mystical Cards of Light"
  texto: "You cannot use 1 of your Spell & Trap Card Zones. During your Draw Phase, if you control another \"Mystical Cards of Light\", you can draw 2 cards instead of 1 for your normal draw."
  texto_pt: "Você não pode usar 1 das suas Zonas de Magias e Armadilhas. Durante a sua Fase de Compra, se você controlar outro \"Mystical Cards of Light\", você pode comprar 2 cards em vez de 1 na compra normal."
- nome: "The Gift of Greed"
  texto: "Your opponent draws 2 cards."
  texto_pt: "Seu oponente compra 2 cards."
- nome: "Alchemy Cycle"
  texto: "The original ATK of all face-up monsters you control becomes 0, until the End Phase. Each time a monster that had its original ATK reduced to 0 by this effect is destroyed by battle and sent to the Graveyard, draw 1 card."
  texto_pt: "O ATK original de todos os monstros com a face para cima que você controla passa a ser 0 até a Fase Final. Sempre que um monstro que teve o ATK original reduzido a 0 por este efeito for destruído em batalha e enviado para o Cemitério, compre 1 card."
- nome: "Dark Spirit Art - Greed"
  texto: "Tribute 1 DARK monster. Draw 2 cards. Your opponent can negate this effect by revealing 1 Spell Card in their hand."
  texto_pt: "Ofereça como Tributo 1 monstro de TREVAS. Compre 2 cards. Seu oponente pode negar este efeito revelando 1 Card de Magia da mão dele."
- nome: "Gemini Imps"
  texto: "During either player's turn, when your opponent activates a Spell Card, Trap Card, or monster effect that could make you discard when it resolves: You can send this card from your hand to the Graveyard; negate the activation, and if you do, destroy it. Then draw 1 card."
  texto_pt: "Durante o turno de qualquer duelista, quando seu oponente ativar um Card de Magia, Card de Armadilha ou efeito de monstro que possa fazer você descartar quando for resolvido: você pode enviar este card da sua mão para o Cemitério; negue a ativação e, se fizer isso, destrua-o. Depois, compre 1 card."
- nome: "Guard Penalty"
  texto: "Select 1 monster on the field. If it is changed to Defense Position this turn, draw 1 card."
  texto_pt: "Escolha 1 monstro no campo. Se ele mudar para Posição de Defesa neste turno, compre 1 card."
- nome: "Introduction to Gallantry"
  texto: "Activate only when your opponent has 5 or more cards in their hand. Your opponent discards 1 random card."
  texto_pt: "Ative somente quando seu oponente tiver 5 ou mais cards na mão. Seu oponente descarta 1 card aleatório."
- nome: "Terrible Deal"
  texto: "Activate only by paying 1000 Life Points when your opponent activates a Spell Card. Your opponent discards 1 random card."
  texto_pt: "Ative somente pagando 1000 PV quando seu oponente ativar um Card de Magia. Seu oponente descarta 1 card aleatório."
- nome: "The Secret of the Bandit"
  texto: "This card can only be activated during Main Phase 1. Select 1 face-up monster on the field. Each time the selected monster inflicts Battle Damage to your opponent's Life Points this turn, your opponent discards 1 random card."
  texto_pt: "Este card só pode ser ativado durante a Fase Principal 1. Escolha 1 monstro com a face para cima no campo. Sempre que o monstro escolhido causar dano de batalha aos PV do seu oponente neste turno, seu oponente descarta 1 card aleatório."
- nome: "Treasure Map"
  texto: "You can only activate this card in response to the activation of an effect that would return this card from the field to the hand. Draw 2 cards from your Deck and discard 1 card from your hand."
  texto_pt: "Você só pode ativar este card em resposta à ativação de um efeito que devolveria este card do campo para a mão. Compre 2 cards do seu Deck e descarte 1 card da sua mão."
- nome: "Vengeful Shinobi"
  texto: "When this face-up Attack Position card is targeted for an attack: Draw 1 card."
  texto_pt: "Quando este card em Posição de Ataque com a face para cima for escolhido como alvo de um ataque: compre 1 card."
- nome: "Yamata Dragon"
  texto: "This card cannot be Special Summoned. This card returns to its owner's hand during the End Phase of the turn it is Normal Summoned or flipped face-up. When this card inflicts Battle Damage to your opponent, draw cards until you have 5 cards in your hand."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card volta para a mão do dono durante a Fase Final do turno em que for Invocado por Invocação-Normal ou virado com a face para cima. Quando este card causar dano de batalha ao seu oponente, compre cards até ficar com 5 cards na mão."
- nome: "Amazoness Arena"
  texto: "When this card is activated, increase the Life Points of both players by 600 points. Each time a player declares an attack with a monster, they can pay 100 Life Points to inflict 100 points of damage to the opponent's Life Points at the end of the Damage Step."
  texto_pt: "Quando este card for ativado, aumente os PV dos dois duelistas em 600. Sempre que um duelista declarar um ataque com um monstro, ele pode pagar 100 PV para causar 100 de dano aos PV do oponente no fim da Etapa de Dano."
- nome: "Armament of the Lethal Lords"
  texto: "This card cannot be Special Summoned. This card must be Tribute Summoned by Tributing 3 Warrior-Type monsters on your side of the field. If this card attacks your opponent's Life Points directly and makes them 0, the controller of this card wins the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card deve ser Invocado por Invocação-Tributo oferecendo como Tributo 3 monstros do Tipo Guerreiro no seu lado do campo. Se este card atacar os PV do seu oponente diretamente e reduzi-los a 0, o controlador deste card vence a Partida."
- nome: "Dark Arena"
  texto: "Both players select the attack targets for their opponent. All face-up monsters on the field must attack when possible."
  texto_pt: "Os dois duelistas escolhem os alvos de ataque do oponente. Todos os monstros com a face para cima no campo devem atacar, se possível."
- nome: "Dark Scorpion - Tragedy of Love"
  texto: "You can only activate this card when there are \"Don Zaloog\"and \"Dark Scorpion - Meanae the Thorn\" face-up on your side of the field. Send 1 \"Dark Scorpion - Meanae the Thorn\" from your side of your field to the Graveyard to destroy all of your opponent's monsters."
  texto_pt: "Você só pode ativar este card quando houver \"Dom Zaloog\" e \"Escorpião das Trevas - Meanae o Espinho\" com a face para cima no seu lado do campo. Envie 1 \"Escorpião das Trevas - Meanae o Espinho\" do seu lado do campo para o Cemitério para destruir todos os monstros do seu oponente."
- nome: "Dark Scorpion Retreat"
  texto: "You can only activate this card when you have either \"Don Zaloog\", \"Cliff the Trap Remover\", \"Dark Scorpion - Chick the Yellow\", \"Dark Scorpion - Gorg the Strong\", and \"Dark Scorpion - Meanae the Thorn\" face-up on your side of the field. Return them to their owner's hands."
  texto_pt: "Você só pode ativar este card quando tiver \"Dom Zaloog\", \"Cliff the Trap Remover\", \"Escorpião das Trevas - Chick o Cobarde\", \"Escorpião das Trevas - Gorg o Forte\" e \"Escorpião das Trevas - Meanae o Espinho\" com a face para cima no seu lado do campo. Devolva-os para a mão dos donos."
- nome: "Defense Maiden"
  texto: "You can only activate this card while there is a face-up \"Maiden in Love\" on your side of the field. When your opponent attacks one of your monsters, you can change the target of that attack to a face-up \"Maiden in Love\" on your side of the field."
  texto_pt: "Você só pode ativar este card enquanto houver um \"Donzela Apaixonada\" com a face para cima no seu lado do campo. Quando seu oponente atacar um dos seus monstros, você pode mudar o alvo desse ataque para um \"Donzela Apaixonada\" com a face para cima no seu lado do campo."
- nome: "Dizzy Angel"
  texto: "This card is not destroyed by the effect of \"Flipping the Table\"."
  texto_pt: "Este card não é destruído pelo efeito de \"Flipping the Table\"."
- nome: "Dizzy Tiger"
  texto: "Negate the effect of face-down Defense Position Flip Effect Monsters attacked by this card."
  texto_pt: "Negue o efeito dos Monstros de Efeito de Virar em Posição de Defesa com a face para baixo atacados por este card."
- nome: "Flipping the Table"
  texto: "You can only use this card's effect while a monster that includes \"Dizzy\" in its card name is face-up on your side of the field. Destroy all cards except this card on your side of the field. Select and destroy cards on your opponent's field equal to the number of cards you have destroyed by this effect. You cannot Normal Summon or Set a monster the turn you use this effect."
  texto_pt: "Você só pode usar o efeito deste card enquanto houver um monstro com \"Dizzy\" no nome com a face para cima no seu lado do campo. Destrua todos os cards no seu lado do campo, exceto este card. Escolha e destrua cards no campo do seu oponente em quantidade igual à de cards que você destruiu por este efeito. Você não pode Invocar por Invocação-Normal nem Baixar um monstro no turno em que usar este efeito."
- nome: "Happy Marriage"
  texto: "This card can only be activated while a face-up monster that is owned by your opponent is on your side of the field. Increase the ATK of the equipped monster by the ATK of that monster."
  texto_pt: "Este card só pode ser ativado enquanto houver no seu lado do campo um monstro com a face para cima cujo dono seja seu oponente. Aumente o ATK do monstro equipado no valor do ATK desse monstro."
- nome: "Hot Sauce Bottle"
  texto: "When this face-down card is destroyed and sent to the Graveyard, inflict 500 damage to your opponent."
  texto_pt: "Quando este card com a face para baixo for destruído e enviado para o Cemitério, cause 500 de dano ao seu oponente."
- nome: "King of Destruction - Xexex"
  texto: "This card cannot be Special Summoned. This card must be Tribute Summoned by Tributing 3 Fiend-Type monsters on your side of the field. If this card attacks your opponent's Life Points directly and makes them 0, the controller of this card wins the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card deve ser Invocado por Invocação-Tributo oferecendo como Tributo 3 monstros do Tipo Demônio no seu lado do campo. Se este card atacar os PV do seu oponente diretamente e reduzi-los a 0, o controlador deste card vence a Partida."
- nome: "Meteo the Matchless"
  texto: "This card cannot be Special Summoned. This card must be Tribute Summoned by offering 3 Beast-Warrior-Type monsters on your side of the field as Tributes. If this card attacks your opponent's Life Points directly and makes them 0, the controller of this card wins the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card deve ser Invocado por Invocação-Tributo oferecendo como Tributo 3 monstros do Tipo Besta-Guerreira no seu lado do campo. Se este card atacar os PV do seu oponente diretamente e reduzi-los a 0, o controlador deste card vence a Partida."
- nome: "Phantom Beast Cross-Wing"
  texto: "While this card is in the GY, all \"Phantom Beast\" monsters on the field gain 300 ATK."
  texto_pt: "Enquanto este card estiver no Cemitério, todos os monstros \"Besta Fantasma\" no campo ganham 300 de ATK."
- nome: "Phantom Beast Rock-Lizard"
  texto: "If you're Tributing a \"Phantom Beast\" monster or \"Gazelle the King of Mythical Beasts\", this card can be Normal Summoned with 1 Tribute. When this card destroys a monster by battle, inflict 500 damage to your opponent. When this card is destroyed and sent to the Graveyard by an opponent's card effect, inflict 2000 damage to your opponent."
  texto_pt: "Se você oferecer como Tributo um monstro \"Besta Fantasma\" ou \"Gazelle, o Rei das Bestas Místicas\", este card pode ser Invocado por Invocação-Normal com 1 Tributo. Quando este card destruir um monstro em batalha, cause 500 de dano ao seu oponente. Quando este card for destruído e enviado para o Cemitério pelo efeito de um card do oponente, cause 2000 de dano ao seu oponente."
- nome: "Queen of Fate - Eternia"
  texto: "This card cannot be Special Summoned. This card must be Tribute Summoned by Tributing 3 Fairy-Type monsters on your side of the field. If this card attacks your opponent's Life Points directly and makes them 0, the controller of this card wins the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card deve ser Invocado por Invocação-Tributo oferecendo como Tributo 3 monstros do Tipo Fada no seu lado do campo. Se este card atacar os PV do seu oponente diretamente e reduzi-los a 0, o controlador deste card vence a Partida."
- nome: "Testament of the Arcane Lords"
  texto: "This card cannot be Special Summoned. This card must be Tribute Summoned by Tributing 3 Spellcaster-Type monsters on your side of the field. If this card attacks your opponent's Life Points directly and makes them 0, the controller of this card wins the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card deve ser Invocado por Invocação-Tributo oferecendo como Tributo 3 monstros do Tipo Mago no seu lado do campo. Se este card atacar os PV do seu oponente diretamente e reduzi-los a 0, o controlador deste card vence a Partida."
- nome: "Ulevo"
  texto: "This card cannot be Special Summoned. This card must be Tribute Summoned by offering 3 Winged Beast-Type monsters on your side of the field as Tributes. If this card attacks your opponent's Life Points directly and makes them 0, the controller of this card wins the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card deve ser Invocado por Invocação-Tributo oferecendo como Tributo 3 monstros do Tipo Besta Alada no seu lado do campo. Se este card atacar os PV do seu oponente diretamente e reduzi-los a 0, o controlador deste card vence a Partida."
- nome: "Phantom Beast Thunder-Pegasus"
  texto: "When an opponent's monster declares an attack: You can banish this card from your GY, then target 1 \"Phantom Beast\" monster you control; that monster you control cannot be destroyed by battle this turn."
  texto_pt: "Quando um monstro do oponente declarar um ataque: você pode banir este card do seu Cemitério e, depois, escolher 1 monstro \"Besta Fantasma\" que você controla; esse monstro não pode ser destruído em batalha neste turno."
- nome: "Phantom Beast Wild-Horn"
  texto: "If this card attacks a Defense Position monster, inflict piercing battle damage."
  texto_pt: "Se este card atacar um monstro em Posição de Defesa, cause dano de batalha perfurante."
- nome: "Chimaera, the Master of Beasts"
  texto: "This card cannot be Special Summoned. This card must be Tribute Summoned by Tributing 3 Beast-Type monsters on your side of the field. If this card attacks your opponent's Life Points directly and makes them 0, the controller of this card wins the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Este card deve ser Invocado por Invocação-Tributo oferecendo como Tributo 3 monstros do Tipo Besta no seu lado do campo. Se este card atacar os PV do seu oponente diretamente e reduzi-los a 0, o controlador deste card vence a Partida."
- nome: "Doctor Cranium"
  texto: "When this card is destroyed by battle and sent to the Graveyard, you can pay 800 Life Points to add 1 Psychic-Type monster from your Deck to your hand."
  texto_pt: "Quando este card for destruído em batalha e enviado para o Cemitério, você pode pagar 800 PV para adicionar 1 monstro do Tipo Psíquico do seu Deck à sua mão."
- nome: "Lorelei, the Symphonic Arsenal"
  texto: "This card cannot be Special Summoned. To Tribute Summon this card, you must Tribute 3 Machine-Type monsters. If this card attacks your opponent directly and reduces their Life Points to 0, you win the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Para Invocar este card por Invocação-Tributo, você deve oferecer como Tributo 3 monstros do Tipo Máquina. Se este card atacar o seu oponente diretamente e reduzir os PV dele a 0, você vence a Partida."
- nome: "Mind Master"
  texto: "You can pay 800 Life Points and Tribute 1 Psychic-Type monster, except \"Mind Master\", to Special Summon 1 Level 4 or lower Psychic-Type monster from your Deck in face-up Attack Position."
  texto_pt: "Você pode pagar 800 PV e oferecer como Tributo 1 monstro do Tipo Psíquico, exceto \"Mestre da Mente\", para Invocar por Invocação-Especial 1 monstro do Tipo Psíquico de Nível 4 ou menos do seu Deck com a face para cima em Posição de Ataque."
- nome: "Mind Protector"
  texto: "This card's controller must pay 500 Life Points during each of their Standby Phases. If they cannot, destroy this card. Monsters with 2000 or less ATK cannot declare an attack, except for Psychic-Type monsters."
  texto_pt: "O controlador deste card deve pagar 500 PV durante cada uma das Fases de Apoio dele. Se não puder, destrua este card. Monstros com 2000 ou menos de ATK não podem declarar ataques, exceto monstros do Tipo Psíquico."
- nome: "Power Injector"
  texto: "Once per turn you can pay 600 Life Points to have all face-up Psychic-Type monsters gain 500 ATK during this turn."
  texto_pt: "Uma vez por turno, você pode pagar 600 PV para que todos os monstros do Tipo Psíquico com a face para cima ganhem 500 de ATK durante este turno."
- nome: "Psychic Commander"
  texto: "When a Psychic-Type monster you control battles, during the Damage Step you can pay Life Points in multiples of 100 (max. 500) to have the monster it's battling lose that much ATK and DEF, until the End Phase."
  texto_pt: "Quando um monstro do Tipo Psíquico que você controla batalhar, durante a Etapa de Dano, você pode pagar PV em múltiplos de 100 (máx. 500) para que o monstro com que ele está batalhando perca essa mesma quantidade de ATK e DEF até a Fase Final."
- nome: "Psychic Lifetrancer"
  texto: "1 Tuner + 1 or more non-Tuner monsters\nOnce per turn, you can remove from play 1 Psychic-Type monster from your Graveyard to gain 1200 Life Points."
  texto_pt: "1 Regulador + 1 ou mais monstros não-Reguladores\nUma vez por turno, você pode banir 1 monstro do Tipo Psíquico do seu Cemitério para ganhar 1200 PV."
- nome: "Psychic Rejuvenation"
  texto: "Gain 1000 Life Points for each face-up Psychic-Type monster you control."
  texto_pt: "Ganhe 1000 PV para cada monstro do Tipo Psíquico com a face para cima que você controla."
- nome: "Psychic Snail"
  texto: "You can pay 800 Life Points and select 1 other face-up Psychic-Type monster you control. That monster can attack twice during each Battle Phase. This card cannot attack the turn you activate this effect."
  texto_pt: "Você pode pagar 800 PV e escolher 1 outro monstro do Tipo Psíquico com a face para cima que você controla. Esse monstro pode atacar duas vezes durante cada Fase de Batalha. Este card não pode atacar no turno em que você ativar este efeito."
- nome: "Storm Caller"
  texto: "You can put your opponent's monsters that are destroyed by battle with other Psychic-Type monsters on top of their owner's Deck instead of sending them to the Graveyard. When this card is destroyed by a card effect, this card's controller takes damage equal to its original ATK."
  texto_pt: "Você pode colocar no topo do Deck do dono, em vez de enviar para o Cemitério, os monstros do seu oponente destruídos em batalha com outros monstros do Tipo Psíquico. Quando este card for destruído pelo efeito de um card, o controlador dele sofre dano igual ao ATK original deste card."
- nome: "Tyr, the Vanquishing Warlord"
  texto: "This card cannot be Special Summoned. To Tribute Summon this card, you must Tribute 3 Fairy-Type monsters. If this card attacks your opponent directly and reduces their Life Points to 0, you win the Match."
  texto_pt: "Este card não pode ser Invocado por Invocação-Especial. Para Invocar este card por Invocação-Tributo, você deve oferecer como Tributo 3 monstros do Tipo Fada. Se este card atacar o seu oponente diretamente e reduzir os PV dele a 0, você vence a Partida."
- nome: "Arcana Force VIII - The Strength"
  texto: "When this card is Summoned, toss a coin:\n●Heads: Take control of 1 monster your opponent controls.\n●Tails: Your opponent selects and takes control of 1 monster you control, except this card."
  texto_pt: "Quando este card for Invocado, jogue uma moeda:\n● Cara: assuma o controle de 1 monstro que seu oponente controla.\n● Coroa: seu oponente escolhe e assume o controle de 1 monstro que você controla, exceto este card."
- nome: "Arcana Force XII - The Hangman"
  texto: "When a card or effect is activated (Quick Effect): You can reveal this card in your hand; Special Summon 1 \"Arcana Force\" monster from your hand in Defense Position. You can only use this effect of \"Arcana Force XII - The Hangman\" once per turn. If this card is Summoned: Toss a coin.\n● Heads: Destroy 1 monster you control, and if you do, take damage equal to its original ATK.\n● Tails: Destroy 1 monster your opponent controls, and if you do, inflict damage to your opponent equal to its original ATK."
  texto_pt: "Quando um card ou efeito for ativado (Efeito Rápido): você pode revelar este card na sua mão; Invoque por Invocação-Especial 1 monstro \"Força Arcana\" da sua mão em Posição de Defesa. Você só pode usar este efeito de \"Arcana Force XII - The Hangman\" uma vez por turno. Se este card for Invocado: jogue uma moeda.\n● Cara: destrua 1 monstro que você controla e, se fizer isso, sofra dano igual ao ATK original dele.\n● Coroa: destrua 1 monstro que seu oponente controla e, se fizer isso, cause ao seu oponente dano igual ao ATK original dele."
- nome: "B.E.S. Assault Core"
  texto: "If your opponent controls a monster and you control no monsters, you can Special Summon this card from your hand."
  texto_pt: "Se seu oponente controlar um monstro e você não controlar nenhum, você pode Invocar este card da sua mão por Invocação-Especial."
- nome: "Crowning of the Emperor"
  texto: "By Tributing 1 \"Toy Soldier\" face-up on your side of the field, Special Summon 1 \"Toy Emperor\" from your hand or Deck."
  texto_pt: "Oferecendo como Tributo 1 \"Soldado de Brinquedo\" com a face para cima no seu lado do campo, Invoque por Invocação-Especial 1 \"Toy Emperor\" da sua mão ou do seu Deck."
- nome: "Cup of Ace"
  texto: "Toss a coin and apply this effect.\n● Heads: Draw 2 cards.\n● Tails: Your opponent draws 2 cards."
  texto_pt: "Jogue uma moeda e aplique este efeito.\n● Cara: compre 2 cards.\n● Coroa: seu oponente compra 2 cards."
- nome: "Infinite Fiend Mirror"
  texto: "While there is a face-up \"Load of Darkness\" on the field, Special Summon a \"Dark Creator Token\" in each of its owner's empty Monster Card Zone during each of their End Phases. It has the same Type, Attribute, Level, ATK and DEF as \"Load of Darkness\". When \"Load of Darkness\" on the field is destroyed, destroy all \"Dark Creator Token\"."
  texto_pt: "Enquanto houver um \"Load of Darkness\" com a face para cima no campo, durante cada uma das Fases Finais do dono dele, Invoque por Invocação-Especial uma \"Ficha de Criador das Trevas\" em cada Zona de Monstros vazia do dono. Ela tem o mesmo Tipo, Atributo, Nível, ATK e DEF de \"Load of Darkness\". Quando \"Load of Darkness\" no campo for destruído, destrua todas as \"Fichas de Criador das Trevas\"."
- nome: "Last Machine Acid Virus"
  texto: "Tribute 1 WATER monster. Check all monsters on your opponent's side of the field, your opponent's hand, and all cards they draw (until the end of your opponent's 3rd turn after this card's activation), and destroy all Machine-Type monsters."
  texto_pt: "Ofereça como Tributo 1 monstro de ÁGUA. Verifique todos os monstros no lado do campo do seu oponente, na mão dele e todos os cards que ele comprar (até o fim do 3º turno do seu oponente depois da ativação deste card) e destrua todos os monstros do Tipo Máquina."
- nome: "Lord of Darkness"
  texto: "You can Special Summon this card (from your hand) by Tributing 2 Fiend and/or Fairy monsters. Cannot be destroyed by battle. Once per turn: You can activate this effect; Special Summon as many \"Lord of Darkness Tokens\" (Fiend/DARK/Level 10/ATK 3000/DEF 1000) as possible to your field, but they cannot attack directly or be destroyed by battle, and are destroyed when this card is destroyed, also you cannot Special Summon other monsters for the rest of this turn. If a monster is destroyed by battle: Inflict 700 damage to your opponent."
  texto_pt: "Você pode Invocar este card por Invocação-Especial (da sua mão) oferecendo como Tributo 2 monstros Demônio e/ou Fada. Não pode ser destruído em batalha. Uma vez por turno: você pode ativar este efeito; Invoque por Invocação-Especial no seu campo o máximo possível de \"Fichas de Senhor das Trevas\" (Demônio/TREVAS/Nível 10/ATK 3000/DEF 1000), mas elas não podem atacar diretamente nem ser destruídas em batalha, e são destruídas quando este card for destruído; além disso, você não pode Invocar outros monstros por Invocação-Especial pelo resto deste turno. Se um monstro for destruído em batalha: cause 700 de dano ao seu oponente."
- nome: "Scab Scar Knight"
  texto: "You can only have 1 \"Scab Scar Knight\" on your side of the field. This card cannot be destroyed by battle. If this card is in face-up Defense Position on the field, destroy this card. All opponent's monsters must attack this card if possible. At the end of the Battle Phase, you can take control of an opponent's monster that battles this card."
  texto_pt: "Você só pode ter 1 \"Scab Scar Knight\" no seu lado do campo. Este card não pode ser destruído em batalha. Se este card estiver em Posição de Defesa com a face para cima no campo, destrua este card. Todos os monstros do oponente devem atacar este card, se possível. No fim da Fase de Batalha, você pode assumir o controle de um monstro do oponente que batalhar com este card."
- nome: "Shield Recovery"
  texto: "Put 3 counters on 1 \"Big Core\" or \"B.E.S.\" monster on the field."
  texto_pt: "Coloque 3 marcadores em 1 monstro \"Big Core\" ou \"B.E.S.\" no campo."
- nome: "Suit of Sword X"
  texto: "Toss a coin once. One of the following effects is applied.\n●Heads: Destroy all monsters your opponent controls.\n●Tails: Destroy all monsters you control."
  texto_pt: "Jogue uma moeda uma vez. Um dos efeitos a seguir é aplicado.\n● Cara: destrua todos os monstros que seu oponente controla.\n● Coroa: destrua todos os monstros que você controla."
- nome: "The Material Lord"
  texto: "Activate only when a Level 4 or higher \"Arcana Force\" monster is in your Graveyard. By sending a Level 5 or 6 \"Arcana Force\" monster from your hand to the Graveyard, add 1 \"The Spiritual Lord\" from your Deck to your hand."
  texto_pt: "Ative somente quando houver um monstro \"Força Arcana\" de Nível 4 ou mais no seu Cemitério. Enviando um monstro \"Força Arcana\" de Nível 5 ou 6 da sua mão para o Cemitério, adicione 1 \"The Spiritual Lord\" do seu Deck à sua mão."
- nome: "The Sky Lord"
  texto: "Activate only when a Level 7 or higher \"Arcana Force\" monster is in your Graveyard. By sending this face-up card and 1 \"The Material Lord\", and \"The Spiritual Lord\" you control to the Graveyard, Special Summon 1 \"Arcana Force Ex - The Light Ruler\" from your hand, Deck, or Graveyard, ignoring the Summoning conditions."
  texto_pt: "Ative somente quando houver um monstro \"Força Arcana\" de Nível 7 ou mais no seu Cemitério. Enviando para o Cemitério este card com a face para cima, 1 \"The Material Lord\" e 1 \"The Spiritual Lord\" que você controla, Invoque por Invocação-Especial 1 \"Arcana Force Ex - The Light Ruler\" da sua mão, do seu Deck ou do seu Cemitério, ignorando as condições de Invocação."
- nome: "The Spiritual Lord"
  texto: "Activate only when a Level 5 or 6 or higher \"Arcana Force\" monster is in your Graveyard. By sending a Level 7 or higher \"Arcana Force\" monster from your hand to the Graveyard, add 1 \"The Sky Lord\" from your Deck to your hand."
  texto_pt: "Ative somente quando houver um monstro \"Força Arcana\" de Nível 5, 6 ou mais no seu Cemitério. Enviando um monstro \"Força Arcana\" de Nível 7 ou mais da sua mão para o Cemitério, adicione 1 \"The Sky Lord\" do seu Deck à sua mão."
- nome: "Toy Emperor"
  texto: "When this card destroys an opponent's monster as a result of battle, you can add 1 Trap Card from your Deck to your hand."
  texto_pt: "Quando este card destruir um monstro do oponente em batalha, você pode adicionar 1 Card de Armadilha do seu Deck à sua mão."
- nome: "Cyber Commander"
  texto: "A strike force equipped with rocket launchers and bazookas."
  texto_pt: "Uma força de ataque equipada com lança-foguetes e bazucas."
- nome: "Cyclon Laser"
  texto: "You can only equip this card to \"Gradius\". Increase the ATK of \"Gradius\" by 300 points. When the equipped \"Gradius\" attacks with an ATK that is higher than the DEF of a Defense Position monster, inflict the difference as Battle Damage to your opponent's Life Points."
  texto_pt: "Você só pode equipar este card a \"Gradius\". Aumente o ATK de \"Gradius\" em 300. Quando o \"Gradius\" equipado atacar com ATK maior que a DEF de um monstro em Posição de Defesa, cause a diferença como dano de batalha aos PV do seu oponente."
- nome: "Flint Missile"
  texto: "Destroy 1 monster equipped with \"Flint\". You can return this card to your Deck instead of sending it to the Graveyard after it resolves."
  texto_pt: "Destrua 1 monstro equipado com \"Flint\". Depois que este card for resolvido, você pode devolvê-lo para o seu Deck em vez de enviá-lo para o Cemitério."
- nome: "Goe Goe the Gallant Ninja"
  texto: "When this card inflicts Battle Damage to your opponent: Your opponent must discard 2 random cards. Your opponent must have at least 5 cards in their hand for you to activate and to resolve this effect."
  texto_pt: "Quando este card causar dano de batalha ao seu oponente: seu oponente deve descartar 2 cards aleatórios. Seu oponente precisa ter pelo menos 5 cards na mão para você ativar e resolver este efeito."
- nome: "Gradius' Option"
  texto: "This card cannot be Normal Summoned or Set. This monster can only be Special Summoned by selecting 1 face-up \"Gradius\" on your side of the field. The ATK and DEF of this card becomes the same as the ATK and DEF of the selected \"Gradius\". If the selected \"Gradius\" is removed from the field, destroy this card."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este monstro só pode ser Invocado por Invocação-Especial escolhendo 1 \"Gradius\" com a face para cima no seu lado do campo. O ATK e a DEF deste card passam a ser iguais ao ATK e à DEF do \"Gradius\" escolhido. Se o \"Gradius\" escolhido sair do campo, destrua este card."
- nome: "Nanobreaker"
  texto: "If this card attacks a face-up Level 3 or lower monster, destroy the monster immediately with this card's effect without applying damage calculation."
  texto_pt: "Se este card atacar um monstro de Nível 3 ou menos com a face para cima, destrua esse monstro imediatamente com o efeito deste card, sem aplicar o cálculo de dano."
- nome: "Option Hunter"
  texto: "Activate only when a monster you control is destroyed by battle and sent to the Graveyard. Gain Life Points equal to the original ATK of the destroyed monster."
  texto_pt: "Ative somente quando um monstro que você controla for destruído em batalha e enviado para o Cemitério. Ganhe PV iguais ao ATK original do monstro destruído."
- nome: "Power Capsule"
  texto: "Select 1 face-up \"Victory Viper XX03\" you control to activate this card. Select 1 effect of \"Victory Viper XX03\", and apply it as this card's effect."
  texto_pt: "Escolha 1 \"Vitória Víbora XX03\" com a face para cima que você controla para ativar este card. Escolha 1 efeito de \"Vitória Víbora XX03\" e aplique-o como efeito deste card."
- nome: "The Statue of Easter Island"
  texto: "A stone monument from Easter Island that launches laser blasts from its rock-hewn lips."
  texto_pt: "Um monumento de pedra da Ilha de Páscoa que dispara rajadas de laser dos lábios esculpidos na rocha."
- nome: "Amphibious Bugroth"
  texto: "\"Ground Attacker Bugroth\" + \"Defender of the Sea\""
  texto_pt: "\"Bugroth de Ataque Terrestre\" + \"Defender of the Sea\""
- nome: "Aqua Dragon"
  texto: "\"Fairy Dragon\" + \"Amazon of the Seas\" + \"Zone Eater\""
  texto_pt: "\"Dragão Fada\" + \"Amazona dos Mares\" + \"Comedor de Zona\""
- nome: "Beastly Mirror Ritual"
  texto: "This card is used to Ritual Summon \"Fiend's Mirror\". You must also Tribute monsters from the field or your hand whose total Levels equal 6 or more."
  texto_pt: "Este card é usado para a Invocação-Ritual de \"Fiend's Mirror\". Você também deve oferecer como Tributo, do campo ou da sua mão, monstros cuja soma dos Níveis seja 6 ou mais."
- nome: "Sentinel of the Seas"
  texto: "A merman warrior that relentlessly attacks those who pollute the seas with their presence."
  texto_pt: "Um guerreiro-tritão que ataca sem trégua quem polui os mares com sua presença."
- nome: "Dokurorider"
  texto: "You can Ritual Summon this card with \"Revival of Dokurorider\"."
  texto_pt: "Você pode Invocar este card por Invocação-Ritual com \"Revival of Dokurorider\"."
- nome: "Fairy Dragon"
  texto: "This beautiful Dragon spirit harbors hidden strength."
  texto_pt: "Este belo espírito de Dragão guarda uma força oculta."
- nome: "Fiend's Mirror"
  texto: "You can Ritual Summon this card with \"Beastly Mirror Ritual\"."
  texto_pt: "Você pode Invocar este card por Invocação-Ritual com \"Beastly Mirror Ritual\"."
- nome: "Flame Viper"
  texto: "A fire-breathing snake whose speed makes it a difficult target."
  texto_pt: "Uma cobra que cospe fogo e é tão veloz que fica difícil acertá-la."
- nome: "Garma Sword"
  texto: "This monster can only be Ritual Summoned with the Ritual Spell Card, \"Garma Sword Oath\"."
  texto_pt: "Este monstro só pode ser Invocado por Invocação-Ritual com o Card de Magia de Ritual \"Garma Sword Oath\"."
- nome: "Garma Sword Oath"
  texto: "This card is used to Ritual Summon \"Garma Sword\". You must also Tribute monsters whose total Levels equal 7 or more from the field or your hand."
  texto_pt: "Este card é usado para a Invocação-Ritual de \"Garma Sword\". Você também deve oferecer como Tributo, do campo ou da sua mão, monstros cuja soma dos Níveis seja 7 ou mais."
- nome: "Javelin Beetle"
  texto: "This card can only be Ritual Summoned with the Ritual Spell Card, \"Javelin Beetle Pact\"."
  texto_pt: "Este card só pode ser Invocado por Invocação-Ritual com o Card de Magia de Ritual \"Javelin Beetle Pact\"."
- nome: "Javelin Beetle Pact"
  texto: "This card is used to Ritual Summon \"Javelin Beetle\". You must also Tribute monsters from the field or your hand whose total Levels equal 8 or more."
  texto_pt: "Este card é usado para a Invocação-Ritual de \"Javelin Beetle\". Você também deve oferecer como Tributo, do campo ou da sua mão, monstros cuja soma dos Níveis seja 8 ou mais."
- nome: "Kaiser Dragon"
  texto: "\"Winged Dragon, Guardian of the Fortress #1\" + \"Fairy Dragon\""
  texto_pt: "\"Winged Dragon, Guardian of the Fortress #1\" + \"Dragão Fada\""
- nome: "Pragtical"
  texto: "\"Trakodon\" + \"Flame Viper\""
  texto_pt: "\"Trakodonte\" + \"Flame Viper\""
- nome: "Revival of Dokurorider"
  texto: "This card is used to Ritual Summon \"Dokurorider\". You must also Tribute monsters from your hand or field whose total Levels equal 6 or more."
  texto_pt: "Este card é usado para a Invocação-Ritual de \"Dokurorider\". Você também deve oferecer como Tributo, do campo ou da sua mão, monstros cuja soma dos Níveis seja 6 ou mais."
- nome: "Skull Guardian"
  texto: "This monster can only be Ritual Summoned with the Ritual Spell Card, \"Novox's Prayer\". You must also offer monsters whose total Level Stars equal 7 or more as a Tribute from the field or your hand."
  texto_pt: "Este monstro só pode ser Invocado por Invocação-Ritual com o Card de Magia de Ritual \"Oração de Novox\". Você também deve oferecer como Tributo, do campo ou da sua mão, monstros cuja soma dos Níveis seja 7 ou mais."
- nome: "Elemental HERO Air Neos"
  texto: "\"Elemental Hero Neos\" + \"Neo-Spacian Air Hummingbird\"\nThis card can only be Special Summoned from your Extra Deck by returning the above cards you control to the Deck. (You do not use \"Polymerization\".) While your Life Points are lower than your opponent's, this card gains ATK equal to the difference. This card returns to the Extra Deck during the End Phase."
  texto_pt: "\"Elemental Hero Neos\" + \"Beija-flor do Ar Neoespacial\"\nEste card só pode ser Invocado por Invocação-Especial do seu Deck Adicional devolvendo para o Deck os cards acima que você controla. (Você não usa \"Polimerização\".) Enquanto os seus PV forem menores que os do seu oponente, este card ganha ATK igual à diferença. Este card volta para o Deck Adicional durante a Fase Final."
- nome: "Toon Kingdom"
  texto: "Activate by removing the top 5 cards of your Deck from play. As long as this card remains on the field, it is treated as \"Toon World\". When any Toon monsters you control are destroyed by battle, you can remove from play 1 card from the top of your Deck instead."
  texto_pt: "Ative banindo os 5 cards do topo do seu Deck. Enquanto este card estiver no campo, ele é tratado como \"Mundo Toon\". Quando algum monstro Toon que você controla for destruído em batalha, em vez disso, você pode banir 1 card do topo do seu Deck."
- nome: "Ocean's Keeper"
  texto: "During battle between this attacking card and a Defense Position monster whose DEF is lower than the ATK of this card, inflict the difference as Battle Damage to your opponent. When this card is destroyed by battle, add 1 \"Thousand-Eyes Jellyfish\" or 1 \"Cranium Fish\" from your Deck to your hand."
  texto_pt: "Durante a batalha entre este card atacante e um monstro em Posição de Defesa cuja DEF seja menor que o ATK deste card, cause a diferença como dano de batalha ao seu oponente. Quando este card for destruído em batalha, adicione 1 \"Thousand-Eyes Jellyfish\" ou 1 \"Cranium Fish\" do seu Deck à sua mão."
- nome: "Thousand-Eyes Jellyfish"
  texto: "This card cannot be Normal Summoned or Set. This card cannot be Special Summoned except by Tributing 1 \"Ocean's Keeper\". Your opponent must play with their hand revealed."
  texto_pt: "Este card não pode ser Invocado por Invocação-Normal nem Baixado. Este card não pode ser Invocado por Invocação-Especial, exceto oferecendo como Tributo 1 \"Ocean's Keeper\". Seu oponente deve jogar com a mão revelada."
- nome: "Miracle Contact"
  texto: "Return the Fusion Material Monsters listed on any Fusion Monster Card from your field or your Graveyard to your Deck. Then, Special Summon any \"Elemental Hero\" Fusion Monster that uses \"Elemental Hero Neos\" as a Fusion Material Monster from your Extra Deck, ignoring the Summoning conditions."
  texto_pt: "Devolva ao seu Deck, do seu campo ou do seu Cemitério, os Monstros Matéria de Fusão listados em qualquer Card de Monstro de Fusão. Depois, Invoque por Invocação-Especial do seu Deck Adicional qualquer Monstro de Fusão \"Elemental Hero\" que use \"Elemental Hero Neos\" como Monstro Matéria de Fusão, ignorando as condições de Invocação."
- nome: "Mormolith"
  texto: "You can Tribute 1 face-up EARTH monster to destroy all face-up monsters with DEF equal to or less than the ATK of the Tributed card."
  texto_pt: "Você pode oferecer como Tributo 1 monstro de TERRA com a face para cima para destruir todos os monstros com a face para cima com DEF igual ou menor que o ATK do card oferecido como Tributo."
- nome: "Fossil Tusker"
  texto: "If this card destroys an opponent's monster by battle and sends it to the GY: Inflict 400 damage to your opponent."
  texto_pt: "Se este card destruir um monstro do oponente em batalha e enviá-lo para o Cemitério: cause 400 de dano ao seu oponente."
- nome: "Phantom Dragonray Bronto"
  texto: "This card is treated as a Normal Monster while face-up on the field or in the Graveyard. While this card is face-up on the field, you can Normal Summon it to have it be treated as an Effect Monster with this effect:\n● The original ATK of this card becomes 2300. If this card attacks, it is changed to Defense Position at the end of the Battle Phase. This card's battle position cannot be changed until the end of your next turn, except with a card effect."
  texto_pt: "Este card é tratado como um Monstro Normal enquanto estiver com a face para cima no campo ou no Cemitério. Enquanto este card estiver com a face para cima no campo, você pode Invocá-lo por Invocação-Normal para que seja tratado como um Monstro de Efeito com este efeito:\n● O ATK original deste card passa a ser 2300. Se este card atacar, ele muda para Posição de Defesa no fim da Fase de Batalha. A posição de batalha deste card não pode mudar até o fim do seu próximo turno, exceto pelo efeito de um card."
- nome: "Cranium Fish"
  texto: "You can Special Summon this card by Tributing 1 \"Ocean's Keeper\". You can discard 1 WATER monster to the Graveyard to destroy 1 face-down card."
  texto_pt: "Você pode Invocar este card por Invocação-Especial oferecendo como Tributo 1 \"Ocean's Keeper\". Você pode descartar 1 monstro de ÁGUA para o Cemitério para destruir 1 card com a face para baixo."
