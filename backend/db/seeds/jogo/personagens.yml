# Personagens para duelar contra o computador, na ordem em que são liberados (escopo 3.10;
# ADR 0013). Escrito à mão, a partir das listas de deck da Yugipedia.
# grupos: computador é o jeito de jogar (1 erra de propósito às vezes, 3 joga o melhor que sabe).
# deck: o deck do personagem no jogo de referência, com o nome e o nível (1 a 10) que ele tem lá.
#   Yugi, Kaiba e Joey não estão no jogo de referência: o deck é o deles em outro jogo da série.
#   fonte: revisão da página do personagem (yugipedia.com/index.php?oldid=N).
#   trocas: carta da lista que não está no pool e a que entrou no lugar.
# carta_simbolo: o prêmio da primeira vitória contra o personagem.
# Dados da Yugipedia (CC BY-SA), reorganizados. Veja o README desta pasta.
grupos:
  - { id: alunos, nome: "Alunos da Academia", computador: 1 }
