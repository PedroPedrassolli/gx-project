# Como cada pacote fica disponível na loja. Escrito à mão, a partir das páginas dos pacotes
# na Yugipedia (a revisão de cada uma está no `fonte` do pacotes.yml).
#   original: resumo da regra do jogo de referência;
#   regra: o que vale aqui (escopo, 3.4). Online não existe história, parceiro do jogo,
#   minigame nem torneio: quando a regra original tem uma alternativa por nível, % ou
#   desafios, fica a alternativa. Quando não tem, a regra fica "pendente" (Anexo C).
# Tipos de regra:
#   sempre                  desde o início
#   dia                     só no dia da semana; a partir de nivel_libera, todo dia
#   nivel                   a partir do nível
#   porcentagem_de_pacote   ter a porcentagem das cartas de outro pacote
#   porcentagem_do_total    ter a porcentagem de todas as cartas do jogo
#   codigo                  digitar o código na loja
#   todos_os_desafios       concluir todos os desafios
#   qualquer                vale qualquer uma das regras da lista
# Dados da Yugipedia (CC BY-SA), reorganizados. Veja o README desta pasta.

